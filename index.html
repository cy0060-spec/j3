<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: 지폐 인쇄 잉크(짙은 청록)와 동전 금색. 학습은 목록+카드 2단, 퀴즈는 한 문제씩 한 칸, 교사용은 표. */
:root{
  --paper:#f3f6f4; --card:#ffffff; --ink:#13241f; --muted:#5b6e67; --line:#d5dfdb;
  --green:#0d5a4c; --green-soft:#e1efe9; --gold:#b98200; --gold-soft:#fbf1d6;
  --ok:#1e7a3f; --ok-soft:#e3f3e8; --bad:#b3362d; --bad-soft:#fae6e3;
  --f-display:"Black Han Sans","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0e1513; --card:#16211e; --ink:#e4ece9; --muted:#9db0a9; --line:#2a3a35;
  --green:#5fc2a8; --green-soft:#1b302a; --gold:#e8b53c; --gold-soft:#2f2712;
  --ok:#5ccf86; --ok-soft:#173022; --bad:#f08075; --bad-soft:#3a1d1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e1513; --card:#16211e; --ink:#e4ece9; --muted:#9db0a9; --line:#2a3a35;
  --green:#5fc2a8; --green-soft:#1b302a; --gold:#e8b53c; --gold-soft:#2f2712;
  --ok:#5ccf86; --ok-soft:#173022; --bad:#f08075; --bad-soft:#3a1d1a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand b{font-family:var(--f-display);font-weight:400;font-size:22px;letter-spacing:.5px;color:var(--green)}
.brand b span{color:var(--gold)}
.brand small{color:var(--muted);font-size:12px}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs button{border:1px solid transparent;background:none;padding:6px 12px;border-radius:999px;font-weight:500;color:var(--muted)}
nav.tabs button[aria-current="true"]{background:var(--green);color:var(--card)}
nav.tabs button:hover:not([aria-current="true"]){border-color:var(--line);color:var(--ink)}
.who{font-size:13px;color:var(--muted)}
.who strong{color:var(--ink)}

.intro{padding-block:22px 6px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end}
.intro h1{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,4vw,36px);line-height:1.2;margin:0;text-wrap:balance}
.intro p{margin:6px 0 0;color:var(--muted);max-width:62ch}
.meter{min-width:220px}
.meter .lbl{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.meter .lbl b{font-family:var(--f-num);color:var(--ink);font-weight:500}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
@media (max-width:640px){.intro{grid-template-columns:1fr}.meter{min-width:0}}

.chips{display:flex;gap:6px;flex-wrap:wrap;padding-block:14px 10px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.chip .n{font-family:var(--f-num);font-size:11px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--green-soft);border-color:var(--green);color:var(--green);font-weight:700}
.chip[aria-pressed="true"] .n{color:var(--green)}

.study{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:20px;padding-bottom:40px;align-items:start}
.listbox{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.search{display:flex;gap:8px;padding:10px;border-bottom:1px solid var(--line)}
.search input{flex:1;min-width:0;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 10px}
.search select{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 6px;font-size:13px}
ol.terms{list-style:none;margin:0;padding:0;max-height:calc(100vh - 290px);min-height:300px;overflow:auto}
ol.terms li button{display:grid;grid-template-columns:34px 1fr 18px;gap:8px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:9px 12px}
ol.terms li button:hover{background:var(--green-soft)}
ol.terms li button[aria-current="true"]{background:var(--green-soft);box-shadow:inset 3px 0 0 var(--green)}
ol.terms .no{font-family:var(--f-num);font-size:12px;color:var(--muted)}
ol.terms .nm{font-weight:500;min-width:0}
ol.terms .ck{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line)}
ol.terms .done .ck{background:var(--ok);border-color:var(--ok);box-shadow:inset 0 0 0 3px var(--card)}
.empty{padding:24px;color:var(--muted);text-align:center}

.detail{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:clamp(18px,3vw,32px);position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}
.dhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.cat{color:var(--green);font-weight:700;letter-spacing:.04em}
.dterm{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,4.6vw,44px);line-height:1.15;margin:10px 0 16px;text-wrap:balance;color:var(--ink)}
.dterm.hide{color:transparent;background:repeating-linear-gradient(135deg,var(--line) 0 8px,transparent 8px 16px);border-radius:8px;user-select:none}
.ddef{font-size:18px;line-height:1.7;max-width:60ch;margin:0}
.dex{margin:18px 0 0;background:var(--gold-soft);border-radius:8px;padding:12px 14px;max-width:62ch}
.dex b{display:block;font-size:12px;color:var(--gold);letter-spacing:.06em;margin-bottom:2px}
details.orig{margin-top:18px;border-top:1px dashed var(--line);padding-top:12px}
details.orig summary{cursor:pointer;color:var(--muted);font-size:14px}
details.orig p{font-size:14px;color:var(--muted);line-height:1.75;max-width:66ch}
.dact{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 16px;font-weight:500}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--green);border-color:var(--green);color:var(--card)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1a1300}
.btn.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:13px}
.sp{flex:1}
.toggle{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.closeM{display:none}
@media (max-width:860px){
  .study{grid-template-columns:1fr}
  ol.terms{max-height:none}
  .detail{position:fixed;inset:0;z-index:20;border-radius:0;overflow:auto;padding-top:calc(env(safe-area-inset-top,0px) + 18px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px);padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
  .detail.mclosed{display:none}
  .closeM{display:inline-block}
}

/* 퀴즈 */
.qwrap{max-width:760px;margin:0 auto;padding-block:26px 50px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:clamp(18px,3.4vw,34px)}
.panel h2{font-family:var(--f-display);font-weight:400;font-size:28px;margin:0 0 8px}
.rules{margin:14px 0;padding:0;list-style:none;display:grid;gap:8px}
.rules li{display:flex;gap:10px}
.rules li::before{content:"";flex:none;width:6px;height:6px;margin-top:10px;border-radius:50%;background:var(--gold)}
.form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0}
.form label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.form input,.form select{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:9px 10px;color:var(--ink);font-size:15px;width:100%}
@media (max-width:520px){.form{grid-template-columns:1fr 1fr}.form label:last-child{grid-column:1/-1}}
.note{border-radius:8px;padding:10px 14px;font-size:14px;margin:12px 0}
.note.warn{background:var(--gold-soft)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.info{background:var(--green-soft)}
.qtop{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:8px}
.qtop b{font-family:var(--f-num);color:var(--ink);font-weight:500}
.qkind{display:inline-block;font-size:12px;font-weight:700;color:var(--green);background:var(--green-soft);border-radius:4px;padding:1px 8px;margin-bottom:10px}
.qtext{font-size:19px;line-height:1.65;margin:0 0 18px}
.qtext.term{font-family:var(--f-display);font-weight:400;font-size:34px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:12px 14px;line-height:1.55}
.opt:hover{border-color:var(--green)}
.opt .k{font-family:var(--f-num);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--paper);font-size:13px}
.opt[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft)}
.opt[aria-pressed="true"] .k{background:var(--green);color:var(--card)}
.opt.short{font-weight:700;font-size:17px}
.score{display:flex;align-items:baseline;gap:10px;margin:8px 0 4px}
.score b{font-family:var(--f-display);font-weight:400;font-size:72px;line-height:1;color:var(--green)}
.score span{font-size:18px;color:var(--muted)}
.review{display:grid;gap:8px;margin-top:16px}
.rv{border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:14px}
.rv.x{border-color:var(--bad);background:var(--bad-soft)}
.rv .t{font-weight:700}
.rv .m{color:var(--muted)}

/* 교사용 */
.twrap{padding-block:22px 50px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:12px 0 18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat small{display:block;color:var(--muted);font-size:12px}
.stat b{font-family:var(--f-num);font-weight:500;font-size:26px}
@media (max-width:640px){.stats{grid-template-columns:1fr 1fr}}
.tgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,320px);gap:18px;align-items:start}
@media (max-width:900px){.tgrid{grid-template-columns:1fr}}
.tbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tbl{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:640px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:500;background:var(--paper);cursor:pointer;user-select:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--f-num)}
.pill{display:inline-block;font-size:12px;border-radius:99px;padding:1px 8px}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.pill.ing{background:var(--gold-soft);color:var(--gold)}
.side{display:grid;gap:14px}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.box h3{margin:0 0 10px;font-size:15px}
.hb{display:grid;grid-template-columns:60px 1fr 46px;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.hb .tr{height:12px;background:var(--line);border-radius:3px;overflow:hidden}
.hb .tr i{display:block;height:100%;background:var(--green)}
.hb .v{text-align:right;font-family:var(--f-num)}
.miss{margin:0;padding-left:20px;font-size:14px}
.miss li{margin:3px 0}
.miss span{color:var(--muted);font-family:var(--f-num);font-size:12px}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:13px}
footer{color:var(--muted);font-size:12px;padding-block:20px 30px;border-top:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand"><b>경제금융용어 <span>160</span></b><small>중3 경제 수업</small></div>
    <nav class="tabs" aria-label="화면">
      <button id="tabStudy" data-v="study" aria-current="true">용어 학습</button>
      <button id="tabQuiz" data-v="quiz">마무리 퀴즈</button>
      <button id="tabTeacher" data-v="teacher" hidden>점수 비교 (교사)</button>
    </nav>
    <div class="who" id="who"></div>
  </div>
</header>

<main>
<section id="vStudy">
  <div class="wrap intro">
    <div>
      <h1>꼭 알아야 할 경제 용어 160개</h1>
      <p>한국은행 「경제금융용어 700선」(2020)에서 중학교 3학년 경제 수업에 꼭 필요한 용어를 골라 쉽게 풀었어요. 한 개씩 읽고 <b>알겠어요</b>를 누르세요. 다 공부하면 마무리 퀴즈를 한 번 볼 수 있어요.</p>
    </div>
    <div class="meter">
      <div class="lbl"><span>내 학습 진도</span><b id="progTxt">0 / 160</b></div>
      <div class="bar"><i id="progBar"></i></div>
    </div>
  </div>
  <div class="wrap">
    <div class="chips" id="chips" role="group" aria-label="분야"></div>
    <div class="study">
      <div class="listbox">
        <div class="search">
          <input id="q" type="search" placeholder="용어 찾기 (예: 환율, 금리)" aria-label="용어 찾기">
          <select id="flt" aria-label="학습 상태">
            <option value="all">전체</option>
            <option value="todo">아직 안 봄</option>
            <option value="done">알겠어요</option>
          </select>
        </div>
        <ol class="terms" id="list"></ol>
      </div>
      <article class="detail mclosed" id="detail" aria-live="polite"></article>
    </div>
  </div>
</section>

<section id="vQuiz" hidden>
  <div class="wrap qwrap" id="quizRoot"></div>
</section>

<section id="vTeacher" hidden>
  <div class="wrap twrap" id="teacherRoot"></div>
</section>
</main>

<script type="application/json" id="termData">[{"t":"기회비용","c":"기초","d":"어떤 것을 선택했을 때 포기해야 하는 것들 중 가장 가치가 큰 것. 선택의 진짜 대가라고 할 수 있다.","x":"토요일에 아르바이트 대신 영화를 봤다면, 받지 못한 아르바이트비가 영화의 기회비용이다.","o":"인간의 욕구에 비해 자원이 부족한 현상을 희소성이라고 한다. 희소한 자원을 가지고 인간의 모든 욕구를 충족시킬 수 없기 때문에 인간은 누구든지 부족한 자원을 어느곳에 우선으로 활용할 것인가를 결정하는 선택을 해야 한다. 즉 다양한 욕구의 대상들가운데서 하나를 고를 수밖에 없다는 뜻이다. 이때 포기해 버린 선택의 욕구들로부터예상되는 유･무형의 이익 중 최선의 이익을 기회비용(opportunity cost)이라고 한다. 자원의 희소성이 존재하는 한 기회비용은 반드시 발생하게 되어 있고 이는 경제문제를 발생시키는 근본요인이 된다. 기업은 기업가가 투자를 선택할 경우 포기한 나머지 선택의 가치인 투자금액의 은행예금 이자 등이 기회비용이 된다.","p":73},{"t":"매몰비용","c":"기초","d":"이미 써 버려서 어떤 선택을 하든 되돌려 받을 수 없는 비용. 합리적으로 결정하려면 매몰비용은 잊어야 한다.","x":"환불이 안 되는 영화표를 샀는데 영화가 재미없다면, 표값이 아까워 끝까지 보기보다 나오는 것이 나을 수 있다.","o":"이미 지급되어 다시는 회수할 수 없는 비용을 말한다. 기회비용은 어떤 것을 선택할 때 포기하여야 하는 비용을 말하지만, 매몰비용(sunk cost)은 무엇을 선택하는가에 상관없이 지급할 수밖에 없는 비용이다. 이미 지급된 매몰비용에 대해서는 더 이상 아무것도 할 수 없고 이로 인해 현재 시점에서 아무것도 포기할 필요가 없기 때문에 매몰비용과 관련된 기회비용은 영(0)이다. 따라서 어떤 선택을 할 때에는 선택에 따른 편익은 극대화하고 비용은 최소화하되 이미 지출된 매몰비용은 무시해야 한다. 의사결정을 할 때매몰비용에 집착하면 의사결정을 제대로 할 수 없게 되는데, 이미 투입한 비용과 노력이 아까워 경제성이 없는 프로젝트를 중단하지 않고 지속함으로써 결국 손실을 키우는 경우를 매몰비용 오류(sunk cost fallacy)라고 한다.","p":107},{"t":"자유재","c":"기초","d":"공기처럼 양이 무한히 많아서 돈을 내지 않고도 마음껏 쓸 수 있는 재화. 반대말은 희소해서 값을 치러야 하는 경제재이다.","x":"맑은 공기는 자유재지만, 미세먼지가 심한 곳에서 파는 공기청정기 속 깨끗한 공기는 경제재가 된다.","o":"희소성이 높지 않고 아무런 대가를 치르지 않아도 무상으로 얻을 수 있는 재화를 말한다. 이는 희소성을 가지며 경제적 거래를 통해 얻을 수 있는 경제재(economic goods)의 반대 개념이다. 자유재(free goods)는 대가를 치르지 않고서도 얼마든지 원하는 만큼 얻을 수 있기 때문에 경제문제를 일으키지 않으며 희소성의 원칙도 적용되지 않는다. 현실세계에서 자유재는 매우 드물다. 공기, 물, 햇빛 등이 전통적으로 자유재로 고려되었으나 양질의 생수를 높은 비용으로 구매하고, 맑은 공기를 마시기 위하여 휴양림을 찾아가는 등 기존에 자유재로 고려되던 재화들이 상황 변화에 따라 경제재로 변하기도 한다. 일반적으로 재화라고 하면 경제재를 의미하며 통상 경제학은 경제재를 분석대상으로 한다.","p":237},{"t":"공공재","c":"기초","d":"여러 사람이 함께 쓰고, 돈을 내지 않은 사람도 쓰지 못하게 막기 어려운 재화. 시장에 맡기면 부족하게 공급되므로 주로 정부가 공급한다.","x":"국방, 치안, 가로등, 등대가 대표적인 공공재다.","o":"공공재는 모든 개인이 공동으로 이용할 수 있는 재화 또는 서비스를 의미한다. 국방･경찰･소방･공원･도로 등과 같이 정부에 의해서만 공급할 수 있는 것이라든가 또는 정부에 의해서 공급되는 것이 바람직하다고 사회적으로 판단되는 재화 또는 서비스가 이에 해당한다. 공공재에는 보통 시장가격은 존재하지 않으며 수익자부담 원칙도 적용되지 않는다. 따라서 공공재 규모의 결정은 정치기구에 맡길 수밖에 없다. 공공재의 성질로는 어떤 사람의 소비가 다른 사람의 소비를 방해하지 않고 여러 사람이 동시에 편익을 받을 수 있는 비경쟁성･비선택성, 대가를 지급하지 않은 특정 개인을 소비에서 제외하지 않는 비배제성 등을 들 수 있다.","p":27},{"t":"부가가치","c":"기초","d":"생산 과정에서 새로 더해진 가치. 판매한 금액에서 원재료 등 다른 기업에서 사 온 것의 값을 뺀 것이다.","x":"밀가루 1,000원어치로 빵을 만들어 3,000원에 팔았다면 부가가치는 2,000원이다.","o":"부가가치(value added)는 일정 기간 동안에 경제활동주체가 생산활동에 참여하여 새로 이 창출한 가치를 말하는데, 총산출에서 중간투입(소비)을 차감하여 구할 수 있다. 국민소득계정에서는 부가가치라는 용어를 대신하여 국내총생산으로 기록하고 있으며, 구체적으로는 피용자보수, 영업잉여, 고정자본소모, 생산 및 수입세, 보조금으로 구성되어 있다.","p":128},{"t":"한계비용","c":"기초","d":"물건을 하나 더 만들 때 추가로 드는 비용.","x":"빵을 10개 만들 때 총비용이 1만 원, 11개는 1만 800원이라면 11번째 빵의 한계비용은 800원이다.","o":"한계비용은 재화나 서비스를 한 단위 더 생산하는데 들어가는 비용의 증가분을 의미한 다. 즉 비용증가분을 생산증가분으로 나눈 값이다. 예를 들면, 생수 100병을 생산하는데 10,000원의 비용이 소요된다면 생수 1병의 평균생산비용은 100원이다. 추가로 생수한 병을 더 생산하여 101병, 102병을 생산할 때 비용이 각각 10,080원, 10,150원이라면 생수 101병째의 한계비용은 10,080원 - 10,000원 = 80원, 102병째의 한계비용은 70원이 된다. 생산의 경제성을 분석하는 데에 있어 비용이 얼마나 소요되는가도(10,080원→ 10,150원) 중요하지만 생산을 늘림에 따라 증가하는 추가적 비용이 어떻게 변하는가를 (80원→70원) 살피는 것도 매우 중요하다. 왜냐하면 생산의 목적이 이윤을 극대화하는 데 있다면 반드시 한계비용의 움직임을 살펴보아야 판단할 수 있기 때문이다. 이는 수학적으로 어떤 함수값(총비용)의 최소는 변수(생산규모)의 미분값이 0이 되는 곳에서 결정되는데, 한계의 개념은 바로 미분과 일맥상통한다는 것을 상기하면 이해될 수 있다. 일반적으로 생산이 증가하면서 한계비용은 점차 줄어들다가 어느 생산규모에 이르면 다시 늘어나기 시작한다.","p":321},{"t":"한계효용","c":"기초","d":"어떤 재화를 하나 더 소비할 때 추가로 얻는 만족감. 보통 많이 소비할수록 점점 줄어든다(한계효용 체감).","x":"배고플 때 먹는 첫 번째 피자 조각이 다섯 번째 조각보다 훨씬 맛있게 느껴진다.","o":"어떤 상품이나 서비스의 소비를 한 단위 늘림에 따라 추가로 증가한 효용을 한계효용이라 한다. 한계효용은 총효용의 변화분을 소비량의 변화분으로 나눔으로써 계산할 수 있다.","p":322},{"t":"수확체감의 법칙","c":"기초","d":"다른 조건은 그대로 두고 한 가지 생산요소(예: 노동자)만 계속 늘리면, 추가로 늘어나는 생산량이 점점 줄어드는 현상.","x":"좁은 밭에 일꾼을 계속 늘리면 처음엔 수확이 크게 늘지만 나중엔 거의 늘지 않는다.","o":"어떤 생산물을 만드는 데 필요한 자본･노동･토지 등의 생산요소 가운데 자본과 토지는 일정하게 유지하고 노동의 투입량을 증가시킬 경우, 생산물 전체는 증가하지만 추가로 투입되는 노동량 1단위당 생산물의 증가는 차차 감소한다는 법칙이다. 수확체감의 법칙 (law of diminishing returns)은 원래 농지에서 작업하는 노동자 수의 증가에 대한 1인당수확량의 증가와 관련된 것이었으나 이후 모든 산업부문에서 특정 생산요소의 투입량이 고정된 단기에 발생하는 현상으로 확장되었고 “한계생산력 체감의 법칙”으로 일반화되었다.","p":163},{"t":"규모의 경제","c":"기초","d":"생산 규모를 키울수록 제품 하나를 만드는 평균 비용이 낮아지는 현상.","x":"자동차 회사가 차를 100대보다 10만 대 만들 때 한 대당 비용이 훨씬 싸다.","o":"일반적인 경우 기업이 재화 및 서비스 생산량을 늘려감에 따라 추가적으로 소요되는 평균 생산비용도 점차 늘어난다. 그런데 일부 재화 및 서비스 생산의 경우에는 생산량이 늘어날수록 평균비용이 감소하는 현상이 나타나는데 이를 규모의 경제(economies of scale)라고 한다. 이런 현상은 초기 생산단계에서 막대한 투자비용이 필요하지만 생산에 는 큰 비용이 들지 않는 철도･통신･전력산업에서 나타나는데, 이들 산업은 생산이 시작된 이후 수요가 계속 늘게 되면서 평균 생산비용도 감소하는 특징을 갖고 있다. 또한 분업에 따른 전문화 이익이 존재하는 경우에도 규모의 경제가 나타난다. 예를 들어각자 케이크를 만드는 3명의 제빵사를 생각해보자. 이들이 따로 케이크를 만들 때 보다 한 명은 반죽만, 한 명은 굽기만, 한 명은 장식만 하는 분업을 할 경우 생산량이 늘어나면 서 평균 비용도 줄게 된다.","p":49},{"t":"범위의 경제","c":"기초","d":"한 기업이 여러 제품을 함께 생산할 때, 각각 다른 기업이 따로 생산하는 것보다 비용이 적게 드는 현상.","x":"은행이 예금 창구에서 보험과 펀드도 함께 팔면 시설과 인력을 같이 쓸 수 있다.","o":"한 기업이 여러 제품을 같이 생산할 경우가 개별 기업이 한 종류의 제품만을 생산하는 경우보다 평균 생산비용이 적게 들 때 범위의 경제(economies of scope)가 존재한다고 말한다. 승용차와 트럭을 같이 생산하는 기업의 경우 소재부품이나 조립라인 등의 생산시설을 공동으로 사용할 수 있는 이점을 갖게 된다. 이러한 현상은 동일한 생산요소를 사용하거나 기업 운영 및 마케팅 활동을 함께 하거나 생산물이 가진 특성 때문에도 나타날수 있다. 연구개발･판매･생산은 공동으로 하면서 제품의 종류만 달리할 경우 비용이 절감될 수 있다. 또한 기존 산업과 비슷한 산업에 진출할 경우 시너지효과를 기대할 수 있는데, 구체적인 예로는 은행이 보험 상품을 판매하는 방카슈랑스를 들 수 있다.","p":122},{"t":"인적자본","c":"기초","d":"사람이 교육, 훈련, 경험을 통해 갖추게 된 지식과 기술. 경제 성장의 중요한 원동력이다.","x":"직업 훈련을 받아 기술을 익히면 생산성이 높아지고 더 높은 소득을 기대할 수 있다.","o":"개인이 보유한 능력, 기술숙련도, 지식 등을 포괄하는 것으로 노동의 질적 수준을 의미한다. 인적자본(human capital)이란 개념은 1960년대 초에 미국의 농업경제학자인 슐츠(T. Schultz)가 제시한 것으로, 그는 “교육을 통해서 형성되는 능력은 임금, 소득, 저축, 자본형성 등을 근본적으로 변화시킨다”며 “경제성장에서 오래 풀리지 않는 수수께끼를 인적자본에 대한 투자라는 개념을 통해서 분명하게 해결할 수 있다”고 인적자본증가가 경제성장에 중요함을 지적하였다. 인적자본이 경제성장에 미치는 영향은 경제성장이론에서 중요한 연구 분야인데, 전통적인 성장이론에 따르면 GDP성장률은 장기적으로 인구 증가율과 외생적으로 주어지는 기술진보율에 따라서 결정된다. 반면 1980년대이후의 신성장이론(new growth theory)에 따르면 인적자본, 내생적 기술발전, 제도 등이 경제성장에서 중요한 역할을 한다. 생산요소로서의 인적자본은 노동생산성을 높여 직접적으로 경제성장에 기여할 뿐 아니라 물적자본과 결합하여 자본축적에 따라 자본생산성이 하락하는 속도를 늦추는 효과가 있다. 또한 인적자본은 기술혁신의 중요한 요소로서 기술발전 속도를 높여 경제성장률을 높인다. 부모의 인적자본 증가도 세대 간의 연결을 통해 지속적으로 인적자본을 증가시키며 경제성장률을 높이는 효과가 있다.","p":224},{"t":"죄수의 딜레마","c":"기초","d":"서로 협력하면 모두에게 좋은데, 각자 자기 이익만 생각하다 보니 결국 모두에게 나쁜 결과가 나오는 상황.","x":"두 주유소가 손님을 뺏으려 서로 가격을 계속 내리다 둘 다 손해를 보는 경우.","o":"전략적 상황에 처한 경제주체들의 행동을 분석하는데 유용하게 활용되는 게임이론의 한 예로서, 협력적인 선택이 양자에게 최선임에도 불구하고 자신의 이익에 치중한 선택으로 인해 오히려 두 사람 모두에게 바람직하지 않은 결과를 가져오는 상황을 말한다. 죄수의 딜레마(Prisoners' Dilemma)는 1950년 미국 프린스턴대 터커(A. Tucker) 교수가 게임이론을 설명하기 위해 이용한 다음의 예화에서 비롯되었다. 경찰이 두 용의자 Ⅰ, Ⅱ를 격리하여 심문하면서 자백을 이끌어 내려고 다음과 같이 말하였다고 가정한다. ① 한 사람이 자백하고 다른 사람은 입을 다물었다면 자백한 사람은 1단위의 보상, 입을 다문 사람은 2단위의 벌금형이 부과된다. ② 두 사람이 모두 자백하면 각각에게는 1단위의 벌금형이 부과된다. ③ 두 사람이 모두 자백하지 않으면 Ⅰ과 Ⅱ는 혐의가 없다. 이러한 상황에서 두 사람이 직면하는 보상행렬은 아래와 같아지는데, Ⅰ과 Ⅱ는 모두 상대방의 전략과 상관없이 자백하는 전략을 선택하게 되므로 결과적으로 두 사람이 서로를 믿고 자백하지 않는 전략을 취할 때보다 나쁜 결과에 직면하게 된다. 용의자 Ⅱ 구분용의자 Ⅰ 자백함자백하지 않음자백함 (-1, -1) (1, -2) 자백하지 않음 (-2, 1) (0, 0) 즉 개인적인 수준에서는 합리적인 선택이 구성원 전체로 보아서는 비합리적인 선택이 되는 결과를 가져오는 딜레마를 낳게 되는데, 이 같은 죄수의 딜레마 문제는 광고경쟁, 기업의 환경오염, 국가간 군비경쟁 등 다양한 상황에 적용될 수 있다.","p":258},{"t":"치킨게임","c":"기초","d":"어느 한쪽이 물러서지 않으면 둘 다 큰 피해를 보는데도 끝까지 양보하지 않고 맞서는 극단적 경쟁.","x":"반도체 기업들이 손해를 보면서도 가격을 계속 내려 상대가 망하기를 기다리는 경쟁.","o":"치킨게임(chicken game)은 다양한 분야에서 이해 당사자가 모두 최악의 상황에 직면 할 가능성을 초래하는 극단적인 경쟁을 가리키는 용어로 쓰이고 있다. 미국에서는 한때젊은이들 간에 서로 마주 보는 방향으로 차를 몰고 가는 게임이 성행했는데, 이때 마주달리는 차가 충돌하기 직전에 운전대를 바꾸는 사람이 겁쟁이(chicken)로 놀림을 받았다 고 한다. 이러한 종류의 게임에서 승리하기 위해서는 상대방에게 자신의 선택을 절대로 바꾸지 않겠다는 의지를 정확히 전달하는 것이 매우 중요하다. 그러나 이해당사자가 모두 자신에게 유리한 선택만을 고집할 경우 모두에게 최악의 결과가 도래하게 된다. 게임 전문가들은 치킨게임이 이해당사자들 간에 반복될 경우 이론적으로는 자신에게 가장 유리한 선택을 포기하게 됨으로써 최악의 상황에 도달하지는 않는다고 한다.","p":290},{"t":"파레토최적","c":"기초","d":"다른 누군가를 손해 보게 하지 않고서는 어느 누구도 더 좋아질 수 없는 상태. 자원이 가장 효율적으로 배분된 상태를 뜻한다.","x":"누군가의 몫을 줄이지 않고는 다른 사람의 몫을 늘릴 수 없게 피자가 다 나누어진 상태.","o":"경제적 최적의 의미를 규정하는 개념의 하나이다. 자원배분이 가장 효율적으로 이루어진 상태여서 더 이상의 개선 여지가 없는 상황을 의미한다. 생산 측면에서는 어느 한 재화의 생산량을 증가시키기 위해서는 반드시 다른 재화의 생산을 감소시켜야 하는 상태에 있어야 한다. 교환 측면에서는 어느 소비자의 효용을 증가시키기 위해서는 반드시 다른소비자의 효용을 감소시킬 수밖에 없는 상태에 있어야 한다. 이 두 가지 조건이 동시에 성립하고 있는 상황을 파레토 최적이라 한다. 그러나 파레토 최적은 소득분배에 대해서는 설명을 할 수 없으며, 파레토 최적의 상태 또한 유일하지 않다는 한계를 내포하고 있다.","p":313},{"t":"대체재","c":"시장","d":"서로 대신 쓸 수 있는 재화. 한 재화의 가격이 오르면 다른 재화의 수요가 늘어난다.","x":"버터와 마가린, 콜라와 사이다. 콜라값이 오르면 사이다를 더 찾게 된다.","o":"비슷한 만족을 얻을 수 있어 서로 경쟁 관계에 있는 재화 또는 서비스를 말한다. 핫도그와 햄버거, 스웨터와 셔츠처럼 어느 한 제품이 다른 제품을 대신하여 사용할 수 있을 때 이 두 제품은 서로 대체관계에 있다고 한다. 또한 두 제품 중 어느 한 제품의 가격상승이 다른 재화의 수요증가를 초래할 때 이 두 제품은 서로 대체관계에 있다고 한다. 비싸진 삼겹살 대신 닭고기를 구매 했다면 이들 두상품은 서로 대체재이다. 다만, 이 같은 구분은 사람들의 평균적인 소비행태에 기초한 것이므로 사람에 따라서는 다르게 느낄 수도 있다.","p":88},{"t":"보완재","c":"시장","d":"함께 써야 만족이 커지는 재화. 한 재화의 가격이 오르면 다른 재화의 수요도 줄어든다.","x":"프린터와 잉크, 자동차와 휘발유. 휘발유값이 오르면 자동차 수요도 줄 수 있다.","o":"두 가지 이상의 재화가 함께 사용됨으로써 효용을 얻을 수 있는 재화로, 한 재화의 가격이 하락함에 따라 다른 한 재화의 수요가 증가하는 관계에 있는 재화를 말한다. 소비자 효용의 관점에서 볼 때, 소비자는 보완재 관계에 있는 두 재화를 따로 소비할 때의 효용이 함께 소비할 때의 효용보다 줄어든다. 승용차와 휘발유, 컴퓨터와 소프트웨어 등은 보완재의 예이다.","p":125},{"t":"수요탄력성","c":"시장","d":"가격이 변할 때 사람들이 사려는 양(수요량)이 얼마나 민감하게 변하는지를 나타내는 정도.","x":"쌀은 값이 올라도 덜 먹기 어려워 탄력성이 작고, 명품 가방은 값이 오르면 수요가 크게 줄어 탄력성이 크다.","o":"상품의 가격 변화비율에 대한 수요량의 변화비율을 수요의 가격탄력성(price elasticity of demand)이라 한다. 탄력성은 반응의 크기를 분석하는 데 의미가 있다. 충격을 주는 쪽과 반응하는 쪽의 변화율을 비교하여 같은 경우를 단위 탄력적이라고 하고, 반응하는 쪽의 변화율이 더 높으면 탄력적, 작으면 비탄력적이라고 한다. 수요의 가격탄력성의 경우, 한 상품의 가격의 변화비율과 수요량의 변화비율이 동일할 경우 수요의 가격탄력성은 1이 되며, 이 경우 수요가 단위 탄력적이라고 한다. 수요량의 변화비율이 가격의 변화비율보다 작아서 수요의 가격탄력성이 1보다 작으면 수요가 비탄력적이라고 한다. 반면 수요량의 변화비율이 가격의 변화비율보다 높아서 수요의 가격탄력성이 1보다 크게 되면 수요가 탄력적이라고 한다.","p":160},{"t":"공급탄력성","c":"시장","d":"가격이 변할 때 생산자가 팔려는 양(공급량)이 얼마나 민감하게 변하는지를 나타내는 정도.","x":"농산물은 가격이 올라도 금방 더 기를 수 없어 단기에는 공급탄력성이 작다.","o":"공급탄력성은 가격변화에 대한 공급의 민감도를 측정하는 척도이다. 공급탄력성은 공급량의 변화율을 가격의 변화율로 나누어 측정한다(공급량의 변화율÷가격의 변화율). 만일 1%의 가격 상승이 1%보다 더 큰 공급량 증가를 가져오면 공급은 탄력적이라하며, 1%의 가격 상승이 1%보다 더 적은 공급량 증가를 가져오면 공급은 비탄력적이라한다. 공급량 변화율과 가격변화율이 같다면 공급탄력성은 1이고, 공급은 단위 탄력적이 라 한다. 또한, 어떤 재화의 공급량이 가격변동에 전혀 영향을 받지 않는다면 공급의 가격탄력성은 영(0)이고, 이 재화의 공급은 완전 비탄력적이라 하며 이 재화의 공급곡선은 수직선의 형태를 보인다. 반대로 한 재화의 공급곡선이 수평선일 때 이 재화의 공급은 완전 탄력적이며 공급탄력성은 무한대(∞)가 된다. 공급탄력성은 가격의 상승과 하락에 따라 공급량을 조절하는 생산자의 능력에 따라 달라진다.","p":28},{"t":"독점/과점","c":"시장","d":"한 기업이 시장을 혼자 차지하면 독점, 몇 개의 기업이 나누어 차지하면 과점이다. 경쟁이 적어 가격이 높아지기 쉽다.","x":"과거의 전기 공급(독점), 이동통신 3사(과점)가 예이다.","o":"독점(monopoly)은 완전경쟁의 정반대인 시장형태로 어느 기업이 시장의 유일한 공급자로 그 기업이 공급하는 상품에 밀접한 대체재가 존재하지 않는 경우를 말한다. 독점이 생기는 이유는 생산요소 독점, 정부규제, 생산기술 문제 등으로 시장에 진입장벽이 존재하기 때문이다. 독점기업은 시장의 유일한 공급자이기 때문에 시장가격이 한계수입보다 높은 수준에 형성되므로 소비자는 결과적으로 비싼 가격을 지불해야 한다. 독점기업은 소비자의 지불용의에 따라 같은 재화에 다른 가격을 부과하여 이윤을 증가시킬 수도 있다. 한편, 독점은 아니나 라면, 아이스크림, 가전제품 시장 등과 같이 시장에 유사하거나동일한 상품을 공급하는 공급자가 소수에 불과할 때에는 과점(oligopoly)이라고 부른다. 과점시장은 기업들의 의사결정 과정이 서로 연결된 상호의존 관계를 가지는 특징이 있다. 과점시장은 시장에 존재하는 기업의 수, 기업 간 관계의 밀접 정도에 따라 독점시장처럼될 수도 있고 완전경쟁시장처럼 될 수도 있다. 독점기업이나 과점기업은 마음대로 가격을 올리거나 생산량을 줄여 소비자들에게 피해를 줄 수 있기 때문에 세계 각국에서는 독점이나과점을 막기 위해 노력하고 있다. 우리나라에서도 “독점규제 및 공정거래에 관한 법률”을 통하여 기업들이 시장에서 소비자에 대하여 힘을 남용하고 불공정한 거래행위를 하는 것을 규제하여 경제 전반의 공정하고 자유로운 경쟁을 촉진하고 있다.","p":90},{"t":"카르텔","c":"시장","d":"같은 업종의 기업들이 경쟁을 피하려고 가격이나 생산량을 몰래 서로 약속하는 것(담합). 법으로 금지된다.","x":"라면 회사들이 함께 가격을 올리기로 약속했다가 공정거래위원회에 적발되는 경우.","o":"카르텔(cartel)이란 동종 혹은 유사 산업에서 경쟁하는 기업들이 상호간의 경쟁을 제한하고 완화함으로써 시장을 지배할 목적으로 결성한 기업연합체를 말한다. 카르텔에 속한 기업들은 협약을 맺고 가격책정, 생산량 할당 등에 대해 개별 기업 간의 행동을 조정할 기구를 만들고 이를 통해 가격과 생산량을 결정한다. 이럴 경우 카르텔에 속한 기업들은 서로 경쟁할 경우에 비해 더 많은 이익을 얻을 수 있다. 따라서 카르텔은 공급자들이 소수인 과점기업들 사이에 주로 형성된다. 그러나 카르텔은 경제의 비효율성초래, 경제발전 저해 등과 같이 국민경제에 미치는 폐해가 크므로 일반적으로 금지 및 규제의 대상이 된다. 대표적인 국제규모의 카르텔로는 중동 산유국이 주축이 된 석유수출국기구(OPEC; Organization of Petroleum Exporting Countries)를 들 수 있다.","p":291},{"t":"자연독점","c":"시장","d":"시설을 갖추는 데 엄청난 돈이 들어서 한 기업이 혼자 공급하는 것이 가장 비용이 적게 드는 경우 생기는 독점.","x":"수도, 전기, 가스처럼 관이나 전선을 깔아야 하는 산업.","o":"상품의 특성 때문에 시장에서 자연스럽게 생겨난 독점을 말한다. 자연독점(natural monopoly)은 생산규모가 커질수록 생산비용이 계속 낮아지는 규모의 경제(economies of scale)가 존재할 때 발생한다. 규모의 경제가 큰 산업의 경우에는 시장에 먼저 진입하여 대규모 생산능력을 갖춘 선발기업이 가격경쟁력을 바탕으로 다른 후발기업의 시장진입을 자연스럽게 봉쇄할 수 있다. 예를 들어 지역 주민에게 수돗물을 공급하는 경우 공급자는 도시 곳곳에 수도관을 설치해야 한다. 이때 복수의 공급자가 수돗물을 공급한다면 공급자마다 수도관을 설치해야 하는데, 이를 위해서는 막대한 고정비용을 지출해야한다. 따라서 수돗물을 공급하는 평균비용은 하나의 공급자가 존재할 때 가장 낮다. 전기나 전화 등을 공급하는 경우도 마찬가지이다. 자연독점은 초기 투자비용이 커서 투자비용 회수에 오랜 기간이 걸린다는 특징을 가지고 있다. 자연독점은 생산 면에서는 가장 효율적이지만, 소비자로서는 독점의 피해가 나타날 수도 있기 때문에 많은 나라에서 는 자연독점기업이 적당한 가격을 유지하도록 규제하고 있다.","p":235},{"t":"불완전경쟁시장","c":"시장","d":"판매자가 적거나 제품이 서로 달라서 기업이 가격에 영향을 줄 수 있는 시장. 독점, 과점, 독점적 경쟁시장이 해당한다.","x":"동네 미용실들은 서비스가 조금씩 달라 가격을 각자 정할 수 있다.","o":"시장에 의한 가격결정에 어떠한 영향도 미칠 수 없는 상태를 완전경쟁이라 한다. 이는 경제주체의 자유로운 시장 진입과 퇴출, 다수의 공급자와 수요자 존재, 거래되는 재화및 서비스의 동질성, 정보의 완전성이 충족되는 경우에만 존재 가능하다. 현실에서는 이러한 요건이 충족되기 어려워 독점시장, 과점시장과 독점적 경쟁시장과 같은 형태의 불완전경쟁시장이 나타나게 된다. 하나의 공급자가 존재하여 재화 및 서비스의 가격을 결정하는 시장을 독점시장이라고 한다. 두 개 이상의 소수 공급자만이 서로 경쟁하는 시장을 과점시장이라고 하는데, 이러한 예로는 국내의 이동통신서비스, 자동차 시장 등을 들 수 있다. 마지막으로 독점적 경쟁시장에서는 다수의 공급자가 각기 특화된 재화 및 서비스를 생산함으로써 독자적으로 가격을 결정할 수 있는 시장지배력을 행사할 수 있다.","p":133},{"t":"정보의 비대칭성","c":"시장","d":"거래하는 두 사람 중 한쪽만 더 많은 정보를 가진 상태. 역선택이나 도덕적 해이 같은 문제가 생긴다.","x":"중고차를 파는 사람은 차의 결함을 알지만 사는 사람은 잘 모른다.","o":"시장에서 거래의 당사자인 쌍방 간에 상호작용에 필요한 정보량에 차이가 있는 경우를 말한다. 이러한 정보의 비대칭성(information asymmetry)은 효율적인 자원배분을 불가 능하게 하며 역선택(adverse selection)이나 도덕적 해이(moral hazard) 등의 문제를 낳는다. 역선택은 중고차시장의 경우와 같이 판매자가 파는 물건의 속성에 대해 구매자보다 정보가 많을 때 생기는데 이런 상황에서는 판매자가 구매자에게 품질이 낮은 물건을 시장에 아예 내놓지 않게 되거나, 구매자가 좋지 않은 물건을 비싸게 사게 된다. 노동시장이나 보험시장에서도 역선택이 문제가 되는데, 노동시장의 경우 기업이 근로자의 생산성을 잘 알 수 없어 시장균형이 사회적으로 비효율적인 상태가 될 수 있으며 보험시장의 경우에는 사고를 당할 가능성이 낮은 사람들은 보험조건이 자신들에게 불리하기 때문에 아예 보험에 가입하지 않게 되는 문제가 생긴다. 도덕적 해이는 대리인이 사용자를 위해 어떤 임무를 수행할 때 발생하는 문제로, 대리인의 부적절하거나 비도적적인 행위에 따른 위험을 지칭한다. 자동차보험에 가입한 후 안전운전을 소홀히 하거나, 국민건강보험이 잘 되어 있다고 해서 특별한 이상이 없는데도 병원에 자주 가는 것등은 도덕적 해이의 예이다. 도덕적 해이를 방지하기 위해 사용자는 대리인이 보다 성실하게 행동하도록 인센티브를 지급하거나 감시체계를 구축하는 등의 방법을 활용한다.","p":252},{"t":"역선택","c":"시장","d":"정보가 부족한 쪽이 오히려 불리한 상대와 거래하게 되는 현상. 거래 전에 생기는 문제이다.","x":"건강에 자신 없는 사람일수록 보험에 더 많이 가입하려 하는 현상.","o":"역선택(adverse selection)이란 정보의 비대칭이 있을 때 즉, 거래의 당사자 중 정보가 한쪽에만 있는 상황에서, 정보가 없는 쪽은 바람직하지 못한 상대방과 거래할 가능성이 큰 것을 의미한다. 중고차 시장에서 상등품의 중고차가 사라지는 경우나, 생명보험시장에서 건강한 사람은 보험에 가입하지 않고 건강하지 않은 사람들만 생명보험에 가입하는 현상, 금융시장에서 신용도가 높은 대출자는 시장을 이용하지 않고 신용도가 낮은 대출자만 남게 되는 사례 등이 있다. 이러한 역선택은 자원의 효율적 배분을 저해할 뿐만 아니라 시장을 위축시키는 심각한 문제를 발생시킬 수 있으므로 정보의 비대칭성을 없애고 적절한 유인을 통하여 역선택을 완화할 필요가 있다.","p":191},{"t":"도덕적 해이","c":"시장","d":"거래나 계약을 한 뒤, 상대가 내 행동을 잘 알 수 없다는 점을 이용해 책임감 없이 행동하는 것.","x":"자동차 보험에 가입한 뒤 사고가 나도 보험사가 낸다며 운전을 함부로 하는 경우.","o":"도덕적 해이는 거래당사자의 한쪽이 상대보다 양질의 정보를 더 많이 가지고 있는 상태(정보의 비대칭성)에서 계약이 이루어진 후에 나타날 수 있는 문제이다. 예를 들면 주주와 전문경영인, 은행과 차입자간의 계약을 들 수 있다. 전문경영인은 회사의 경영상황에 대해 주주보다 더 많은 정보를 가지고 주주가 아닌 자신의 이익을 극대화하는 경우가 있을 수 있다. 이를 전문경영인의 도덕적 해이라 한다. 또한 은행으로부터 대출을 받은 차입자가 계약대로 차입금을 적절한 투자에 사용하는지를 은행이 정확히 확인할 수 없기 때문에 발생하는 문제도 도덕적 해이에 해당한다. 도덕적 해이를 해결하기위해서는 정보의 비대칭성을 완화하거나, 전문경영인이나 차입자(대리인)의 이해를 주주나 은행(주인)의 이해와 일치시키는 장치를 마련하는 게 중요하다. 여기서 주인과 대리인의 이해가 일치하지 않아 발생하는 문제를 주인-대리인 문제 또는 대리인 문제라고 한다. 한편 정보의 비대칭성 상태에서 계약이 이루어지기 전에 나타날 수 있는 문제로는 역선택이 있다.","p":89},{"t":"외부효과","c":"시장","d":"어떤 행동이 다른 사람에게 의도치 않게 이익이나 손해를 주는데도 그 대가를 주고받지 않는 현상.","x":"공장의 매연(부정적 외부효과), 이웃집 정원의 꽃향기(긍정적 외부효과).","o":"어떤 경제주체의 행위가 본인의 의도와는 관계없이 다른 경제주체에게 의도하지 않은 혜택이나 손해를 발생시키지만 그 영향에 대한 보상이 이루어지지 않는 현상을 말한다. 외부효과(externality)는 긍정적인 효과와 부정적인 효과로 구분된다. 부정적외부효과(negative externality)는 자동차의 배기가스나 소음, 공장의 매연이나 폐수 등과 같이 제3자의 경제적 후생수준을 낮추는 외부효과로 외부불경제(external diseconomy) 라고도 한다. 반면 교육에 따른 편익, 신기술의 개발에 따른 파급효과 등과 같이 제3자에 게 이득을 주는 외부효과를 긍정적 외부효과(positive externality) 또는 외부경제 (external economy)라고 한다. 외부효과가 생기면 이에 대한 대가나 비용을 시장에서 지불하지 않아도 되기 때문에 해로운 외부효과를 만들어 내는 개인이나 기업은 굳이 외부효과를 줄이려 하지 않게 되며, 이로운 외부효과를 만들어내는 개인이나 기업도 굳이 외부효과를 많이 만들어 낼 필요성을 느끼지 못하게 돼 외부효과를 시장에만맡겨놓을 경우 전체적인 자원배분이 비효율적으로 될 수 있게 된다.","p":201},{"t":"정부실패","c":"시장","d":"시장의 문제를 바로잡으려고 정부가 개입했는데 오히려 효율성이 떨어지거나 문제가 더 나빠지는 현상.","x":"집값을 잡으려 만든 규제가 공급을 줄여 집값이 더 오르는 경우.","o":"시장실패를 교정하기 위한 정부의 시장개입과 규제가 자원배분의 효율성을 높이기보다 오히려 해치는 경우가 있는데 이를 시장실패에 비유하여 정부실패(government failure)라고 한다. 정부실패는 규제자의 불완전한 지식･정보, 규제수단의 불완전성, 규제자의 경직성 등의 이유로 발생한다. 또한 정부는 대부분 영역에서 독점적인 지위를 갖고 있어 민간기업처럼 경쟁해야 할 필요가 없으며 성과에 따라 보상을 받는 유인제도가 부족하므로 정부실패가 발생하기도 한다. 예컨대 최근 여러 국가에서 정부는 국민의 안정된 노후생활을 보장하기 위해 사회보장제도를 시행하고 있다. 그러나 정부가 사회보장제도를 잘못 운영하면 근로능력이 있음에도 고의로 일을 하지 않는 계층이 생기고 사회보장기금이 방만하게 운영되는 등 심각한 비효율이 초래될 수 있다. 이런 경우정부의 시장개입이 오히려 자원배분의 효율성을 악화시키는 정부실패를 가져오게 된다. 정부실패를 방지하기 위해서는 정부정책의 투명성 강화, 정부부문에의 유인제도 도입, 입법부･감사원･시민단체 등에 의한 감시활동 강화 등의 조치가 필요하다.","p":253},{"t":"밴드웨건효과","c":"시장","d":"다른 사람들이 많이 사니까 나도 따라 사는 현상. 유행에 편승하는 소비이다.","x":"친구들이 모두 같은 브랜드 패딩을 입자 나도 사고 싶어지는 것.","o":"소비자가 대중적으로 유행하는 정보를 쫓아 상품을 구매하는 현상을 말한다. 악대차(band wagon)는 악단을 선도하며 요란한 연주로 사람들을 끌어 모은다. 이 밴드웨건을 우르르쫓아가는 사람들의 모습에서 유래됐다. 밴드웨건효과(Bandwagon effect)는 결국 유행에 동조함으로써 타인들과의 관계에서 소외되지 않으려는 비이성적인 심리에서 비롯된다. 주식시장이나 부동산시장의 거품형성과 붕괴 현상도 밴드웨건효과로 설명할 수 있다.","p":121},{"t":"베블런효과","c":"시장","d":"가격이 오를수록 오히려 수요가 늘어나는 현상. 자신을 과시하려는 소비 때문에 생긴다.","x":"명품 가방 가격이 올랐는데도 더 잘 팔리는 현상.","o":"가격이 상승하면 수요량이 감소하는 수요의 법칙에 반하는 재화를 베블런재라 부른다. 사치재 또는 명품 등이 이에 해당하는데 이러한 재화는 가격이 비쌀수록 소비가 증가하는 경향이 있다. 이러한 과시 욕구를 반영한 소비현상을 베블런효과(Veblen's effect)라고 부른다. 베블런은 이러한 현상을 처음으로 관찰한 학자의 이름이다.","p":123},{"t":"속물효과(스놉효과)","c":"시장","d":"많은 사람이 사는 물건은 오히려 사기 싫어하고 남들과 다른 특별한 것을 찾는 현상. 밴드웨건효과와 반대이다.","x":"한정판 운동화만 고집하고, 흔해지면 더 이상 신지 않는 경우.","o":"개성을 추구하는 사람들은 단지 다른 사람들이 많이 구입한다는 이유만으로 특정물품을 구입하지 않거나 심지어 자신의 옷과 똑같은 옷을 입은 사람을 보면 그 옷을 더 이상 입지 않는다. 명품브랜드 소비에서 흔히 일어나는 현상인데 이를 속물효과 또는 스놉효과(Snob effect)라고 한다. 즉 특정 상품을 소비하는 사람이 많아질수록 그상품에 대한 수요는 줄어들고 값이 오르면 오히려 수요가 늘어난다. 이 용어는 1950년레이번슈타인(H. Leibenstein)에 의해 스놉(재산과 지위로 거만을 떠는 속물)이 선호하는 브랜드 물품이 일반 구매층까지 영향을 미치는 현상을 지칭하는 데 처음 사용되었다. 이와는 반대로 전시효과는 상품을 소비하는 사람이 많아질수록 수요도 증가하는 경우를 가리킨다.","p":159},{"t":"엥겔의 법칙","c":"시장","d":"소득이 늘어날수록 전체 소비 지출 중 음식비가 차지하는 비율(엥겔계수)이 줄어드는 현상.","x":"월 소득이 늘어도 밥을 몇 배로 먹지는 않으니 식비 비중은 줄어든다.","o":"엥겔의 법칙은 독일의 통계학자 엥겔이 벨기에 노동자의 가계조사를 통해 발견하였다. 1857년 당시 작센지방의 통계국장이었던 엥겔은 153세대의 가계지출을 조사한 결과 저소득 가계일수록 소비지출에서 식료품비가 차지하는 비율이 높고, 고소득 가계일수록식료품비가 차지하는 비율이 낮음을 발견하였다. 또한 가계의 소비지출은 식료품비, 피복비, 주거비, 광열비, 문화비 등 다섯 가지로 크게 구분할 수 있는데 소득의 증가에 따라 식료품비에 대한 지출비중은 점차 하락하고 피복비, 주거비, 광열비에 대한 지출비중은 비교적 변동하지 않지만, 문화비에 대한 지출비중은 소득의 증가에 따라 급속히증가한다는 것을 발견하였다. 이와 같은 사실들을 ｢엥겔의 법칙｣이라고 하며, 가계의 소비지출 중에서 식료품비가 차지하는 비중을 특히 엥겔계수(Engel's coefficient)라고 한다. 일반적으로 식료품은 필수품으로 소득의 많고 적음에 관계없이 어느 정도는 반드시 소비하여야 하지만 어느 수준 이상은 소비할 필요가 없는 재화이다. 그러므로 저소득가계라도 일정 금액의 식료품비 지출은 이루어지며, 소득이 증가하여도 식료품비는 그보다 크게 증가하지는 않는다. 이와 같은 이유로 엥겔계수는 소득수준이 높아짐에 따라 점차 감소하게 되는 것이다.","p":188},{"t":"경기","c":"국민경제","d":"나라 경제 전체의 활동이 활발한지 침체되어 있는지를 나타내는 상태. 호황과 불황이 되풀이된다.","x":"경기가 좋으면 기업이 사람을 더 뽑고 가게도 붐빈다.","o":"경기(business conditions)라는 단어는 일상생활에서 경제적인 형편을 뜻하는 말로 자주 사용된다. 기업들은 매출이 늘고 채산성이 좋아지면 경기가 좋다고 인식할 것이고, 가계는 임금이 인상되거나 주식, 부동산 등의 자산가격이 올라 살림이 좋아지면 경기가 좋아졌다고 느낄 것이다. 범위를 넓혀 국민경제 전체를 대상으로 볼 때, 경기가 좋다는 것은 생산, 소비, 투자 등의 경제활동이 평균 수준 이상으로 활발한 경우를 의미한다. 장기적 관점에서 경기는 항상 일정한 수준을 유지하는 것이 아니라 생산･물가･고용이 상승하는 시기와 하락하는 시기가 주기적으로 순환을 반복하는 경제활동의 상황을 의미한다. 경기는 호황기→후퇴기→불황기→회복기→호황기가 반복되면서 끊임없이 변동하며, 이렇게 경기의 일정한 움직임이 되풀이 되는 것을 경기의 순환(business cycle)이라고 한다. 이러한 경기의 순환과정은 확장국면과 수축국면이 교대로 되풀이 되는 반복성, 여러 측면의 경제활동을 포괄하는 다양성, 확장 및 수축 양상이 시차를 두고 경제 각부문에 전달되는 파급성, 그리고 일정한 방향으로 계속 확대해 나가는 지속성 등의 특징을 갖는다. 경기를 판단하는 방법으로는 생산, 투자, 고용, 수출 등 경제 각 부문의 여러 경제지표의 움직임을 분석하는 방법, 종합경기지표로 판단하는 방법, 기업가나소비자들의 경기판단 및 전망 설문조사 결과에 의한 방법 등이 있다.","p":12},{"t":"경기종합지수","c":"국민경제","d":"생산, 소비, 고용 등 여러 경제 지표를 하나로 묶어 경기의 흐름을 보여 주는 지수. 선행·동행·후행 지수로 나뉜다.","x":"선행지수가 오르기 시작하면 몇 달 뒤 경기가 좋아질 것으로 예상한다.","o":"산업생산지수, 소매판매액지수 등 개별 경제지표들은 경제활동의 한 측면만을 반영하고 있어 나라 경제의 전반적인 상황을 종합적으로 파악하기 어렵다. 이에 따라 개별경제지표들을 가공･합성하여 경기종합지수(CI; Composite Index)를 작성하여 활용하고 있다. 경기종합지수는 각 부문별로 경기를 잘 나타내는 경제지표들을 선정한 다음 계절및 불규칙 요인의 제거, 진폭의 표준화 등의 가공 과정을 거친 후 합산하여 하나의 지수로 만든 것이다. 경기종합지수는 지수의 변동 방향으로 경기변동의 방향을 가늠할 수 있고, 지수의 변동 폭으로 경기변동의 크기를 알 수 있기 때문에 경기흐름을 종합적으로 판단하는데 매우 유용하다. 한편, 경기종합지수는 경기에 대한 선･후행 관계에 따라선행종합지수, 동행종합지수, 후행종합지수로 구분한다. 선행종합지수는 비교적 가까운장래의 경기 동향을 예측하는 데 활용되며, 동행종합지수는 현재의 경기상태를 판단하는 데 이용되고, 후행종합지수는 경기변동을 사후에 확인하는 데 활용된다.","p":14},{"t":"경제성장률","c":"국민경제","d":"일정 기간 동안 나라 경제의 규모(실질 GDP)가 얼마나 커졌는지를 비율로 나타낸 것.","x":"올해 실질 GDP가 작년보다 2% 늘었다면 경제성장률은 2%이다.","o":"경제성장률이란 일정 기간(분기 또는 연간) 중 한 나라의 경제규모, 즉 국민소득규모가 늘어난 정도를 백분율로 표시한 것이다. 국민소득은 생산활동의 범위나 생산물의 가치평가 방법 등에 따라 여러 가지 개념으로 나뉘지만, 경제성장률을 계산하는 데가장 일반적으로 쓰이는 국민소득은 각 경제활동부문에서 창출해낸 실질 부가가치의 합계, 즉 실질국내총생산(실질GDP)이다. 따라서 경제성장률은 대부분의 경우 실질GDP 증가율을 의미한다. 경제성장률    금년 실질 G D P  전년 실질 G D P ×  전년 실질 G D P 한편 수 개년 동안의 연평균 경제성장률을 계산하고자 할 때에는 복리 연율의 산식을 이용하여 연평균 경제성장률을 산출한다.","p":16},{"t":"국내총생산(GDP)","c":"국민경제","d":"일정 기간 동안 한 나라 안에서 새로 생산된 최종 재화와 서비스의 시장 가치를 모두 더한 것. 국적은 따지지 않는다.","x":"우리나라에 있는 외국 기업 공장이 만든 제품도 우리나라 GDP에 포함된다.","o":"국내총생산(GDP; Gross Domestic Product)은 한 나라의 영역 내에서 가계, 기업, 정부 등 모든 경제 주체가 일정 기간 동안 생산활동에 참여하여 창출한 부가가치 또는 최종 생산물을 시장가격으로 평가한 합계로서 여기에는 국내에 거주하는 비거주자(외국인)에게 지급되는 소득도 포함된다. 한편 가격의 적용방법에 따라 명목GDP(Nominal GDP)와 실질GDP(Real GDP)로 구분되며, 명목GDP는 국가경제의 규모나 구조 등을 파악하는 데 사용되며 실질GDP는 경제성장, 경기변동 등 전반적인 경제활동의 흐름을 분석하는 데 이용된다.","p":38},{"t":"국민총소득(GNI)","c":"국민경제","d":"한 나라 국민이 국내외에서 벌어들인 소득을 모두 더한 것. 생산된 곳이 아닌 국적을 기준으로 한다.","x":"해외에서 일하는 우리 국민이 번 돈은 우리나라 GNI에 포함된다.","o":"국민총소득(GNI; Gross National Income)은 한 나라의 국민이 생산활동에 참여한 대가로 받은 소득의 합계로서 외국으로부터 국민(거주자)이 받은 소득(국외수취 요소소득)은 포함되고 국내총생산 중에서 외국인에게 지급한 소득(국외지급 요소소득)은 제외된다. 한편, 국내총생산은 국내에 거주하는 모든 생산자가 생산한 부가가치를 합산한 것이므로 국외거래에 의하여 발생하는 생산은 고려하지 않아 양자는 국외순수취요소소득 만큼의 차이가 발생하게 된다. 즉, 국민총소득은 국내총생산에서 국외순수취요소소득을 더하여 산출할 수 있다.","p":42},{"t":"국민소득","c":"국민경제","d":"한 나라의 가계, 기업, 정부가 일정 기간 동안 새로 생산한 가치를 모두 더한 것. GDP, GNI 등으로 측정한다.","x":"1인당 국민소득은 국민들의 평균적인 생활 수준을 알아볼 때 쓰인다.","o":"국민소득(NI; National Income) 이란 넓은 의미로 볼 때 한 나라 안에 있는 가계, 기업, 정부 등의 모든 경제주체가 일정 기간에 생산한 재화와 용역의 가치를 화폐단위로 평가하여 합산한 것으로 흔히 국민총소득으로 불리고 있다. 좁은 의미의 국민소득은 요소비용에 의한 국민소득으로 한 나라 국민이 제공한 생산요소에서 발생한 소득의 총액, 즉 노동에 대한 대가인 피용자보수와 자본 및 경영에 대한 대가인 영업잉여의 합계로서 고정자본소모와 순생산 및 수입세는 포함되지 않는다. 즉 한 나라 국민이 벌어들인 순수한 소득을 나타내는 지표로서 다음과 같이 산출한다.","p":40},{"t":"국민소득 3면 등가의 법칙","c":"국민경제","d":"국민소득은 생산, 분배, 지출의 세 측면 중 어느 쪽에서 계산해도 그 크기가 같다는 법칙.","x":"빵 3,000원어치를 생산하면, 그 3,000원은 누군가의 소득이 되고 누군가가 3,000원을 지출한 것이다.","o":"국민소득이란 한 국가에 있는 가계, 기업, 정부 등 모든 경제주체가 일정 기간(보통 1년)에 새로이 생산한 재화 및 서비스의 가치를 금액으로 평가하여 더한 총합을 의미한 다. 즉, 한 국가의 국민 전체가 일정 기간에 새로 벌어들인 소득의 총합이라고 할 수있다. 국가 경제에서 발생하는 소득의 원천은 근본적으로 기업의 생산에 있으며, 기업의 생산은 가계의 소비가 있기 때문에 가능하다. 기업은 생산한 재화와 서비스를 가계에 판매하여 소득을 획득하며 가계는 기업에 생산요소를 제공하고 소득을 얻는다. 국민소득이 가계와 기업 사이를 순환하게 되는 것인데 이와 같은 국민소득의 순환과정 중에서 어느 순간을 측정하는가에 따라 국민소득을 부르는 명칭이 약간씩 다르다. 한 국가 내에서 생산된 총생산물의 가치를 측정하면 이를 생산국민소득이라 한다. 가계의 총지출가치를 측정하면 지출국민소득이라 하며 한 국가 내 전체 구성원의 총소득의 가치를 측정하면 분배국민소득이라 한다. 개념상 이 3가지 국민소득은 순환하고 있는 국민소득을 단지 서로 다른 순간에 측정한 것에 불과하므로 그 크기는 어디서 측정하더라도 항상 동일하다. 즉 생산국민소득 = 지출국민소득 = 분배국민소득의 관계가 성립한다. 이처럼 국민소득이 생산, 지출, 분배의 3가지 관점 중 어느 부문에서 측정하더라도 항상 동일해야 한다는 사실을 국민소득 3면 등가의 법칙이라고 한다.","p":41},{"t":"명목국내총생산/실질국내총생산","c":"국민경제","d":"명목 GDP는 그해 가격으로 계산한 GDP, 실질 GDP는 기준 연도 가격으로 계산해 물가 변화를 뺀 GDP이다. 실제 성장은 실질 GDP로 본다.","x":"생산량은 같은데 물가만 올랐다면 명목 GDP는 늘지만 실질 GDP는 그대로다.","o":"명목국내총생산(Nominal GDP)은 한 나라 안에서 생산된 최종생산물의 가치를 그생산물이 생산된 기간의 가격을 적용하여 계산한 것으로 경상GDP(GDP valued at current prices)라고도 불린다. 명목GDP의 변동분에는 최종생산물의 수량과 가격변동분이 혼재되어 있다. 명목GDP는 경제규모 등의 파악에 이용된다. 반면 실질국내총생산 (Real GDP)은 한 나라 안에서 생산된 최종생산물의 가치를 기준년도의 가격으로 측정한 것으로 불변가격GDP(GDP valued at constant prices)라고도 불린다. 실질GDP는 우리나라를 비롯한 많은 국가에서 UN이 권고한 국제기준인 국민계정체제에 따라 연쇄가중법에 의해 추계되고 있다. 연쇄가중법은 기준연도의 가격이나 가중치를 계속 적용하지 않고 기준연도의 명목금액에 연쇄물량지수를 곱하여 실질GDP를 산출한다. 실질GDP는 경제성장, 경기변동 등 전반적인 경제활동의 흐름을 분석하는데 이용된다.","p":110},{"t":"잠재GDP성장률","c":"국민경제","d":"물가를 크게 올리지 않으면서 한 나라가 노동과 자본을 최대한 활용해 이룰 수 있는 성장률.","x":"인구가 줄고 고령화되면 잠재성장률도 낮아진다.","o":"잠재GDP성장률은 노동이나 자본 등의 자원을 최대로 활용하였을 때 유지되는 실질 GDP의 증가율로서 한 나라 경제의 최대성장능력을 의미한다. 잠재GDP는 일정한 잣대로 추계할 수 없는 추상적인 개념이어서, 추정에 사용되는 원칙이나 통계분석기법 등에 따라 결과가 상이하다는 한계가 있다. 한편 잠재GDP는 성장률도 의미가 있지만 그수준이 실제GDP보다 얼마나 높은가 또는 낮은가를 살피는 것도 매우 중요하다. 실제 GDP성장률이 잠재GDP성장률을 상회하더라도 그 수준은 잠재GDP를 하회할 수도 있다. 또한 우리나라와 같이 대외의존도가 매우 높은 경우에는 정의에 의한 생산요소의 완전고용으로 규정하기에는 어려움이 있다. 그럼에도 잠재GDP성장률은 경제의 적정성장목표를 설정하는 데 유용하여 거시경제정책을 수립하고 시행하는 데 있어 널리 활용되고 있다.","p":238},{"t":"가계처분가능소득","c":"국민경제","d":"가계가 번 소득에서 세금 등을 빼고 실제로 마음대로 소비하거나 저축할 수 있는 소득.","x":"월급 300만 원에서 세금과 보험료 40만 원을 내면 처분가능소득은 260만 원이다.","o":"가계처분가능소득(PDI; Personal Disposable Income)은 가계가 맘대로 소비와 저축으로 처분할 수 있는 소득을 의미한다. 흔히 국민들의 생활수준을 파악해 볼 수 있는 지표로 1인당 GNI가 널리 쓰이고 있으나 국민총소득에는 가계 뿐 아니라 기업 금융기관정부가 벌어 들인 소득이 모두 포함되어 있다. 따라서 기업과 금융기관 등이 가계부문보다 더 많은 소득을 벌어 1인당 국민총소득(GNI)이 높아진 경우에는 가계가 느끼는 체감경기는 전체 경기와 괴리가 있게 된다. 1인당 가계총처분가능소득(PGDI; Personal Gross Disposable Income)은 가계부문의 총처분가능소득을 연앙인구로 나누어 계산한 지표로 가계의 구매력을 가장 정확히 가늠해 볼 수 있는 소득지표이다.","p":3},{"t":"한계소비성향","c":"국민경제","d":"소득이 늘어난 만큼 중 소비에 쓰는 비율.","x":"용돈이 1만 원 늘었을 때 8천 원을 쓴다면 한계소비성향은 0.8이다.","o":"개인의 소득은 소비와 저축으로 나누어지는데, 소득 중에서 소비로 쓰이는 비율을 소비성향, 저축에 들어가는 비율을 저축성향이라고 한다. 한계소비성향은 새로 늘어난소득 중에서 소비로 지출되는 비율을 가리킨다. 즉 소득의 증가분을 △Y, 소비의 증가분을 △C로 하여 △C/△Y로 나타낸다. 일반적으로 물가상승기에는 한계소비성향이 높고 또 저소득층은 고소득층에 비하여 한계소비성향이 높은 경향이 있다.","p":322},{"t":"골디락스경제","c":"국민경제","d":"물가는 안정되어 있으면서 경제는 꾸준히 성장하는, 너무 뜨겁지도 차갑지도 않은 이상적인 경제 상태.","x":"동화 속 소녀 골디락스가 너무 뜨겁지도 차갑지도 않은 수프를 고른 데서 나온 말이다.","o":"골디락스경제(Goldilocks economy)는 경기과열에 따른 인플레이션과 경기침체에 따른 실업을 염려할 필요가 없는 최적 상태에 있는 건실한 경제를 가리킨다. 이는 영국의 전래동화인 골디락스와 곰 세 마리(Goldilocks and the three bears)에 등장하는 금발머리 소녀의 이름에서 유래하였다. 동화에 따르면 엄마 곰이 끓인 뜨거운 수프를 큰 접시와 중간 접시 그리고 작은 접시에 담은 후 가족이 이를 식히기 위해 산책을 나갔는데, 이 때 집에 들어온 골디락스가 아기 곰 접시에 담긴 너무 뜨겁지도 않고 너무 차지도 않은 적당한 온도의 수프를 먹고 기뻐하는 상태를 경제에 비유한 것이라 한다. 즉 경기과 열이나 불황으로 인한 높은 수준의 인플레이션이나 실업률을 경험하지 않는 양호한 상태가 지속되는 경제를 지칭한다.","p":26},{"t":"더블딥","c":"국민경제","d":"경기가 나빠졌다가 잠깐 회복되는 듯하더니 다시 나빠지는 현상. W자형 경기 침체라고도 한다.","x":"경기 회복 기대감이 커졌는데 다시 소비와 생산이 줄어드는 경우.","o":"경기가 두 번(double) 떨어진다(dip)는 뜻으로, 경기침체가 발생한 후 잠시 경기가 회복되다가 다시 경기침체로 접어드는 연속적인 침체 현상을 의미한다. 더블딥(double dip)은 2001년 미국 모건스탠리사의 이코노미스트였던 로치(S. Roach)가 미국경제를 진단하면서 처음 사용한 용어로, 경기순환의 모습이 영문자 “W”를 닮았다 해서 “W자형경기변동”(또는 “W자형 불황”)이라고도 한다. 일반적으로 경기침체는 2분기 연속 마이너스 성장을 보이는 경우를 말하므로 더블딥은 경기침체가 발생하고 잠시 회복 기미가 관측되다 다시 2분기 연속 마이너스 성장에 빠지는 것으로, 1980년대 초 있었던 미국의 경기침체는 더블딥의 예로 자주 거론된다. 당시 미국경제는 석유파동의 영향 등으로 1980년 1월부터 7월까지 침체에 빠졌으나 이후 1981년 1/4분기까지 빠르게 성장하였는 데, 연준이 인플레이션을 제압하기 위하여 금리를 빠르게 올림에 따라 1981년 7월부터 1982년 11월까지 다시 불황에 빠지는 경기침체를 경험한 바 있다.","p":89},{"t":"디커플링/커플링","c":"국민경제","d":"커플링은 한 나라 경제가 다른 나라나 세계 경제와 비슷하게 움직이는 것, 디커플링은 서로 다르게 따로 움직이는 것이다.","x":"미국 주가가 떨어지는데 우리나라 주가는 오른다면 디커플링이다.","o":"디커플링(decoupling)이란 탈동조화라고 번역할 수 있는데, 어떤 나라나 지역의 경제가 인접한 다른 국가나 전반적인 세계 경제의 흐름과는 다른 모습을 보이는 현상을 말한다. 최근의 디커플링의 예로는 금융위기 이후 신흥국가나 유로지역 국가 등이 특히미국 경제와 다른 모습을 보이는 것을 들 수 있다. 이외에도 주가나 금리, 환율 등 일부 경제 변수의 흐름이 국가 간 또는 특정국가내에서 서로 다른 흐름을 보이는 현상도 디커플링이라고 할 수 있다. 국가 간의 경우 미국의 주가와 한국의 주가가 다른 방향으로 움직이거나, 한 국가 내에서의 경우 주가가 하락함에도 해당국 통화가 강세 현상을 보이는 경우 등을 말한다. 반대로 한 나라 또는 지역의 경제가 인접한 다른 국가나세계경제 흐름과 유사한 흐름을 보이는 것을 커플링(동조화･coupling)이라 한다.","p":98},{"t":"인구고령화","c":"국민경제","d":"전체 인구 중 65세 이상 노인 인구의 비율이 높아지는 현상. 일할 사람이 줄어 경제 성장과 재정에 부담이 된다.","x":"65세 이상 인구가 20%를 넘으면 초고령사회라고 한다.","o":"인간의 평균 수명이 증가하고 출산율이 감소함에 따라 선진국을 중심으로 고령자의 인구 비율이 점차 높아져 가는 현상 또는 그러한 상태를 고령화라고 한다. 국제 연합(UN) 은 총인구에서 65세 이상 인구가 7% 이상일 경우 고령화 사회, 14% 이상일 경우 고령사회, 20% 이상일 경우 초고령 사회로 구분하였다. 우리나라의 65세 이상 고령인구는 2000년에 총인구의 7.2%에 이르러 본격적인 고령화사회로 진입했으며, 2018년에는 14.3%로 고령사회에 진입하고, 2026년에는 20.8%로 초고령사회에 진입할 것으로 전망된다. 이와 같은 인구의 고령화 현상은 노동력 부족, 생산성 저하 등 노동시장 변화를 야기하여 경제성장을 둔화시키고, 노년 인구 부양비 상승과 연금, 의료, 복지비용 등의 증가 문제를 발생시킬 수 있다. 반면 고령화는 노인의 정치적 영향력 확대, 여가 및 레저 활동 주도계층 변화, 교육제도 재편 등 파급효과가 나타날 수 있을 뿐 아니라건강약품과 식품산업, 의료서비스, 금융서비스, 레저 또는 노인주택산업 등의 고령친화산업 분야의 성장 등 산업구조변화를 가져올 수 있다. 우리나라의 고령화속도는 세계에 서 유래가 없을 정도로 빨라 고령화 문제의 해결을 위해서는 출산율을 높이고, 정년을 연장하거나 노인 일자리를 창출하는 등의 복지대책이 필요하다.","p":223},{"t":"합계출산율","c":"국민경제","d":"여성 한 명이 평생 동안 낳을 것으로 예상되는 평균 자녀 수.","x":"합계출산율이 약 2.1명은 되어야 인구가 줄지 않고 유지된다.","o":"한 여성이 가임기간인 15세에서 49세 사이에 낳을 것으로 기대되는 평균 출생아수를 측정하는 통계를 말하는데, 실제로는 5세 기준으로 구분한 연령별로 출산율을 계산한 후 이를 합한 개념이기 때문에 합계출산율(total fertility rate)이라고 부른다. 동 지표는 한 국가의 출산력 비교에 유용하게 쓰이고 있으며, 향후 인구는 물론 노동력의 변동을 가늠하는 데 매우 유용한 지표로 활용되고 있다. 유럽경제위원회(UNECE)는 선진국에서 현재의 인구를 그대로 유지하는 데 필요한 합계출산율이 최소 2.1명이어야한다고 추산한 바 있다. 우리나라의 합계출산율은 1982년 2.39명을 정점으로 1983년 2.03명으로 낮아진 이후 계속 떨어져 2016년에는 1.17명의 매우 낮은 수준을 기록하였다. 앞으로도 합계출산율 수준이 현 수준보다 크게 높아지지 않는 한 우리나라 인구가 2030년 이후에는 빠르게 감소할 것으로 예상되고 있다.","p":324},{"t":"인플레이션","c":"물가고용","d":"물가가 지속적으로 오르는 현상. 같은 돈으로 살 수 있는 물건이 줄어들어 돈의 가치가 떨어진다.","x":"작년에 1,000원 하던 과자가 올해 1,200원이 되었다.","o":"물가수준이 지속적으로 상승하는 현상을 인플레이션이라고 한다. 여기서 물가는 개별상품의 가격을 평균하여 산출한 물가지수를 의미한다. 인플레이션은 물가상승 지속기간및 상승폭, 제품의 질적 수준 향상 여부, 정부의 가격통제에 따른 암시장 가격 상승여부와 같은 점을 고려할 때 언제 인플레이션이라고 정의할 것인가에 대해 이견이 있을 수 있다. 통상 연 4~5% 정도의 물가상승률이 관측되면 일반적으로 인플레이션이 발생했다고 판단한다.","p":225},{"t":"디플레이션","c":"물가고용","d":"물가가 지속적으로 떨어지는 현상. 사람들이 소비를 미루고 기업 이익이 줄어 경기 침체로 이어지기 쉽다.","x":"값이 더 떨어질 거라 생각해 지금 물건을 사지 않고 기다리는 현상이 나타난다.","o":"물가가 지속적으로 하락하는 현상을 말한다. 디플레이션(deflation) 하에서는 물가상승률이 마이너스로 하락하는 인플레이션이 나타난다. 디플레이션이 발생하는 원인은 생산물의 과잉공급, 자산거품의 붕괴, 과도한 통화 긴축정책, 생산성 향상 등 다양하다. 그러나 궁극적으로는 유통되는 통화의 양이 재화 및 서비스의 양보다 적기 때문에 화폐가치는 상승하고 반대로 물가는 하락하는 디플레이션이 발생한다는 점에 이견이 없다. 디플레이션이 발생하면 통화의 가치는 상승하고 실물자산의 가치는 하락함에 따라 인플레이션과 반대 방향으로 소득 및 부의 비자발적 재분배가 발생한다. 이외에도 실질금리 상승에 따른 총수요 감소, 실질임금 상승에 따른 고용 및 생산 감소, 소비지출연기에 따른 경제활동 위축, 부채디플레이션에 따른 총수요 감소, 통화정책 및 재정정책등 정책적 대응 제약, 디플레이션 악순환 가능성 등의 문제를 일으킬 수 있다.","p":98},{"t":"스태그플레이션","c":"물가고용","d":"경기가 침체(스태그네이션)되어 있는데도 물가는 계속 오르는(인플레이션) 현상.","x":"1970년대 석유 파동 때 경기는 나빠지는데 물가는 크게 올랐다.","o":"제2차 세계대전 이전까지 경기침체기에는 물가가 하락하고 경기호황기에는 물가가 상승하는 것이 일반적 현상이었다. 그러나 제2차 세계대전 이후 특히 1970년대 들어두 번의 유가파동을 겪으면서 실업이 늘어나는 침체기에도 인플레이션이 지속되는 현상이 나타나기 시작하였다. 이와 같이 실업과 인플레이션이 동시에 증가하는 현상을 스태그플레이션이라 한다. 스태그플레이션이란 스태그내이션(stagnation:경기침체)과 인플레이션(inflation:물가상승)을 합성한 용어이다. 즉 국민소득의 증가세가 축소되는 경기침체와 전반적인 물가수준이 지속적으로 상승하는 인플레이션이 동시에 발생하는 현상을 말한다. 스태그플레이션이 발생하게 되면 실업률과 물가상승률이 모두 상승하므로 국민의 경제적 고통은 크게 늘어나게 된다.","p":169},{"t":"애그플레이션","c":"물가고용","d":"농산물(agriculture) 가격이 크게 올라 전체 물가가 오르는 현상.","x":"가뭄으로 곡물 값이 오르자 빵, 라면, 사료 가격까지 함께 올랐다.","o":"농업이라는 뜻의 Agriculture와 인플레이션(inflation)의 합성어로 농산물 가격의 급격한 상승이 일반 물가의 상승을 일으키는 현상을 말한다. 미국의 시사주간지 타임 (2007.6.14 인터넷판)은 옥수수로 대체연료인 에탄올을 생산하는 경우가 많이 늘어나면 서 옥수수 값이 급격히 오를 것으로 예상함에 따라 옥수수를 원료로 사용하는 식품은 물론 옥수수가 쓰이는 각종 제품의 가격이 오를 가능성이 있다고 보고한 바 있다. 쓰임새가 무척 다양한 옥수수 값 상승의 영향은 과자나 빵 등 식품의 가격에만 국한되지 않으며, 설탕의 대체재로 사용되고 옥수수로 만드는 감미료의 가격이 상승하여 이를 사용하는 각종 청량음료나 사탕 등의 제품가격에도 영향을 미치게 되었다. 또한, 옥수수는 가축사료로 쓰임에 따라 가축을 기르는 비용의 상승으로 이어져 계란, 우유, 베이컨등의 제품가격도 오를 수밖에 없다. 이외에 종이나 옷, 기저귀, 샴푸, 페인트, 크레용등에도 옥수수가 들어가기 때문에 이들 제품의 가격도 오를 가능성이 있다. 이러한 애그플레이션의 원인으로는 ① 지구 온난화와 이상 기후 등으로 인한 농작물 생산량감소 ② 급격한 도시화로 인한 농경지 축소 및 농가수 감소 등으로 인한 농작물 생산량감소 ③ 옥수수, 사탕수수 등을 이용한 바이오연료 개발 및 육류 소비 증가에 따른곡물 수요 증가 등으로 농산물에 대한 수요가 폭등한 것 등을 들 수 있다.","p":184},{"t":"수요견인 인플레이션","c":"물가고용","d":"사려는 사람(수요)이 공급보다 많이 늘어나 물가가 오르는 현상.","x":"경기가 좋아 사람들이 소비를 많이 늘리면 물건 값이 오른다.","o":"수요견인 인플레이션(demand-pull inflation)이란 경기과열 등으로 인해 개인들의 재화나 서비스에 대한 수요가 크게 늘면서 상대적으로 부족해진 재화 및 서비스의 물가가 지속적으로 상승하게 되는 것을 말한다. 이러한 수요견인 인플레이션은 생산요소시장과 생산물시장 모두에서 초과수요가 발생할 때 특히 분명하게 나타난다. 확대재정정책, 과도한 통화량 증가, 민간소비나 투자의 갑작스러운 변동에 따른 수요충격 등은 총수요를 증가시켜 수요견인 인플레이션을 발생시킨다. 예컨대 정부가 침체에 빠진경기를 부양하기 위해서 정부지출을 확대하고 세율을 인하하는 등의 급격한 확대 재정정책을 시행하였다면 총수요가 증가하여 수요견인 인플레이션이 발생할 수 있다.","p":160},{"t":"비용인상 인플레이션","c":"물가고용","d":"원자재값, 임금 등 생산 비용이 올라 기업이 제품 가격을 올리면서 물가가 오르는 현상.","x":"국제 유가가 오르자 운송비와 제품 가격이 줄줄이 올랐다.","o":"재화나 서비스의 생산과 관련하여 투입요소의 비용 상승에 의해 물가가 지속적으로 상승하게 되는 것을 비용인상 인플레이션(cost-push inflation)이라고 한다. 생산의 주요 투입요소인 노동, 자본 등의 비용이 상승하면 기업은 증가한 생산비용을 가격에 반영시키므로 최종 재화의 가격이 상승하게 되는 것이다. 비용인상 인플레이션은 경제 내의 생산을 위축시키면서 유발되므로 사람들의 소득 수준이 악화될 가능성이 크다. 실제로 1970년대 발생한 2차례의 오일쇼크(석유가격이 급등하여 재화 및 서비스의 생산비가 크게 상승했음)로 인해 유발된 비용인상 인플레이션은 이러한 가능성을 보여주고 있다. 당시 유가 상승으로 인해 생산비가 증가하면서 생산활동이 위축되고 이로 인해 경기가 둔화되었다.","p":138},{"t":"근원인플레이션율","c":"물가고용","d":"가격 변동이 심한 농산물과 석유류를 빼고 계산한 물가 상승률. 물가의 기본적인 흐름을 보여 준다.","x":"태풍으로 배추값만 갑자기 오른 경우, 근원물가는 크게 변하지 않는다.","o":"근원인플레이션율(core inflation rate)은 물가변동을 초래하는 여러 요인들 가운데일시적인 공급충격의 영향을 제외한 기조적인 물가상승률을 말한다. 대부분은 전체소비자물가 상승률에서 농산물 가격, 국제원자재가격 등의 변동 부분을 제거하여 계산한 다. 우리나라는 근원인플레이션 지표로 농산물 및 석유류제외지수를 작성해 왔으며, 2010년 기준 지수부터 OECD 방식에 의한 식료품 및 에너지제외지수를 추가로 작성하고 있다. 근원인플레이션율은 물가에 미치는 단기적 충격이나 불규칙 요인이 제외되어기조적인 물가상승의 흐름을 포착할 수 있다는 장점을 갖고 있는 반면 일반 국민이 실제 느끼는 체감물가와 괴리될 가능성을 내포하고 있다.","p":51},{"t":"기대인플레이션","c":"물가고용","d":"사람들이 앞으로 물가가 얼마나 오를 것이라고 예상하는지를 나타낸 것.","x":"물가가 많이 오를 거라 예상하면 노동자는 임금 인상을, 기업은 가격 인상을 미리 요구한다.","o":"기대인플레이션은 향후 물가상승률에 대한 경제주체의 주관적인 전망을 나타내는 개념으로 물가안정을 추구하는 중앙은행이 관심을 기울이고 안정적으로 관리해야 하는 핵심지표중 하나이다. 기대인플레이션은 임금협상, 가격설정, 투자결정 등 경제주체의 의사결정에 반영되면서 최종적으로 실제 인플레이션에 영향을 미친다. 구체적인 경로를 살펴보면 기대인플레이션 상승 시 가계는 구매력 하락을 우려하여 명목임금 상승을 요구하게 되며, 이는 상품의 생산비용 증가로 이어진다. 또한 기업은 재화 및 서비스가격을 올리더라도 수요가 유지될 것으로 예상하면서 실제로 가격 인상을 추진하게 된다. 또한 기대인플레이션 상승은 실질금리를 하락시켜 부동산, 주식 등의 자산에 대한 투자를 증가시킨다. 마지막으로 인플레이션 상승이 예상되는 경우 소비를 앞당기고 자 하는 유인이 커져 가수요가 증가하면서 실제 물가가 상승하게 된다. 따라서 물가안정을 추구하는 중앙은행으로서는 기대인플레이션의 안정적 관리가 필수적이라고 할 수 있다.","p":65},{"t":"물가지수","c":"물가고용","d":"기준 시점의 물가를 100으로 놓고 다른 시점의 물가 수준을 숫자로 나타낸 것.","x":"기준 연도 100, 올해 105라면 물가가 5% 오른 것이다.","o":"시장에서 거래되는 여러 가지 상품과 서비스의 가격을 경제생활에서 차지하는 중요도 를 고려하여 평균한 종합적인 가격수준을 물가라고 하는데, 이 같은 물가의 변화를 한 눈에 알아볼 수 있도록 기준연도의 물가수준을 100으로 놓고 비교되는 다른 시점의 물가를 지수의 형태로 나타낸 것을 말한다. 물가지수(PI; Price Index)는 경제성장, 국제수지 등과 함께 한 나라 거시경제의 움직임을 나타내는 중요한 경제지표로, 물가지수를 이용하면 일정기간 동안의 생계비 또는 화폐가치의 변화를 측정할 수 있고 명목금액으로 부터 실질금액을 산출할 수 있으며 물가수준을 통해 경기변동에 대해 어느 정도 가늠할 수 있다. 물가는 경제 전체의 총공급과 총수요의 영향을 받아 변동하는데, 총수요에 영향을 끼치는 대표적인 요인으로는 통화량과 가계소득을 들 수 있다. 임금 및 국제원자재가격 등 생산요소 가격은 총공급을 변화시키는 요인이며 기대인플레이션은 총수요와 총공급 모두에 영향을 준다. 우리나라의 대표적인 물가지수로는 생산자물가지수, 소비자물가지수, 수출입물가지수, 농가판매 및 구매가격지수 등을 들 수 있다.","p":115},{"t":"소비자물가지수(CPI)","c":"물가고용","d":"가계가 생활하면서 사는 상품과 서비스의 가격 변동을 나타내는 지수. 통계청이 매달 발표한다.","x":"라면, 버스 요금, 학원비 등 여러 품목의 가격을 조사해 만든다.","o":"일반 가구가 소비생활을 유지하기 위하여 구입하는 각종 상품과 서비스의 가격변동을 종합적으로 파악하기 위하여 작성되는 물가지표이다. 우리나라의 소비자물가지수는 통계청에서 작성하고 있으며 기준년을 100으로 하여 작성된다. 조사대상 상품 및 서비스의 구성과 가중치도 경제상황에 맞게 주기적으로 조정된다. 현재는 40여개 가계의 총소비지출에서 구입비중이 큰 500여개의 상품 및 서비스 품목을 대상으로 조사된 소비자구입가격을 기준으로 하고 있다. 소비자물가지수는 소비자가 일정한 생활수준을 유지하는 데 필요한 소득내지 소비금액의 변동을 나타내기 때문에 소비자의 구매력과 생계비등의 측정에 사용된다. 또한 소비자물가지수의 상승은 실질임금의 하락을 의미하므로 이를 보전하기 위한 임금인상의 기초자료로 널리 이용되고 있다.","p":158},{"t":"생산자물가지수(PPI)","c":"물가고용","d":"기업들 사이에 거래되는 상품과 서비스의 가격 변동을 나타내는 지수. 한국은행이 발표한다.","x":"생산자물가가 오르면 몇 달 뒤 소비자물가도 오르는 경우가 많다.","o":"국내시장의 제1차 거래단계에서 기업 상호간에 거래되는 상품과 서비스의 평균적인 가격변동을 측정하기 위하여 작성2되는 물가지수로서 그 대상품목의 포괄범위가 넓어전반적인 상품과 서비스의 수급 동향이 반영된 일반적인 물가수준의 변동을 측정할 수 있기 때문에 일반목적지수로서의 성격을 갖는다. 지수작성에 이용되는 가격은 제1차거래단계의 가격 즉, 생산자가 제품 한 단위당 실제로 수취하는 기초가격이다. 생산자물가지수는 1910년부터 한국은행에서 작성해 오고 있다.","p":149},{"t":"물가안정목표제","c":"물가고용","d":"중앙은행이 '물가 상승률 연 2%'처럼 목표를 미리 발표하고, 이를 달성하도록 통화정책을 운영하는 제도.","x":"한국은행의 물가안정목표는 소비자물가 상승률 기준 2%이다.","o":"물가안정목표제(inflation targeting)란 중앙은행이 명시적인 중간목표(intermediate target) 없이 일정기간 동안 또는 중장기적으로 달성해야 할 물가상승률 목표치를 미리제시하고 이에 맞추어 통화정책을 운영하는 방식이다. 즉 중앙은행은 통화량, 금리, 환율 등 다양한 정보변수를 활용하여 장래의 인플레이션을 예측하고 실제 물가상승률이 목표치에 수렴할 수 있도록 통화정책을 운영하며 이후 그 성과를 평가하고 시장의 기대와 반응을 반영하면서 정책방향을 수정해 나간다. 물가안정목표제는 다음과 같은 핵심 요소를 포함하는 것으로 이해되고 있다. 첫째로 물가안정목표의 구체적인 수치가 제시되어야 하고, 둘째로 통화정책의 목표 중에서 물가안정이 가장 중요한 목표가 되어야하며, 셋째로 제시된 목표의 달성에 대한 책임성이 확보되어야 한다는 점이다. 물가안정목표제는 1990년 뉴질랜드에서 처음 도입되었으며 이후 캐나다, 영국, 스웨덴, 호주등 일부 선진국과 다수의 신흥시장국으로 확산되었다. 우리나라는 1998년부터 물가안정목표제를 도입하여 시행하고 있다.","p":114},{"t":"경제활동인구/비경제활동인구/경제활동참가율","c":"물가고용","d":"15세 이상 인구 중 일할 능력과 의사가 있는 사람(취업자+실업자)이 경제활동인구, 학생·주부처럼 그렇지 않은 사람이 비경제활동인구이다. 15세 이상 인구 중 경제활동인구의 비율이 경제활동참가율이다.","x":"일자리를 찾다가 포기한 사람은 실업자가 아니라 비경제활동인구로 분류된다.","o":"238 장내시장 ∙ ㅈ 장기금융시장(자본시장) 금융시장은 거래 금융상품의 만기를 기준으로 단기금융시장(money market)과 자본 시장(capital market)으로 구분되는데 자본시장은 만기 1년 이상의 장기채권이나 만기가 없는 주식이 거래되는 시장을 말한다. 자본시장은 주로 기업, 정부 등 자금 부족부문이 자금 잉여부문으로부터 장기적으로 필요한 자금을 조달하는 데 활용되고 있어 장기금융 시장이라고 부른다. 우리나라의 자본시장에는 주식이 거래되는 주식시장과 국채, 회사채 및 금융채 등이 거래되는 채권시장이 있다.","p":17},{"t":"실업률","c":"물가고용","d":"경제활동인구 중에서 실업자가 차지하는 비율.","x":"경제활동인구 100명 중 4명이 실업자라면 실업률은 4%이다.","o":"고용상황을 파악하고자 할 경우에는 전체 인구보다는 경제적으로 생산활동이 가능한 인구가 더욱 중요한 의미를 가진다. 이에 따라 현재 각국에서 작성하는 고용통계는 일정 연령 이상의 노동가능인구를 대상으로 작성되고 있으며, 동 인구는 다시 노동을 통해 경제활동에 참가할 의사가 있는 경제활동인구와 경제활동의 의사가 없는 비경제활동인구로 나누어진다. 경제활동인구는 다시 취업자와 실업자로 구분, 조사되는데 실업자가 경제활동인구에 포함되는 이유는 비록 조사시점 당시에는 일시적인 이유로 직장이 없어 실업상태에 있으나 언제든지 노동력을 제공함으로써 경제활동을 할 수 있는 인구로 분류되기 때문이다. 고용현황조사를 통하여 노동가능인구, 경제활동인구, 취업자 및 실업자 등의 노동력과 유휴노동력의 규모가 파악되면 경제활동참가율, 실업률 등의 지표를 성별, 지역별, 연령별 등으로 산출하여 취업구조의 변화를 판단하게 되는데경제활동참가율은 경제활동인구수를 노동가능인구수로 나눈 백분율이며, 실업률은 실업자수를 경제활동인구수로 나누어 백분율로 계산한다.","p":180},{"t":"고용률","c":"물가고용","d":"15세 이상 인구 중에서 취업자가 차지하는 비율. 실업률이 놓치는 구직 단념자 문제까지 반영할 수 있다.","x":"15세 이상 인구 100명 중 62명이 일하고 있다면 고용률은 62%이다.","o":"고용률은 통계청에서 매월 작성하고 있는 경제활동인구조사에서 집계된 15세 이상인구(노동가능인구)에 대해 취업자가 차지하는 비율을 말한다. 한편 실업률은 경제활동인구 중에서 실업자가 차지하는 비율을 말한다. 고용률은 실업률의 문제점을 해소할 수 있기 때문에 고용통계에서 중요한 개념이다. 즉, 고용통계에서 취업준비자와 구직단념자는 실질적인 의미에서 실업자이나 비경제활동인구로 분류되고 있음에 따라 이들이 늘어나면 실업률이 낮아질 수 있어 체감하는 실업률과 차이를 느끼게 한다. 그러나고용률은 15세 이상 인구를 기준으로 계산되기 때문에 실업자와 비경제활동인구간의 이동 등에 따른 경제활동인구수 변동의 영향을 받지 않는다는 장점이 있다. 다만 고용률도 근로시간이 18시간 미만인 단시간근로자 및 일시휴직자 등 불완전취업자가 증가하는 경우에는 국민들이 체감하는 고용상황과 차이를 보일 수 있다.","p":20},{"t":"청년실업률","c":"물가고용","d":"15~29세 청년층의 경제활동인구 중 실업자가 차지하는 비율.","x":"대학 졸업 후 취업을 준비하며 일자리를 구하는 청년이 많으면 청년실업률이 높아진다.","o":"청년실업률이란 15세에서 29세에 해당하는 청년층의 경제활동인구 중 실업자의 비율을 말한다. 따라서 재학 중인 학생이나 군인 및 구직단념자 등은 비경제활동인구로 분류되어 청년실업률에 포함되지 않는다. 다만 연령계층별 고용보조지표를 활용하면 청년층의 고용상황에 대한 보다 정확한 파악이 가능한 만큼, 기존의 공식 실업률 외에 고용보조지표를 활용할 필요가 있다.","p":283},{"t":"마찰적 실업","c":"물가고용","d":"더 나은 일자리를 찾기 위해 직장을 옮기는 과정에서 잠시 생기는 실업.","x":"회사를 그만두고 새 직장에 들어가기 전 한 달 동안 일자리를 알아보는 경우.","o":"마찰적 실업 또는 탐색적 실업이란 새로운 일자리를 탐색하거나 이직을 하는 과정에서 일시적으로 발생하는 실업을 의미한다. 새로운 일자리를 탐색한다는 것은 구직자와 구인자 사이에 서로의 요구조건이 일치하지 않는 일종의 마찰이 생겼기 때문으로 볼수 있다. 마찰적 실업은 경기침체로 인해 발생한 비자발적 실업이 아닌 자발적 실업이며 이는 경기 변동 과정에서 발생하는 경기적 실업이나 특정 산업의 침체 등으로 발생하는 구조적 실업과는 구분된다. 노동시장에서 사람들은 탐색으로 인한 이익이 탐색비용을 초과하는 경우 탐색행위를 지속하게 된다. 예를 들어 구인자와 구직자 간에 고려하고 있는 의중임금의 차이가 크거나 구직자가 높은 임금이 기대된다면 실업기간이 길어지더라도 구직행위를 지속하게 된다. 또한 구직자들의 노동의 질이 같지 않고, 구인자들이 제공하는 일자리 역시 동질적이지 않기 때문에 구인자들은 좀 더 나은 인재를 찾기위해, 구직자들은 좀 더 나은 일자리를 찾기 위해 탐색행위를 하게 된다. 구직자와 구인자 사이에 정보의 비대칭 문제가 사라지지 않고 지속됨에 따라 노동의 수요와 공급의 불일치가 발생하게 되고, 이러한 탐색 및 마찰로 인해 실업이 발생하게 된다. 따라서 이런 형태의 실업은 언제나 발생할 수 있고, 경기가 좋은 경우에도 발생할 수있다. 마찰적 실업을 줄이기 위해서는 일자리에 관한 정보를 알려주는 서비스를 대폭개선하여 노동수요자와 노동공급자 사이에 원활한 정보교환이 이뤄지도록 하는 것이 중요하다.","p":106},{"t":"자발적 실업","c":"물가고용","d":"일할 능력은 있지만 지금의 임금 수준이나 조건에서는 스스로 일하지 않기로 선택한 실업.","x":"원하는 조건의 직장을 찾을 때까지 제안을 거절하고 기다리는 경우.","o":"자발적 실업이란 일할 의사가 있어 고용되기를 원하지만 현재의 임금수준이 낮다고 생각하여 스스로 일하고 있지 않는 상태에 있는 실업이다. 자발적 실업은 완전고용과 밀접한 관계가 있다. 완전고용은 경제활동인구 가운데 현재의 주어진 임금수준에서 일할 의사가 있는 사람은 모두 고용되는 상태이다. 즉, 완전고용의 상황에서는 비자발적실업은 전혀 존재하지 않는다. 따라서 자발적 실업이란 완전고용을 가정할 때 경제활동인구에서 고용된 인구를 뺀 나머지를 자발적 실업이라 할 수 있다. 다만 완전고용 상태에 서도 모두 고용될 수 없는 불가피한 두 가지의 실업이 있다. 첫째, 현재의 일자리보다 더 나은 일자리를 모색하는 과정에서 나타나는 마찰적 실업이다. 둘째, 특정 산업의 사양화나 최저임금제, 노동조합, 임금경직성 등 제도적 요인 때문에 발생하는 구조적실업이다. 이러한 두 실업은 경기가 호황이든 불황이든 상관없이 발생하므로 완전고용을 정의할 때는 제외한다.","p":231},{"t":"실망실업자","c":"물가고용","d":"일하고 싶지만 일자리를 구하지 못할 것 같아 구직을 포기한 사람. 실업자가 아닌 비경제활동인구로 분류된다.","x":"여러 번 떨어진 뒤 아예 지원을 그만둔 사람.","o":"구직단념자라고도 하며, 비경제활동인구 중 잠재구직자의 일부분이며 취업 희망과 취업 가능성 기준 외에도 노동시장적 사유로 지난 4주간 구직활동을 하지 않는 자중 지난 1년 내 구직 경험이 있는 사람을 의미한다. 여기서 노동시장적 사유라 함은 다음과 같은 사유로 구직활동을 하지 않게 경우를 의미한다. ① 전공, 경력, 임금수준, 근로조건 등의 면에서 적당한 일자리가 없을 것 같아서 ② 지난 4주간 이전에 구직하여 보았지만 일자리를 찾을 수 없어서 ③ 교육･기술･경험 부족 등의 면에서 자격이 부족하여 지난 4주간 구직활동을 하지 않은 경우를 의미한다.","p":179},{"t":"자연실업률","c":"물가고용","d":"경제가 정상적으로 돌아갈 때에도 마찰적·구조적 실업 때문에 남아 있는 실업률. 완전고용 상태의 실업률이다.","x":"경기가 아주 좋아도 실업률은 0%가 되지 않는다.","o":"1968년 프리드먼(M. Friedman)이 처음 제시한 개념으로, 경제의 균형상태에서 상품시장과 노동시장 등의 구조적 요인에 의해 결정되는 실업률을 말한다. 이는 노동시장의 구조적･마찰적 요인에 의해 결정되는 실업률로서 영(0)의 실업률을 의미하는 것이 아니라 인플레이션이 안정적으로 유지될 수 있는 가장 낮은 수준의 실업률을 의미한다. 실업률과 인플레이션의 관계는 통화론자와 케인즈학파간 오랜 논쟁거리 중의 하나로, 통화론자인 프리드먼은 예상치 못한 인플레이션이 발생하는 경우 일시적으로 실업률이 하락할 수는 있으나 장기적으로는 노동자들이 인플레이션을 인지하게 되어 임금상승을 요구하게 됨으로써 장기적으로 인플레이션만 유발할 뿐 실업률은 자연실업률 수준으로 수렴한다고 주장하였다. 반면 케인즈학파 학자들은 낮은 수준의 실업률을 유지하려는 정책적 노력이 높은 수준의 물가상승률을 초래하는데 그치지 않고 물가상승률을 가속시킬 수 있다는 점을 강조하였다. 이와 관련하여 이들이 제시한 NAIRU(Non-Accelerating Inflation Rate of Unemployment; 비가속적인플레이션실업률)는 인플레이션이 상승하거나 하락하지 않고 안정적으로 유지될 수 있는 실업률 수준을 지칭하는 점에서 사실상프리드먼의 자연실업률과 같은 개념이다.","p":235},{"t":"필립스곡선","c":"물가고용","d":"실업률과 물가 상승률 사이의 반비례 관계를 나타낸 곡선. 실업률을 낮추려면 물가가 오르기 쉽다.","x":"경기를 살려 실업을 줄이면 물가가 오르고, 물가를 잡으면 실업이 늘 수 있다.","o":"임금상승률과 실업률 사이의 반비례 관계를 나타내는 곡선을 필립스 곡선이라 한다. 뉴질랜드 출신의 영국인 경제학자 필립스(W. Phillips)는 1958년 명목 임금상승률과 실업률이 역의 상관관계를 나타낸다는 것을 처음으로 관찰하였다. 즉 필립스는 1861년에 서 1957년 사이의 영국의 통계자료를 이용하여 실업률이 낮은 해에는 명목 임금상승률이 높고, 반대로 실업률이 높은 해에는 명목 임금상승률이 낮다는 사실을 발견하였다. 일반적으로 명목 임금상승률과 물가상승률은 비슷한 움직임을 보이기 때문에 물가상승률과 실업률 간의 안정적인 반비례 관계를 나타내는 곡선을 필립스 곡선이라 부른다. 이러한 필립스 곡선은 단순히 경험적 관계로부터 도출되었지만, 완전고용을 이루면(실업률이 낮으면) 물가상승률이 높아지고(물가불안정), 완전고용에서 멀어지면(실업률이 높으면) 물가상승률이 낮아지는(물가안정) 완전고용과 물가안정 사이의 상충관계를 밝힘으로써 경제정책 분석에 크게 기여하였다.","p":320},{"t":"실질임금","c":"물가고용","d":"받은 임금(명목임금)에서 물가 변화를 고려해, 그 돈으로 실제로 살 수 있는 물건의 양을 나타낸 임금.","x":"월급이 3% 올랐는데 물가가 5% 올랐다면 실질임금은 오히려 줄었다.","o":"근로자가 노동의 대가로 받는 임금을 현재의 화폐단위로 표시한 것을 명목임금이라고 하는데 이러한 명목임금으로 재화와 서비스를 실제 구입할 수 있는 수량 즉, 구매력을 측정하기 위해 명목임금을 소비자물가지수로 나눈 것을 실질임금이라고 한다. 물가상승률이 명목상승률보다 더 높으면 실질임금은 오히려 줄어들어 실제 구매력은 감소하게 된다.","p":181},{"t":"최저임금제","c":"물가고용","d":"국가가 임금의 최저 수준을 정해 사용자가 그보다 적게 주지 못하도록 하는 제도. 저임금 노동자를 보호하기 위한 것이다.","x":"아르바이트를 해도 시간당 최저임금 이상을 받아야 한다.","o":"국가가 노사 간의 임금결정 과정에 개입하여 임금의 최저수준을 정하고 그 이상임금을 지급하도록 강제함으로써 근로자를 보호하는 제도이다. 최저임금제도는 1894년뉴질랜드가 가장 먼저 도입하였으며 우리나라는 1986년 12월 31일 최저임금법을 제정･ 공포하고 1988년 1월 1일부터 이를 시행하였다. 최저임금제를 도입하는 목적은 임금의 최저수준을 보장하여 근로자의 생활안정과 노동력의 질적 향상에 이바지하고, 임금격차를 완화하여 소득분배 개선에 기여하며, 근로자의 생활안정 및 근로자의 사기진작을 통해 노동생산성을 향상시키고, 적정임금을 지급하여 공정경쟁을 촉진하는 등으로 다양하다. 현행 최저임금법 및 동법시행령에 따르면 고용노동부장관은 매년 8월 5일까지 다음 연도중 적용할 최저임금을 결정하여 고시해야 하며 최저임금액 보다 적은 금액의 임금을 지급하는 경우에는 3년 이하의 징역 또는 2천만원 이하의 벌금이 부과된다.","p":286},{"t":"명목소득/실질소득","c":"물가고용","d":"명목소득은 받은 돈의 액수 그대로의 소득, 실질소득은 물가 변화를 고려해 실제 구매력으로 나타낸 소득이다.","x":"용돈이 그대로인데 물가가 올랐다면 실질소득은 줄어든 것이다.","o":"명목소득(Nominal income)은 대상 경제주체의 소득이 발생할 당시의 통화금액으로 측정된 소득을 말하여, 실질소득(Real income)은 통화가치의 변동을 감안하여 명목소득을 기준시점에 맞춰 조정한 것을 말한다. 예를 들어 2015년에 A씨의 연간 소득을 당시통화가치로 측정한 금액이 3,000만원 이라면 명목소득은 3,000만원에 해당한다. 그런데 2017년 측정된 A씨의 명목소득이 3,500만원이라면, 2년 동안 A씨의 명목소득은 500만원증가한 셈이다. 이 경우 A씨의 경제형편이 나아졌는지를 판단하기 위해서는 보다 정확한 정보를 반영하고 있는 실질소득의 변화 여부를 확인해 보아야 한다. 만약 2015~2017년중인플레이션율(물가상승률)이 15%라면 같은 기간중 통화가치는 15% 하락한 것으로 볼수 있다. 이 경우 A씨의 2017년 명목소득 3,500만원은 실질소득 기준으로 3,043 만원 (3500/ (1+0.15))이 된다. 따라서 2015~2017년중 통화가치 변동을 감안할 경우 A씨의 실질소득은 43만원 증가한 것이 된다. 통화의 가치는 인플레이션 등으로 인해 시간이 지날수록 하락하므로 수시로 발표되는 다양한 경제지표를 정확하게 이해하기 위해서는 명목(nominal)과 실질(real)의 개념으로 구분해서 살펴보아야 한다. 국내총생산에 대한 명목GDP･실질GDP, 임금에 대한 명목임금･실질임금, 이자율에 대한 명목이자율･실질이자율 등은 명목지표와 실질지표를 구분하는 한 예라 하겠다.","p":111},{"t":"재정정책","c":"정부","d":"정부가 세금을 걷고 돈을 쓰는(정부 지출) 규모를 조절해 경기를 안정시키려는 정책.","x":"불황 때 정부가 세금을 줄이고 도로 건설 등 지출을 늘려 경기를 살린다.","o":"정부의 지출과 조세를 정책수단으로 사용하는 정부의 제반 정책을 일컬어 재정정책이 라고 한다. 재정정책의 목표는 일반적으로 완전고용, 물가안정, 국제수지 균형, 경제성장, 소득재분배 등이 있다. 그러나 좁은 의미 또는 단기적으로는 정부지출과 조세수입의 양과 구조를 의도적으로 변화시켜 총수요를 조절함으로써 경제안정을 도모하려는 확장적 혹은 긴축적 재정활동만을 재정정책이라 한다. 예를 들어 단기적으로 불황이 발생할 경우 정부지출을 늘려 경기를 진작할 수 있다. 또한 기업의 연구개발 지출에 보조금을 지급하면 기술개발이 촉진돼 장기적으로 경제성장률이 확대될 수 있다.","p":243},{"t":"재정수지","c":"정부","d":"정부가 걷은 수입(세금 등)과 쓴 지출의 차이. 수입이 많으면 흑자, 지출이 많으면 적자이다.","x":"코로나19 때 지원금 지출이 늘어 재정수지 적자가 커졌다.","o":"정부의 수입과 지출의 차이를 재정수지라고 한다. 수입과 지출이 같으면 균형, 수입이 더 많으면 흑자, 지출이 더 많으면 적자라고 한다. 재정적자가 발생하면 국채발행이나차입이 늘어나 정부부채가 증가하게 된다. 정부의 재정활동은 조세와 정부지출의 형태로 가계의 소비와 기업의 투자라는 거시경제의 순환에 영향을 주게 된다. 재정지출로 정부서비스가 생산되지만 일정 부문은 조세 등으로 조달된 자금이 타 부문으로 이전되는 성격도 갖고 있다. 그래서 재정적자가 과다하지 않도록 유로존(EU)은 안정성장 협약에 의거 회원국들의 재정적자를 GDP의 3% 이내, 장기적인 정부부채는 GDP의 20%를 넘지 않도록 관리하고 있다. 한편 우리나라는 당해 연도의 총수입에서 총지출을 뺀것을 “통합재정수지”라고 지칭하고, 통합재정수지에서 국민연금기금, 사립학교교직원연금기금, 산업재해보상보험및예방기금 등 사회보장성 기금의 수지를 제외한 재정수지를 별도로 “관리재정수지”라고 별도로 산출 운용하고 있다. 이는 사회보장성 기금수입은 장기적인 미래지출을 위한 것으로 당해 연도의 재정활동 결과로 보기 곤란하며 기금의 성숙도에 따라 대규모 흑자나 적자가 발생하여 당해 연도의 재정활동을 판단하는데효과적이지 않을 수 있기 때문이다.","p":242},{"t":"추가경정예산","c":"정부","d":"이미 확정된 예산을 바꿀 필요가 있을 때 다시 편성해 국회의 승인을 받는 예산. 흔히 '추경'이라고 한다.","x":"큰 재난이 발생하자 정부가 피해 지원을 위해 추경을 편성했다.","o":"추가경정예산이란 행정부가 예산을 성립한 후에 발생한 사회･경제적인 변동으로 인해 기존의 예산을 추가･삭감하여 바꾼 예산을 가리킨다. 즉 헌법에서는 예산안을 편성할 때 예산 성립 후 예상치 못한 지출에 대비하기 위해 따로 예비비를 두고 있으나, 이것만으로 충당할 수 없을 때에는 추가적으로 세출을 조정하는 등을 통해 추가경정예산을 짤 수있다. 본예산에 대비되는 용어이며 보정예산이라고도 한다. 구재정법에서는 추가예산과 경정예산으로 구분하여 규정한 바 있으나 헌법(헌법 제56조)과 국가재정법(제89조)에서는 이를 통합하여 추가경정예산이라 부른다. 이는 행정부가 예산안을 국회에 제출한 후예산이 성립되기 전에 불가피한 사유로 예산안의 일부를 수정하는 수정예산과는 구별된다.","p":288},{"t":"긴축정책","c":"정부","d":"물가가 너무 오르거나 경기가 과열될 때 정부 지출을 줄이거나 금리를 올려 경제 활동을 진정시키는 정책.","x":"물가가 크게 오르자 중앙은행이 기준금리를 올렸다.","o":"경기과열 우려가 있는 경우에 재정 또는 통화정책으로 국민의 소득을 감소시켜 재화및 서비스에 대한 수요를 위축시키고 경기의 과열을 방지하려는 정책을 긴축정책 (contractionary policy)이라고 한다. 경기가 과열되어 물가급등에 대한 염려가 커지면 정부나 지방자치단체는 예산을 편성･실행함에 있어서 지출을 삭감･억제함과 동시에 공채의 정리 및 신규 모집을 하지 않는 정책을 취한다. 세입 일부를 다음 연도로 이월하거나 공정이율의 인상을 중심으로 하는 금융긴축 조치 등도 시행된다. 한편, 중앙은행은 물가급등에 대한 우려가 커지면 시중에 유통되는 통화량을 줄이거나 금리를 인상한다. 이렇게 되면 두 경우 모두 국민의 소득을 줄이게 되고 소득이 줄어든 국민은 재화및 서비스에 대한 소비를 줄이게 되어 물가가 하락하게 된다.","p":74},{"t":"자동안정화장치","c":"정부","d":"정부가 따로 결정하지 않아도 경기 변동을 저절로 완화해 주는 제도. 누진세와 실업 급여 등이 해당한다.","x":"불황에 소득이 줄면 세금도 자동으로 덜 내고 실업 급여가 나가 소비가 크게 줄지 않는다.","o":"경제정책을 입안하고 시행하는 과정은 간단하지 않다. 정책의 효율성을 점검해야하며, 효율성이 입증되었다고 해도 경기상황에 대한 정보수집과 예측, 정책입안, 입법절차 등을 거쳐 실제로 정책을 시행하기까지 많은 시간이 소요된다. 또한 정책시행에 있어서도 준칙을 따를 것인가 재량에 의존할 것인가도 정책의 효과에 영향을 미친다. 이와 같이 적극적인 경제정책은 여러 가지 한계와 어려움 때문에 상황에 따라서는 더 큰 부작용이 발생할 가능성이 내재되어 있다. 이러한 점을 고려하여 일부 경제학자들은 수동적인 자동안정화장치를 경제정책으로 활용할 것을 권장하였다. 자동안정화장치의 대표적인 예로는 누진세를 꼽을 수 있다. 누진 세제는 경기가 침체할 때 추가적인 입법 과정 없이 자동으로 조세부담을 줄여 경기를 활성화 하는 효과가 있다. 반대로 경기가 과열일 때는 과세표준이 늘어나 조세부담이 커지면서 경기를 진정시킬 수 있다. 사회보장제도나 실업보험제도 등도 자동안정화장치의 예이다. 자동안정화장치는 이처럼 경기변동의 폭을 자동으로 완화해 주는 장점을 갖고 있지만, 경기가 회복되기 시작하여 완전고용 상태로 가는 과정을 더디게 하는 단점도 있다. 경기가 회복되면서 소득세가 늘어나 소비지출이 줄고 실업수당의 지급이 줄어들면서 정부지출이 감소하여 총수요의 증가가 일부 상쇄되기 때문이다.","p":230},{"t":"간접세/직접세","c":"정부","d":"직접세는 세금을 내는 사람과 실제 부담하는 사람이 같은 세금(소득세 등), 간접세는 물건 값에 포함되어 부담이 다른 사람에게 넘어가는 세금(부가가치세 등)이다.","x":"과자를 살 때 값에 포함된 부가가치세는 가게가 내지만 실제로는 소비자가 부담하는 간접세이다.","o":"조세는 납세의무자와 실제로 세금을 부담하게 되는 조세부담자가 일치하는지 여부에 따라 간접세(indirect tax)와 직접세(direct tax)로 구분된다. 납세의무자와 조세부담자가 일치하여 조세부담이 전가(轉嫁)되지 않는 조세를 직접세라고 하며, 대표적인 예로는 소득세, 법인세, 상속세, 증여세, 종합부동산세 등이 있다. 이와 달리 납세의무자와 조세부담자가 일치하지 않고 조세의 부담이 타인에게 전가되는 세금을 간접세라고 하며, 대표적인 예로는 부가가치세, 개별소비세, 주세, 인지세, 증권거래세 등이 있다. 간접세는 조세에 대한 저항이 적고 징수가 간편하여 조세수입의 확보가 용이하다는 장점이 있다. 반면, 개인의 사정을 고려할 수 없으므로 누진세율(累進稅率)을 적용하지 못하고 비례세율이 적용됨으로써 소득이 적은 자에게 상대적으로 높은 조세부담률이 적용되는 역진성(逆進 性)을 띠게 되어 공평부담의 원칙에 어긋난다는 단점이 있다. 한편, 국민계정체계에서는 조세의 실질적인 부담주체를 결정하기가 쉽지 않은 점 등을 감안하여 간접세와 직접세대신 생산 및 수입세, 소득 및 부 등에 대한 경상세, 자본세란 용어를 사용하고 있다.","p":7},{"t":"조세부담률","c":"정부","d":"국내총생산(GDP)에서 국민이 낸 세금이 차지하는 비율. 국민의 세금 부담 정도를 보여 준다.","x":"GDP가 2,000조 원이고 세금이 400조 원이면 조세부담률은 20%이다.","o":"조세부담률은 국민계정에서 조세수입이 국민총소득(GNI)에서 차지하는 비중으로 정의된다. 이는 국민 전체의 조세부담 정도를 나타내 주는 지표로 조세의 누진 정도, 국가의 조세징수능력 등에 따라 결정된다. 반면, 재정통계의 조세부담률은 국가 및 지방자치단체가 거둬들인 국세 및 지방세 수입이 경상금액기준 국내총생산에서 차지하는 비율로 파악된다. 조세부담률이 높다는 것은 국민들이 벌어들인 소득 중에서 세금으로 납부하는 비중이 높다는 것이다. 조세부담률  국세  지방세 경상G D P ×  한편, 국민부담률이란 개념도 있는데 이는 국가가 가입을 의무화하거나 재정에서 지급을 보장하는 각종 공적 사회보험에 대한 보험료 등을 조세수입에 더하여 경상GDP대비비율을 산출한 것이다. 사회보장기여금은 4대 공적연금인 국민연금, 공무원연금, 사학연금, 군인연금과 고용보험, 산업재해보상보험, 건강보험, 노인장기요양보험 등이다.","p":257},{"t":"국가채무","c":"정부","d":"정부가 갚아야 할 빚. 국채 발행이나 차입으로 생긴다.","x":"국가채무가 너무 늘면 이자 부담이 커지고 미래 세대의 부담이 된다.","o":"국가채무란 정부가 재정적자 보전 등을 목적으로 국내외로부터 자금을 차입함으로써발생하는 채무를 말한다. 국제통화기금(IMF)과 경제협력개발기구(OECD)는 국가채무의 주체와 채무의 구체적 범위를 정하고 있으나 국가별로는 차이가 있다. 주요 선진국은 중앙정부와 지방정부를 포함하는 일반정부의 국가채무를 파악하고 있다. OECD는 유럽연합(EU)의 마스트리히트 조약 기준 총공공채무도 작성토록하고 있다. 우리나라는 ｢국가재정법｣ 제91조에서 중앙정부의 국채, 차입금 및 국고채무 부담행위를 국가채무로 규정하고 있으며 한국은행으로부터의 차입금 등은 포함하지 않는다. 일부 국가는 채무에 서 채권을 차감한 순채무를 국가채무의 기준으로 삼기도 한다. 국가채무는 제2차 세계대전 이후 각국의 재정지출이 급격하고도 지속적으로 확대되면서 주목을 받기 시작하였다. 국가채무는 한 번 누적되면 새로운 재정적자가 발생하지 않더라도 기존채무에 대한 이자지급 부담으로 채무가 계속 늘어나는 자기증식의 속성을 가지고 있다. 또한 기대인 플레이션이나 시장금리를 상승시키는 부작용이 있을 수 있다. 이에 따라 각국은 안정적인 자금조달 및 국채시장 유지, 자금조달의 비용최소화 등 재정의 지속가능성 유지를 위해 국가채무를 적절히 분석･관리하고 있다. 국가채무를 분석할 경우에는 주로 명목 GDP대비 비율을 사용하며 채무의 보유주체, 만기구조 등 채무의 질적 구성을 고려하기도 한다.","p":34},{"t":"국채","c":"정부","d":"정부가 필요한 돈을 빌리기 위해 발행하는 채권. 나라가 갚기 때문에 안전한 편이다.","x":"정부가 부족한 재정을 메우기 위해 국채를 발행해 투자자에게서 돈을 빌린다.","o":"국채란 정부가 다양한 목적의 재정자금을 조달하기 위해 발행하는 채권을 말한다. 국채는 자금 용도에 따라 국고채권, 재정증권, 국민주택채권 및 보상채권으로 나누어지는 데 국고채권이 국채의 대부분을 차지한다. 국고채권은 주로 국가 재정에 필요한 자금(적자재정시 재원)을 조달하기 위해서 ｢국채법｣에 의해 발행되는데 만기는 3년, 5년, 10년, 20년, 30년, 50년(안정적인 재정자금 조달, 국채만기 포트폴리오의 다양화를 목적으로 2016.10월에 도입) 등 6가지 종류로 구성되며 경쟁입찰방식으로 발행된다. 국고채권의 원활한 소화 및 시장조성을 위해 국채자기매매업무 취급금융기관(은행, 증권사, 종합금융회사)중 국고채권 인수 및 유통 실적이 우수한 금융기관을 국고채전문딜러로 선정･운영하고 있으며 미국의 primary dealer와 같은 기능을 수행한다. 재정증권은 재정부족자금의 일시 보전을 위해 ｢국고금관리법｣에 의해 발행되는데 만기는 1년 이내지만 실제로 는 3개월 이내이며 경쟁입찰방식으로 발행된다. 국민주택채권은 국민주택건설 재원조달을 위해 ｢주택도시기금법｣에 의해 부동산 등기 및 인허가와 관련하여 의무적으로 매입하도록 하는 첨가소화방식으로 발행되며 만기는 5년이다. 보상채권은 공공용지 보상비마련을 위하여 ｢공익사업을 위한 토지 등의 취득 및 보상에 관한 법률｣에 의해 당사자앞교부방식으로 발행되며 만기는 5년 이내지만 실제로는 3년 만기로 발행한다.","p":48},{"t":"사회보장제도","c":"정부","d":"질병, 실업, 노령, 빈곤 같은 위험으로부터 국민의 생활을 보호하기 위한 제도. 사회보험, 공공부조, 사회서비스로 이루어진다.","x":"기초생활보장제도와 국민연금이 대표적이다.","o":"사회보장제도는 사회 불평등 현상을 해결하기 위해 도입된 것으로 개인이 어떠한 불행을 당하더라도 국가가 최소한의 인간다운 생활을 보장할 수 있도록 하는 제도이며 사회보험과 공공부조, 사회복지서비스가 대표적이다. 사회보험(社會保險)은 산업재해, 실업, 질병 등으로 인하여 소득이 상실되었을 때를 대비한 보험으로 산업재해보험, 국민연금, 고용보험, 건강보험이 있다. 이때 보험료는 혜택을 받는 개인과 고용주 또는 국가가 나누어 부담하는데, 소득이 높을수록 부담이 높아진다. 한편 공공부조(公共扶助) 는 비용전부를 국가가 부담하며 생활능력이 없는 사람의 최저한의 생활보호를 위해 마련된 제도로 기초생활보장제도가 대표적인 예이다. 마지막으로 사회복지서비스는 국가적인 보호가 필요한 취약 계층을 대상으로 이들이 정상적인 생활을 할 수 있도록도와주는 여러 비경제적인 지원제도를 의미한다. 주로 아동, 노인, 장애인을 위한 복지제도가 여기에 포함된다.","p":143},{"t":"사회보험","c":"정부","d":"국민이 보험료를 내고 질병, 실업, 노령, 산업재해 같은 위험이 생겼을 때 도움을 받는 의무 가입 보험.","x":"국민연금, 건강보험, 고용보험, 산재보험, 노인장기요양보험(5대 사회보험).","o":"사회보험(social insurance)이란 국민에게 발생 가능한 각종 사회적 위험에 보험방식을 통해 대처함으로써 국민의 생활, 건강, 소득 등을 보장하려는 제도를 가리킨다. 구체적으로는 ① 산업재해보험(업무상 재해를 입었을 경우 신속한 보상 및 복귀 지원) ② 건강보험(질병, 상해, 사망 등의 사고가 발생할 경우 의료서비스를 제공) ③ 국민연금(퇴직, 노령, 사망 등에 따른 당사자 및 유족의 생활보장) ④ 고용보험(실직자의 생활 안정및 재취업 지원)으로 구분된다. 이들 제도는 사회보장정책을 수행하기 위한 주요 수단으로 활용되며 특히 노동자와 그 가족을 발생 가능한 각종 위험으로부터 보호하기 위한 목적으로 시행된다. 사회보험은 반드시 개인의 자유의사에 의하여 가입하는 것은 아니며 보험료는 국가, 기업 및 개인이 분담하되 개인이 받을 위험 정도가 아닌 소득 수준에 비례하여 산정된다.","p":144},{"t":"지니계수","c":"정부","d":"소득이 얼마나 불평등하게 나누어져 있는지를 0에서 1 사이 숫자로 나타낸 것. 0이면 완전 평등, 1에 가까울수록 불평등하다.","x":"지니계수가 0.3에서 0.4로 커졌다면 소득 불평등이 심해진 것이다.","o":"지니계수란 이탈리아의 통계학자 지니(Gini)가 소득분배상태를 파악하기 위하여 로렌츠곡선의 단점을 보완, 로렌츠곡선이 나타내는 내용을 하나의 단순한 숫자로 표시한 것이 다. 소득분배의 불균형 정도가 클수록 소득의 완전균등분배를 나타내는 대각선과 로렌츠곡선 사이의 면적이 넓어지는 데 착안, 대각선과 로렌츠 곡선 사이의 면적을 대각선에 의해 생성되는 직각삼각형의 면적으로 나눈 값을 계산하여 소득 불평등계수로 사용하였는 데, 이를 지니계수라 한다. 소득분배가 완전히 균등할 경우 지니계수는 0이 되며 소득분배가 완전히 불균등할 경우에는 1이 된다. 그러므로 지니계수는 0에서부터 1까지의 값을 가지며 그 값이 클수록 소득분배가 불균등함을 의미한다. 지니계수는 가장 널리 쓰이는 소득분배 측정방법이지만 전 계층의 소득분배상태를 하나의 숫자로 나타낼 수 있을 뿐이며 특정 소득계층의 소득분포상태를 나타내지 못한다는 한계를 가지고 있다.","p":272},{"t":"로렌츠곡선","c":"정부","d":"인구를 소득이 적은 순서로 늘어놓고 소득이 누적되는 정도를 그린 곡선. 대각선에서 멀어질수록 불평등하다.","x":"로렌츠곡선을 이용해 지니계수를 계산한다.","o":"1905년 미국의 통계학자인 로렌츠(M. Lorenz)가 소득의 불평등 정도를 측정하기위해 제안한 것으로, 인구의 누적비율을 가로축에 소득의 누적점유율을 세로축에 놓고 이들의 관계를 그림으로 표시한 곡선을 말한다. 모든 사람의 소득이 일정하다면 인구가 누적되어도 소득 누적액이 일정할 것이므로 로렌츠 곡선(Lorenz Curve)은 아래 그림의 OO′선과 같은 대각선이 된다. 반면 소득이 불평등하다면 처음에는 소득이 적은 사람들의 누적액이 더해져 그래프의 기울기가 완만하다가 뒤로 갈수록 소득이 많은 사람들의 누적액이 더해지면서 가파른 모양의 아래로 늘어진 곡선이 되며, 한 사람이 모든 소득을 다 가지고 있는 경우에는 OTO′선과 같은 모양이 된다. 따라서 로렌츠 곡선이 OO′선에 가까워질수록 분배상태가 평등하고, OTO′선에 가까워질수록 불평등 정도가 높다고 판단할 수 있다. 로렌츠 곡선은 한 나라의 소득분배 상태를 그림으로 볼 수 있다는 장점이 있으나 그 정도를 정량적으로 표시할 수 없다는 단점이 있는데, 소득분배 상태를 정량적으로 파악하기 위해서는 지니계수를 이용하여야 한다. 지니계수는 아래 그림의 대각선과 로렌츠곡선 사이의 면적을 대각선 아래 삼각형 면적 전체로 나눈 것으로, 소득분배가 완전히 평등하다면 대각선과 로렌츠곡선 사이의 면적이 0이 되어 지니계수는 0이 된다. 반대로 소득분배가 완전히 불평등하다면 대각선과 로렌츠곡선 아래의 면적이 대각선 아래 전체 면적과 같게 되므로 지니계수는 1이 된다.","p":102},{"t":"소득5분위배율","c":"정부","d":"소득 상위 20% 계층의 평균 소득을 하위 20% 계층의 평균 소득으로 나눈 값. 클수록 불평등하다.","x":"배율이 5라면 부유한 계층이 가난한 계층보다 5배 더 번다는 뜻이다.","o":"소득분배의 불평등도를 나타내는 지표의 하나로 전체 가구를 소득수준의 순서에 따라 20%씩 5등분으로 나눈 다음, 소득 상위 20%(5분위) 계층의 평균소득을 소득 하위 20%(1분위) 계층의 평균소득으로 나눈 값이다. 소득 5분위 배율 값이 커질수록 고소득층과 저소득층 간의 소득분배가 악화하였음을 의미한다.","p":156},{"t":"상대적 빈곤율","c":"정부","d":"전체 인구 중에서 중위소득(한가운데 소득)의 50%에도 못 미치는 소득을 가진 사람의 비율.","x":"중위소득이 월 300만 원이면 150만 원보다 적게 버는 사람이 상대적 빈곤층이다.","o":"상대적 빈곤율은 세금과 이전소득을 모두 감안한 처분가능소득이 중위소득(소득이 많은 순서대로 세웠을 때 정확히 중간인 사람의 소득)의 50%를 밑도는 계층이 전체인구에서 차지하는 비율을 말한다. 이는 소득을 기준으로 한 빈곤선(50%)에 의거해 국민이 겪는 빈곤의 정도를 측정하는데 활용된다. 우리나라는 2014년 기준으로 상대적빈곤율이 14.4%를 기록하였는데 노르웨이, 프랑스, 독일 및 스위스는 각각 8.1%, 8.2%, 9.5% 및 9.9%로 상대적으로 낮은 수준이며 일본 및 미국은 각각 16.1% 및 17.5%로 상대적으로 높았다. 우리나라의 경우 상대적 빈곤율이 2015년에는 13.8%로 2014년보다 는 다소 낮아졌다. 이를 연령층 기준으로 살펴보면 26∼40세는 5.8%(2014년 6.5%), 41∼50세는 6.4%(6.7%), 51∼65세는 3.4%(14.8%)인 반면 66∼75세는 38.8%(42.7%)의 매우 높은 수준을 나타내어 고령층이 소득 부족에 따른 빈곤에 더 큰 영향을 받고 있음을 알 수 있다.","p":146},{"t":"낙수효과","c":"정부","d":"대기업이나 부유층의 소득이 늘면 투자와 소비가 늘어 그 혜택이 결국 서민과 중소기업에게도 흘러내려 간다는 주장.","x":"대기업 세금을 깎아 주면 투자가 늘어 일자리가 생긴다는 논리.","o":"정부가 경제정책으로 대기업과 고소득층 또는 부유층의 소득과 부를 먼저 늘려주게 되면 이들의 소비와 투자 증가를 통해 전체 경제활동이 활발해지면서 결국에는 중소기업과 저소득층도 혜택을 볼 수 있다는 주장이다. 이러한 주장은 분배와 형평성보다는 성장과 효율성을 중시하는 논리에 근거한다. 실제로 미국에서는 제41대 대통령인 부시가 1989년부터 1992년까지 낙수효과(trickle-down effect)에 기반을 둔 경제정책을 채택하기도 했다. 그러나 1993년 1월 당선된 클린턴 행정부는 이를 뒷받침하는 근거가 없다는 이유를 들어 이전의 정책을 포기한 바 있다. 2015년 국제통화기금(IMF)은 선진국, 신흥국 및 개발도상국을 대상으로 한 연구(“Causes and Consequences of Income Inequality : A Global Perspective”, IMF 2015년 6월)를 통해 상위소득 20% 계층의 비중이 커질수록 경제성장률이 낮아진다는 실증분석 결과를 발표하였는데, 이는 낙수효과가 현실에서 작동하지 않을 수 있음을 시사한다.","p":75},{"t":"분수효과","c":"정부","d":"저소득층의 소득을 늘려 주면 소비가 늘고, 그것이 생산과 투자를 늘려 경제 전체가 성장한다는 주장. 낙수효과와 반대이다.","x":"서민 지원을 늘리면 그 돈이 소비로 이어져 기업 매출도 늘어난다는 논리.","o":"분수효과(trickle-up effect, fountain effect)란 정부가 경제정책으로 저소득층과 중산층의 소득을 먼저 늘려주면 이들의 소비 확대가 생산과 투자로 이어지면서 전체 경제활동이 되살아나고 이로 인해 고소득층의 소득도 늘어날 수 있다는 주장이다. 즉 분수에서 물이 아래에서 위로 솟아나는 것처럼 저소득층에서 시작된 소득과 소비 증대의 효과가 점차 상위 계층으로 확산되면서 전체 경제도 좋아질 수 있다는 것이다. 이러한 주장은 영국의 경제학자인 케인즈(J. Keynes)가 경제 활성화에 긴요한 총수요 진작을 위해서는 상대적으로 한계소비성향이 높은 저소득층과 중산층에 초점을 맞추어 정부지출을 늘리고 세금을 줄여야 한다는 논리에 근거하고 있다. 따라서 이는 분배보다는 성장에, 그리고 저소득층보다는 고소득층에 중점을 두어 경제정책을 운용해야 한다는 낙수효과와는 상반되는 개념이다.","p":133},{"t":"낙인효과","c":"정부","d":"한번 나쁜 꼬리표가 붙으면 그것 때문에 계속 부정적으로 평가받는 현상.","x":"구제금융을 받은 나라는 경제가 회복되어도 한동안 불안한 나라로 여겨진다.","o":"범죄학의 낙인이론에 따르면 일탈 또는 범죄행동은 관련 주체의 독자적 행동에 의해서 도 발생하지만, 해당 행동에 대한 사회적 평가 또는 해당 행동을 한 주체의 사회적소외의 결과로도 발생할 수 있다. 어떤 사람이 실수나 불가피한 상황에 의해 사회적으로 바람직하지 못한 행위를 한 번 저지르고 이로 인해 나쁜 사람으로 낙인 찍히면 그사람에 대한 부정적 인식이 형성되고 이 인식은 쉽게 사라지지 않는다. 이로 인해 추후어떤 상황이 발생했을 때 해당 사람에 대한 부정적 사회인식 때문에 유독 그 사람에게 상황이 부정적으로 전개되어 실제로 일탈 또는 범죄행위가 저질러지는 현상을 낳는바, 이를 낙인효과라고 한다. 경제 분야에서도 이러한 현상이 발생한다. 예를 들어, 과거에 한 번 부도를 일으킨 기업이나 국가의 경우 이후 건전성을 회복했다 하더라도 시장의 충분한 신뢰를 얻기 어려워지며, 나아가 신용위기가 발생할 경우 투자자들이 다른 기업이 나 국가보다 해당 기업이나 국가를 덜 신뢰하여 투자자금을 더 빨리 회수하고 이로 인해 실제로 해당 기업이나 국가가 위기에 빠질 수 있다.","p":75},{"t":"규제 샌드박스","c":"정부","d":"새로운 기술이나 서비스가 나오면 일정 기간 기존 규제를 면제하거나 미뤄 주어 시험해 볼 수 있게 하는 제도.","x":"아이들이 모래 놀이터에서 자유롭게 노는 것처럼 신사업을 마음껏 시험해 보게 한다.","o":"규제 샌드박스(regulatory sandbox)는 핀테크 기업이 현행 규제를 적용받지 않으면서 자신의 혁신적인 금융상품과 비즈니스모델을 시험할 수 있는 공간이나 제도를 뜻한다. 이 용어는 어린이들이 안전하고 자유롭게 놀 수 있는 놀이터의 모래구역 즉 ‘sandbox’를 연상시킨다. 즉 규제 샌드박스에 참여하는 소비자에게는 안전장치를 두고, 혁신적인 기업가에게는 규제를 면제하거나 완화함으로써, 핀테크 기업의 새로운 도전과 시험을 활성화하려는 규제기관의 정책의지 또는 참여한 기업･소비자의 혁신적인 활동모습을 연상시킨다. 이는 영국의 금융감독기구인 금융행위규제청(FCA)이 핀테크 전담조직 (Innovation Hub)을 설치하고 지속적으로 관련 산업을 지원하기 위해 규제 개선의 필요성을 검토하는 가운데 규제 개선을 위한 여러 방안들 중의 하나로 도입한 것이다. 규제 샌드박스의 장점은 ① 혁신적인 아이디어가 시장(market)에 접근할 수 있는 시간과 비용을 줄이고 ② 혁신기업의 자금조달을 쉽게 해주며 ③ 더 많은 혁신적인 상품이 시험되고 시장에 도입될 수 있을 뿐만 아니라 ④ 규제기관이 미리 새로운 상품 및 서비스에 대한 적절한 소비자보호 안전장치를 확보할 수 있다는 점이다.","p":49},{"t":"중앙은행","c":"금융","d":"한 나라의 화폐를 발행하고 통화정책을 운영하며 금융 시스템을 안정시키는 은행. '은행의 은행', '정부의 은행'이라고 한다.","x":"우리나라의 중앙은행은 한국은행, 미국은 연방준비제도(Fed)이다.","o":"일반적으로 중앙은행은 독점적 발권력을 바탕으로 금융기관에 부족자금을 대출하는 은행의 은행 기능과 정부의 세입 및 세출을 관리하고 필요시 부족자금을 대출하는 정부의 은행 기능을 수행한다. 아울러 통화량 및 금리 조절을 통해 물가안정을 포함한 거시경제의 안정을 도모하는 한편 최종대부자 역할, 거시건전성 정책 등을 통해 금융안정에도 기여한다. 중앙은행이 처음부터 이러한 기능을 모두 수행한 것은 아니며 경제발전에 따라 진화하면서 여러 기능이 추가되었다. 중앙은행의 효시로는 1694년에 설립된 영란은행(Bank of England)을 꼽을 수 있다. 당시 영란은행은 상업은행이었으나 정부의 은행 역할을 수행하면서 화폐발행에 대한 독점권을 부여받았고 점차 은행의 은행 기능을 확대하면서 오늘날과 같은 모습을 갖추게 되었다. 20세기 이후에는 금본위제가 폐지되고 화폐의 적정관리가 중요해지면서 통화량 금리 환율 등의 관리를 통해 물가안정을 포함한 거시경제의 안정을 도모하는 통화신용정책이 중앙은행의 핵심기능으로 자리 잡게 되었다. 1970~80년대에는 석유파동 외채위기 등에 따른 물가불안과 경기침체에 대응하여 거시경제 안정화 노력을 강화하였고 이 과정에서 통화신용정책의 중립성을 제고하기위한 제도개선이 있었다. 1990년대 이후에는 금융자유화 등을 배경으로 새로운 금융상품의 출현 등으로 통화량 관리가 한계를 보이면서 한국은행을 비롯한 다수의 중앙은행이 물가안정목표제를 도입하였다. 한편 2008년 글로벌 금융위기를 계기로 거시건전성 정책의 중요성이 커지면서 미국 등 각국 중앙은행의 금융안정 기능을 강화하는 방향으로 제도개편이 이루어졌다.","p":266},{"t":"한국은행","c":"금융","d":"우리나라의 중앙은행. 화폐(지폐·동전)를 발행하고 기준금리를 정해 물가 안정을 이끈다.","x":"우리가 쓰는 지폐에는 '한국은행'이라는 글자가 적혀 있다.","o":"우리나라의 중앙은행인 한국은행은 1950년 6월 12일 ｢한국은행법｣에 의하여 설립되었다. 한 나라의 중앙은행이 수행하는 통화정책에는 경제발전 과정에서 나타나는 시대적과제가 반영되는 게 보통이다. 한국은행은 설립 이래 1950년대 전란극복과 금융체계정비, 1960~70년대 공업화와 성장통화 공급, 1980~90년대의 물가안정 기반구축과 금융자유화, 2000년대의 경제의 글로벌화와 금융위기 극복 등 시대가 요구하는 중앙은행의 기능과 역할을 충실히 수행해 왔다. 그동안 여러 차례의 ｢한국은행법｣ 개정으로 제도가 정비되어 왔는데 2011년 제8차 개정으로 한국은행의 목적 조항에 물가안정과 함께금융안정 책무가 명시되었다. 현행 ｢한국은행법｣은 한국은행의 설립목적을 효율적인 통화신용정책의 수립 및 집행을 통해 물가안정을 도모하고 이 과정에서 금융안정에도 유의하는 것으로 규정하고 있다.","p":322},{"t":"금융통화위원회","c":"금융","d":"한국은행의 통화정책을 결정하는 최고 의사결정 기구. 기준금리를 정한다.","x":"한국은행 총재를 포함한 7명의 위원이 모여 기준금리를 결정한다.","o":"금융통화위원회(monetary policy board)는 통화신용정책 수립 및 한국은행 운영에 관한 최고 의사결정기구로서 7명의 위원으로 구성된다. 한국은행 총재와 부총재는 금융통화위원회의 당연직 위원이 되고, 총재는 의장을 겸임한다. 총재는 국무회의 심의와 국회 인사청문을 거쳐 대통령이 임명하고, 부총재는 총재의 추천으로 대통령이 임명한 다. 임명직 위원들은 각 추천기관(기획재정부, 한국은행, 금융위원회, 대한상공회의소, 전국은행연합회)의 추천을 받아 대통령이 임명한다. 원칙적으로 매월 둘째, 넷째 목요일에 정기회의를 개최하고 필요한 경우 수시로 임시회의를 개최한다. 통화정책방향(기준금리 포함) 의결을 위한 정기회의는 종전의 매년 12회(매월)에서 2017년부터 매년 8회(1, 2, 4, 5, 7, 8, 10, 11월)로 변경되었다.","p":65},{"t":"기준금리","c":"금융","d":"중앙은행이 정하는 정책 금리로, 시중의 여러 금리를 정하는 기준이 된다.","x":"기준금리가 오르면 은행 대출 이자와 예금 이자도 함께 오른다.","o":"한국은행 금융통화위원회에서 결정하는 정책금리를 말한다. 한국은행과 금융기관간에 환매조건부채권매매(RP)와 대기성 여수신 등의 자금거래를 할 때 기준으로 적용된 다. 2008년 3월부터 한국은행은 정책금리의 실체를 종전의 ‘익일물 콜금리 목표’에서 ‘기준금리(base rate)’로 변경하였다. 콜금리는 대표적인 시장금리 중 하나로 초단기금융시장의 자금상황을 반영하는 금리이다. 그러나 1999년 콜금리목표제를 도입한 이후콜금리가 자금수급사정에 관계없이 목표수준에서 고정되면서 콜금리의 시장신호 전달및 자금배분 기능이 약화되었고, 단기자금거래가 콜시장에 과도하게 집중되어 금융기관간 RP 등 기일물 단기자금시장의 발달이 저해되는 부작용이 발생하였다. 한국은행이 정책금리의 실체를 ‘기준금리’로 변경한 것은 이러한 문제를 해소하는 한편 통화정책파급경로(정책금리 변경→단기 및 장기 시장금리 변동)의 원활한 작동을 도모한 것이다.","p":69},{"t":"통화정책","c":"금융","d":"중앙은행이 돈의 양이나 금리를 조절해 물가를 안정시키고 경제를 건전하게 성장시키려는 정책.","x":"물가가 오르면 금리를 올리고, 경기가 나쁘면 금리를 내린다.","o":"통화정책이란 독점적 발권력을 지닌 중앙은행이 통화량이나 금리에 영향을 미쳐물가안정, 금융안정 등을 달성함으로써 경제가 지속가능한 성장을 이룰 수 있도록 하는 정책을 말한다. 중앙은행이 처음부터 이와 같은 통화정책을 수행한 것은 아니었다. 초기 정부자금 관리나 은행제도 보호 등의 역할을 주로 하던 중앙은행이 경제상황변화에 대응하여 적정 수준의 통화공급을 통해 거시경제의 안정을 도모하게 된 것은 1930년대 대공황을 계기로 많은 나라들이 금본위제도를 포기하면서부터라고 할 수있다. 이때부터 중앙은행은 금과의 연계가 단절된 화폐를 발행하고 재량적으로 통화를 공급할 수 있게 되었다. 이러한 가운데 통화량과 물가가 밀접한 관계가 있다는 것을 알게 되면서 통화의 방만한 공급을 차단하여 물가를 안정시키는 것이 통화정책의 주된 목표로 일반화되고 보편적으로 받아들여지기 시작하였다. 특히 1970년대 두 차례의 석유파동으로 세계경제가 극심한 인플레이션의 폐해를 경험하면서 통화정책의 목표로 서 물가안정의 중요성이 더욱 확고해지고 통화정책은 거시경제정책의 하나로 자리 잡게 되었다. 통화정책 운영체제(monetary policy regime) 중앙은행은 역사적으로 경제구조의 변화, 금융시장의 발달 정도 등에 따라 다른 형태의 통화정책 운영체제를 도입해 왔다. 통화정책 운영체제는 명목기준지표(nominal anchor)를 기준으로 구분하는 것이 일반적이다. 이는 통화정책체계의 구성요소 중에서 최종목표나 정책수단 등은 어느 나라에 있어서나 본질적으로 비슷하며 차이가 있다고 하더라도 대개 정도의 문제라 할 수 있지만, 통화정책 수행에 있어 어떤 명목기준지표가 적합한지는 각국의 경제구조와 금융시장 발달 정도 등에 따라 달라지므로 상당히 큰차별성을 갖기 때문이다. 여기서 명목기준지표란 중앙은행이 최종목표와 연관성이 높다 고 생각하여 중점 관리하는 명목변수를 의미한다. 통화정책 운영체제는 명목기준지표를 통화량, 환율, 물가상승률 중 어느 것으로 하는지에 따라 각각 통화량목표제(monetary targeting), 환율목표제(exchange rate targeting), 물가안정목표제(inflation targeting)로 나뉘어진다. 일각에서는 기존 통화정책 운영체제의 대안으로 명목GDP목표제(nominal GDP targeting) 등과 관련한 논의도 이루어지고 있다.","p":304},{"t":"공개시장운영","c":"금융","d":"중앙은행이 금융시장에서 국채 등 증권을 사고팔아 시중의 돈의 양과 금리를 조절하는 정책 수단.","x":"한국은행이 증권을 사면 그 대금이 시중에 풀려 돈의 양이 늘어난다.","o":"공개시장운영(open market operation)은 중앙은행이 금융시장에서 금융기관을 상대로 국공채 등 증권을 매매하여 시중유동성이나 시장금리 수준에 영향을 미치는 통화정책수단이다. 공개시장운영은 다른 통화정책수단(지급준비제도, 여수신제도 등)에 비해 시기와 규모를 신축적으로 정할 수 있고 금융시장의 가격메커니즘에 따라 이루어지므로 시장친화적인 데다 즉각적인 매매거래만으로 신속하게 정책을 시행할 수 있다는 장점이 있어 대부분의 선진국 중앙은행들은 공개시장운영을 주된 통화정책수단으로 사용하고 있다. 우리나라의 경우 한국은행은 공개시장운영을 통해 금융기관의 지급준비금(지준) 보유 규모를 변동시킴으로써 콜금리가 기준금리에서 크게 벗어나지 않도록 조정한다. 즉 금융기관의 지준 부족(보유지준〈 필요지준)으로 콜머니가 증가하고 콜금리 상승압력이 증대될 경우 한국은행은 RP매입 등을 통해 지준을 공급하여 콜금리의 상승을 제한하며, 반대로 지준 잉여(보유지준 〉필요지준)로 콜론이 증가하고 콜금리 하락압력이 증대될 경우에는 RP매각, 통화안정증권 발행, 통화안정계정 예치 등을 통해 잉여 지준을 흡수하여 콜금리의 하락을 제한한다.","p":26},{"t":"양적완화정책","c":"금융","d":"금리를 더 내릴 수 없을 때 중앙은행이 국채 등을 대량으로 사들여 시중에 직접 돈을 많이 푸는 정책.","x":"2008년 금융위기 이후 미국 중앙은행이 대규모 양적완화를 실시했다.","o":"양적완화정책(QE; Quantitative Easing)이란 금리중시 통화정책을 시행하는 중앙은행이 정책금리가 제로 수준에 근접하게 인하(추가적인 정책금리 인하 여지가 없음)하였음에도 불구하고 경제 회복이 당초의 기대에 미치지 못함에 따라 장기금리 하락을 유도하기위해 국채 등을 무제한으로 매입하여 유동성을 충분히 공급함으로써 중앙은행의 대차대조표를 확대하는 정책을 말한다. 이러한 양적완화정책은 2001년 3월 일본은행이 제로금리 하에서 일본은행 당좌예금잔액을 확대하는 정책을 도입하면서 처음으로 사용되었다. 2008년 9월 글로벌 금융위기가 실물부문으로 빠르게 확산하면서 주요 선진국의 경기침체가 심화되자 주요국 중앙은행은 전통적 통화정책의 한계에 봉착하게 되었고, 이러한 상황을 타개하기 위해 비전통적 통화정책 수단인 양적완화정책을 실시하게 되었다. 양적완화는 통화정책의 완화기조가 상당 기간 유지될 것이라는 신호를 줌으로써 민간경제주체들의 향후 경기회복에 대한 기대를 높이거나, 금융시장 유동성 사정 개선 및 위험회피 심리 완화로 금융기관 대출이 늘어나는 등의 경로를 통해 금융시장 및 실물경제에 영향을 미치게 된다. 하지만 양적완화가 장기간 지속될 경우에는 민간 경제주체들의 과도한 수익 추구 행위 등으로 금융불균형이 심화되는 부작용이 발생할 가능성이 있다. 한편 중앙은행이 양적완화정책으로 크게 늘어난 보유자산 규모를 경기회복세 등을 배경으로 점진적으로 축소할 때 그 속도가 경기회복세에 비하여 더딜 경우에는 과잉 유동성이 자칫 물가상승압력으로 작용할 가능성도 배제할 수 없다. 한편 양적완화정책과 대비되는 개념으로 질적완화정책(Qualitative Easing)이 있다. 이것은 중앙은행의 대차대조표는 확대하지 않으면서 중앙은행의 자산구성을 변경하는 것이다. 즉, 중앙은행은 대부분무위험자산인 국채를 보유하고 있는데 이중 일부를 신용위험이 있는 채권으로 포트폴리오를 조정(중앙은행이 금융시장에서 신용위험채권을 매입함을 의미)함으로써 금융시장의 신용경색을 타개하고자 하는 정책수단이다.","p":186},{"t":"제로금리정책","c":"금융","d":"경기를 살리기 위해 기준금리를 0%에 가깝게 낮추는 정책.","x":"일본은 오랜 경기 침체를 벗어나기 위해 제로금리를 유지했다.","o":"금융기관 간에 여유자금과 부족자금을 빌리는 단기금융시장에서 거래되는 초단기자금의 금리(한국과 일본의 콜금리, 미국의 페더럴펀드금리 등)를 0%에 가까운 수준으로 떨어뜨리는 통화정책을 말한다. 중앙은행이 단기금리를 제로 근처로 유도하는 것은 시중 유동성을 풍부하게 하여 금융경색을 억제하고 경기침체를 극복하기 위한 목적인 것이 보통이다. 일본의 경우 1999년 초 일본은행이 경기활성화를 위해 콜금리를 0.02%까지 떨어뜨리며 제로금리정책을 펼쳤으나 당초 기대만큼 소비나 투자활성화가 이루어지 지 않아 2006년 7월 제로금리정책을 폐기한 바 있다. 이와 관련하여 2001년 3월 일본은행은 장기간의 경기침체에서 벗어나기 위해 양적완화(QE; Quantitative Easing) 정책을 처음으로 도입했다. 양적완화는 금리가 제로(‘0’)에 가까운 상태에서 경기부양을 위해 국채 등 다양한 금융자산의 매입을 통해 시중에 돈을 공급하는 것이다. 중앙은행이 금리를 조절해 간접적으로 시중 유동성을 조절하던 전통적인 방식과 달리 양적완화는 금융자산 등을 사들이는 방법으로 시장에 통화량 자체를 늘리는 정책인데 2008년 글로벌금융위기 이후 미국, EU, 영국 등 국제적으로 도입이 확산돼 왔다. 2008년 12월 글로벌금융위기로 미국도 제로금리를 도입하였다.","p":255},{"t":"출구전략","c":"금융","d":"경기 침체 때 썼던 돈 풀기 정책(금리 인하, 양적완화 등)을 경기가 회복되면 서서히 거두어들이는 전략.","x":"경기가 회복되자 중앙은행이 금리를 조금씩 올리기 시작했다.","o":"출구전략(exit strategy)이란 경제 위기 발생시 경기를 부양하기 위해 취하였던 각종완화정책을 정상화하는 것을 말한다. 본래 군사전략에서 비롯된 용어로 미국이 베트남전쟁 당시 승산 없는 싸움에서 피해를 최소화하며 군대를 철수할 방안을 모색할 때 사용한 용어이다. 현재는 의미가 확장되어 위기상황을 극복하고자 취했던 조치들의 부작용이나후유증을 최소화하며 정상으로 돌아오기 위해 취하는 조치들을 포괄적으로 지칭한다. 2008년의 글로벌 금융위기와 관련해서는 중앙은행이 위기극복을 위해 이례적으로 취했던대책(제로금리정책 및 양적완화 등)을 정상화하는 조치를 의미하는 용어로 사용되었다.","p":289},{"t":"유동성 함정","c":"금융","d":"금리를 아무리 낮추고 돈을 풀어도 사람들이 돈을 쓰거나 투자하지 않고 쌓아 두기만 해서 경기가 살아나지 않는 상태.","x":"금리가 거의 0%인데도 소비와 투자가 늘지 않는 상황.","o":"유동성 함정(liquidity trap)이란 금리 인하를 통한 확장적 통화정책이 투자나 소비등 실물경제에 영향을 주지 못하는 상태를 말한다. 경제가 침체될 것으로 예상되면 중앙은행은 정책금리를 낮추고 유동성을 공급한다. 그러나 금리를 계속 낮추는데도 경기가 회복되지 않고 이 이후에 명목이자율을 더 이상 낮출 수 없어 확장적 통화정책을 통한 경기 진작은 어려워지는데 이를 유동성 함정에 빠졌다고 표현한다. 유동성 함정이 존재하는 경제에는 대체로 다음과 같은 상황이 일어난다. 일반적으로 총수요가 감소하여 경기가 침체하고 물가가 하락한다. 만약 경기가 계속 침체하여 디플레이션이 발생하면 명목이자율이 일정할 경우 실질이자율이 상승한다. 예를 들어 명목이자율이 0%이고 물가상승률이 -3%라고 한다면 실질이자율은 3%가 된다. 즉, 유동성 함정 하에서 명목이 자율이 0%에 가까운 매우 낮은 상황이라 하더라도 가계와 기업이 직면하는 실질이자율은 오히려 높은 수준이 유지되어 투자와 소비가 감소한다. 또한 총수요 감소는 추가적인 물가 하락과 이에 따른 실질이자율의 상승으로 이어져 경제를 더욱 악화시킬 수 있다.","p":213},{"t":"유동성","c":"금융","d":"자산을 손해 없이 얼마나 빨리 현금으로 바꿀 수 있는지의 정도. 시중에 풀린 돈의 양을 뜻하기도 한다.","x":"현금은 유동성이 가장 높고, 집은 팔기까지 시간이 걸려 유동성이 낮다.","o":"유동성(liquidity)이란 자산을 현금으로 전환할 수 있는 정도를 나타내는 용어로 기업의 자산을 필요한 시기에 손실 없이 화폐로 바꿀 수 있는 정도를 나타낸다. 유동성은 자산의 유동성과 경제주체의 유동성으로 구분되는데 자산의 유동성은 화폐의 유동성과 화폐를 제외한 자산의 유동성으로 나뉜다. 화폐의 유동성은 화폐가 다른 재화나 서비스로 전환되는 정도를 말한다. 자산의 유동성은 화폐 이외의 자산을 화폐로 전환한 후다른 재화나 서비스로 전환하는 정도를 말한다. 자산의 유동성은 전환대상 자산의 양과 질, 시장의 형성, 거래 방법, 재금융의 가능성 등에 따라 유동성의 정도가 달라진다. 한편, 경제주체의 유동성은 각 경제주체가 채무를 충당할 수 있는 능력을 말한다. 이러한 유동성 개념은 위와 같은 본래의 의미로부터 파생되어 다음의 두 가지 형태로도 사용된 다. 첫째로 유동성은 시중의 현금과 다양한 금융상품 중 어디까지를 통화로 정의할지 구분하는 기준으로 사용된다. 우리나라에서는 유동성이 높은 정도에 따라 통화 및 유동성 지표를 현금통화, M1, M2, Lf, L로 구분한다. 둘째로 유동성은 현금을 비롯하여 유동성이 높은 통화 그 자체와 같은 뜻으로 사용되기도 한다. “시중의 풍부한 유동성”, “한국은행이 실시한 유동성 공급 정책” 등과 같은 예에서 유동성은 통화 그 자체를 의미한다.","p":212},{"t":"본원통화","c":"금융","d":"중앙은행이 처음 공급한 돈. 시중의 현금과 은행이 중앙은행에 맡긴 지급준비금으로 이루어진다.","x":"본원통화가 은행을 거쳐 대출되면서 시중의 돈이 몇 배로 늘어난다.","o":"통화는 일차적으로 중앙은행의 창구를 통하여 공급되는데, 이를 통화량의 원천이 되는 통화라 하여 본원통화(RB; Reserve Base)라고 한다. 본원통화는 민간보유현금과 금융기관의 지급준비금의 합계인데, 이는 중앙은행 대차대조표상의 화폐발행액과 금융기관의 지급준비예치금의 합계와 같다. 중앙은행이 증권을 매입하거나 금융기관에 대출을 실시하면 금융기관의 지급준비금이 늘어나 본원통화가 증가하게 된다. 중앙은행이 보유하고 있는 정부예금을 정부가 필요에 따라 인출하는 경우에도 본원통화가 공급된다. 이렇게 공급된 통화의 일부는 민간의 현금보유성향에 따라 민간보유로 남게 되며, 나머지는 대부분 금융기관의 예금에 대한 지급준비금이 된다. 그런데 금융기관은 지급준비금 가운데 중앙은행에 서 정하는 필요지급준비금을 제외한 나머지 자금을 대출 등으로 민간에 공급한다. 민간에 공급된 자금은 상당부분이 금융기관에 예금 등으로 다시 유입되고, 금융기관은 그 가운데필요 지급준비금을 제외한 나머지를 또다시 민간에 공급한다. 이러한 과정이 반복됨으로써금융기관은 본원통화의 여러 배(통화승수)에 해당되는 파생통화를 시중에 공급하게 된다. 이러한 과정을 수식화하면 ‘통화량=통화승수×본원통화’가 된다.","p":127},{"t":"신용창조","c":"금융","d":"은행이 예금 중 일부만 남기고 나머지를 대출하는 과정이 반복되면서 처음 예금보다 훨씬 많은 돈이 시중에 생겨나는 현상.","x":"100만 원 예금이 대출과 재예금을 거듭하며 시중 통화를 수백만 원으로 늘린다.","o":"신용창조(credit creation)는 일반적으로 은행이 예금과 대출업무를 반복적으로 취급하는 과정에서 예금통화를 만들어내는 현상을 말한다. 예를 들어 중앙은행이 A은행에 100만큼의 본원통화를 공급하면 A은행은 이중 10(지급준비율 10%, 민간의 화폐보유성향 0% 가정)을 지급준비금으로 남겨두고 나머지 90을 대출로 운용한다. 대출받은 사람이 이를 B은행에 예금을 하면 B은행은 다시 이 가운데 9를 지급준비금으로 남겨두고 나머지 81을 다시 대출하게 된다. 이러한 과정이 무한정 반복되면 결국 예금은 1,000(그러나대출받는 사람이 전부 예금하기 보다는 이중 일부를 현금으로 보유하게 되는데 그러면 동 현금 부분은 신용창조 사이클에서 누락되므로 실제통화량은 1,000 보다 작아진다)만큼 늘어난다. 즉, 100이라는 본원통화가 신용창조를 통해
