 1,000이라는 예금통화가 창출되었다. 본원통화와 통화량 사이의 관계를 통화승수라 하는데 여기서 통화승수는 10이다 (1000÷100). 지급준비율을 변경하면 승수효과를 통해 신용창출효과(통화량)에 영향을 주기 때문에 지급준비제도는 중앙은행의 핵심적인 유동성조절 수단이다. 지급준비율을 인하하면 통화승수가 커지기 때문에 통화량이 늘어나고 반대로 지급준비율을 인상하면 통화승수가 줄어들기 때문에 통화량이 감소한다. 그래서 중앙은행은 통화완화가 필요한 경우에는 지급준비율 인하를 통해, 통화긴축이 필요한 경우에는 지급준비율 인상을 통해 통화량을 조절하게 된다.","p":175},{"t":"지급준비제도","c":"금융","d":"은행이 받은 예금 중 일정 비율을 중앙은행에 의무적으로 맡기게 하는 제도. 이 비율로 시중 돈의 양을 조절할 수 있다.","x":"지급준비율을 높이면 은행이 대출할 수 있는 돈이 줄어든다.","o":"중앙은행이 금융기관으로 하여금 예금 등과 같은 채무의 일정비율에 해당하는 금액을 중앙은행에 예치하도록 하는 제도이다. 은행이 예금고객의 지급요구에 응하기 위해 미리준비해 놓은 유동성 자산을 지급준비금이라 하고, 적립대상 채무 대비 지급준비금의 비율을 지급준비율이라 한다. 지급준비금은 은행이 중앙은행에 예치하고 있는 자금(지준예치금)과 보유하고 있는 현금(시재금)으로 구성된다. 지급준비제도(reserve requirement)는 1863년 미국에서 예금자보호를 위해 법정지급준비금을 부과한 것이 효시라 할 수 있다. 그 후 1930년대 들어 지급준비율을 변경하여 본원통화를 조절하면 승수효과를 통해 통화량에 영향을 준다는 사실이 밝혀지면서 지급준비제도는 중앙은행의 유동성조절수단으로 그 위상이 높아졌다. 그러나 1980년대 이후 금융의 자유화 및 개방화 등으로 시장기능에 바탕을 둔 통화정책의 필요성이 부각되면서 공개시장운영이 주된 통화정책수단으로 부각된 가운데 지급준비제도는 여러 한계점으로 인해 정책수단으로서의 역할 이 상대적으로 축소되었다. 그러나 중앙은행은 지급준비율 변경을 통해 금융기관의 자금사정을 변화시키고 시중유동성을 조절할 수 있으며 나아가 금융안정을 도모하고 금융시장에 중앙은행의 정책방향을 강력하게 알리는 공시효과가 있기 때문에 지급준비제도는 여전히 유용한 정책수단으로 활용되고 있다.","p":272},{"t":"신용경색","c":"금융","d":"금융기관들이 돈을 빌려주지 않아 기업과 가계가 돈을 구하기 매우 어려워진 상태.","x":"금융위기 때 은행들이 대출을 중단하자 멀쩡한 기업도 돈이 막혀 어려움을 겪었다.","o":"금융기관 등에서 돈의 공급이 원활히 이루어지지 않아 어려움을 겪는 현상을 의미한 다. 신용경색은 금융시장에 공급된 자금의 절대량이 적거나 자금의 통로가 막혀 있을 때 주로 발생한다. 신용경색(credit crunch)이 발생하면 기업들은 자금 부족으로 인해 정상적인 경영 활동에 어려움을 겪게 되고 무역업체들도 수출입 활동에 큰 제약을 받게 된다. 신용경색이 나타나는 과정은 보통 다음과 같다. 먼저 일부 은행의 도산이나부실화로 인해 금융시스템 내의 대출 가능 규모가 줄어들게 되고, 이들 은행과 거래하던기업들의 차입이 어려워지면서 기업 도산확률이 높아지게 된다. 이렇게 되면 건전한 은행들도 높아진 기업의 신용위험과 유동성 위험 등에 대비하여 대출 규모를 축소하기때문에 금융시스템 내 유동성이 부족해져 자금공급이 더욱 위축되는 악순환이 발생하게 된다. 신용경색은 주식, 채권 등 직접금융시장이 발달하지 못한 경우 실물경제에 더큰 충격을 준다. 부문별로는 신용도가 낮은 중소기업이나 가계와 같이 직접금융시장을 이용하기 어려운 부문에 더 큰 영향을 미치게 된다. 우리나라도 1998년 외환위기시극심한 신용경색으로 인해 많은 기업이 도산한 경험이 있다.","p":173},{"t":"뱅크런","c":"금융","d":"은행이 망할지도 모른다는 불안 때문에 예금자들이 한꺼번에 예금을 찾으려고 몰려드는 현상.","x":"은행 부실 소문이 돌자 사람들이 은행 앞에 줄을 서서 돈을 찾았다.","o":"은행의 대규모 예금인출사태를 가리키는 말이다. 금융시장 상황이 불안하거나 은행의 경영 및 건전성 등에 문제가 발생하면 예금자들은 은행에 맡긴 돈을 보장받을 수 없을 것이라는 불안감에 저축한 돈을 인출하게 되고 은행은 지급할 수 있는 자금이 부족하게 되어 패닉 상태에 빠질 수 있다. 이를 뱅크런(bank run)이라 부르며 예금보험공사는 뱅크런과 이로 인한 금융불안정을 방지하기 위해 예금자보호법에 의해 5,000만 원까지의 예금을 보호해주고 있다.","p":122},{"t":"예금보험제도","c":"금융","d":"은행 같은 금융회사가 망해도 예금자가 일정 금액까지는 돌려받을 수 있도록 보장해 주는 제도.","x":"우리나라는 예금보험공사가 1인당 일정 한도까지 예금을 보호한다.","o":"예금보험은 금융기관의 예금지급 정지, 파산 등으로 해당 금융기관이 기존 예금자의 예금인출요구에 응할 수 없는 경우 예금보험기관이 당해 금융기관을 대신하여 예금을 지급함으로써 예금자를 보호하고, 대규모 예금인출사태(뱅크런)를 방지하여 금융안정을 유지하도록 하는 공적보험이다. 보험가입금융기관은 이러한 서비스의 대가로 일정한 보험료를 정기적으로 예금보험기관에 납부하여야 한다. 일반적으로 예금자를 보호하는 수단으로 금융기관 감독제도, 지급준비금제도 및 상호보장제도 등이 있으나 예금보험제도는 여타 감독 수단보다도 가장 직접적으로 예금자를 보호하는 수단으로서 금융제도의 안정성 유지를 위해 다수 국가에서 시행하고 있다. 우리나라에서는 일부 금융업권에서 개별적으로 기금을 조성하여 예금보험제도를 운영하다가, 1996년 6월 ‘예금자 보호법’이 시행되면서 예금보험공사가 예금보험업무를 전담하고 있다. 예금보험의 적용대상기관은 은행, 투자매매업자, 투자중개업자, 증권금융회사, 보험회사, 종합금융회사, 상호저축은행 및 상호저축은행중앙회이며, 예금, 적금, 부금, 수입보험료 및 확정기여형퇴직연금적립금 등을 적용대상예금으로 한다. 동일한 금융회사 내에서 예금자 1인이 보호받을 수 있는 한도(원금과 소정의 이자 합산)는 예금보험공사 설립 당시 2,000만원이었고, 1997년 11월에는 예금 전액으로 확대되기도 하였으나, 2001년 1월부터는 5,000만원으로 운용되고 있다.","p":194},{"t":"예대금리차(예대마진)","c":"금융","d":"은행이 대출에 받는 이자율과 예금에 주는 이자율의 차이. 은행의 주요 수익원이다.","x":"대출 금리 5%, 예금 금리 3%라면 예대금리차는 2%포인트이다.","o":"예대금리차(예대마진)는 자금중개기관인 은행이 자금차입자로부터 수취하는 대출금리와 예금자에게 지급하는 예금금리간의 격차로서 은행수익의 본질적 원천이 된다. 예대금리차는 간단히 표현하면 대출금리(수입이자/대출금)에서 예금금리(지급이자/ 예수금)를 차감한 것으로, 분석목적에 따라 신규취급액 또는 잔액을 기준으로 측정할 수 있다. 또한 이와 유사한 개념인 순이자마진(net interest margin)은 예대업무 뿐만아니라 유가증권투자에서 얻는 수익과 비용까지 포함하는 광범위한 수익성지표로 총이자수익에서 총이자비용을 차감한 금액을 이자부자산 총액으로 나눈 값을 말한다. 일반적으로 예대금리차는 예금과 대출시장의 경쟁도가 낮을수록, 은행의 위험기피성향이 강할수록, 대출취급에 따른 한계비용이 클수록, 신용위험이 높을수록 확대되는 것으로 알려져 있다.","p":194},{"t":"고정금리","c":"금융","d":"돈을 빌린 기간 동안 시장 금리가 변해도 처음 정한 금리가 그대로 유지되는 방식.","x":"금리가 오를 것 같으면 고정금리로 대출받는 것이 유리하다.","o":"고정금리란 최초 약정한 금리가 만기때까지 그대로 유지되는 금리를 의미하며 변동금리란 일정 주기별로 시장 금리를 반영하여 약정금리가 변동하는 금리를 의미한다. 예를 들어 만기 1년, 약정금리는 4%의 고정금리라면 약정기간 1년 동안 시장금리가 어떻게 변하더라도 해당 약정금리는 4%이다. 반면 만기 1년, 변동주기 3개월, 약정금리는 CD금리+0.5%(또는 50bp)의 변동금리라면 3개월에 한번씩 변동된 CD금리에 연동하여 약정금리가 변하게 된다. 예를 들어 CD금리가 최초 약정시 3.0%, 약정 3개월후 3.2%, 6개월후 3.5%, 9개월후 4.0%라면 약정금리는 최초 약정시 3.5%, 약정 3개월후 3.7%, 6개월후 4.0%, 9개월후 4.5%가 된다. 자금 차입자 입장에서는 앞으로 시장금리가 상승할 것으로 예상하는 경우에는 고정금리를 이용하는 것이 유리하고 시장금리가 하락할 것으로 예상하는 경우에는 변동금리를 이용하는 것이 유리하다. 주요 선진국 중앙은행의 정책금리인상, 양적완화 축소 등 글로벌 금융긴축으로의 전환이 우리나라에도 시장금리 상승을 야기하고 있는 상황에서 주택담보대출 차입자의 재무건전성을 유지하기 위해 정부가 고정금리대출을 장려하는 것도 이런 이유 때문이다. 일반적으로 동일 만기에서는 고정금리가 변동금리 보다 높은데 이는 자금 대여자(은행)에게 약정 기간중 금리 변동에 따른위험 프리미엄이 존재하기 때문이다.","p":22},{"t":"변동금리","c":"금융","d":"시장 금리의 변화에 따라 일정 기간마다 대출이나 예금의 금리가 바뀌는 방식.","x":"기준금리가 오르면 변동금리 대출의 이자 부담도 늘어난다.","o":"변동금리란 시장금리를 반영하여 일정 주기별로 약정금리가 변하는 금리를 의미하며 고정금리란 최초 약정한 금리가 만기때까지 그대로 유지되는 금리를 의미한다. 예를 들어 만기 1년, 약정금리는 4% 고정금리라면 약정기간 1년 동안 시장금리가 어떻게 변하더라도 해당 약정금리는 4%이다. 반면 만기 1년, 변동주기 3개월, 약정금리는 CD금리+0.5%(또는 50bp)의 변동금리라면 3개월에 한번씩 변동된 CD금리에 연동하여 약정금리가 변하게 된다. 예를 들어 CD금리가 최초 약정시 3.0%, 약정 3개월후 3.2%, 6개월후 3.5%, 9개월후 4.0%라면 약정금리는 최초 약정시 3.5%, 약정 3개월후 3.7%, 6개월후 4.0%, 9개월후 4.5%가 된다. 자금 차입자 입장에서는 앞으로 시장금리가 상승할 것으로 예상하는 경우에는 고정금리를 이용하는 것이 유리하고 시장금리가 하락할 것으로 예상하는 경우에는 변동금리를 이용하는 것이 유리하다. 일반적으로 동일 만기에서는 고정금리가 변동금리 보다 높은데 이는 자금 대여자(은행)에게 약정 기간중 금리 변동에 따른위험 프리미엄이 존재하기 때문이다. 한편 변동금리의 준거가 되는 금리는 CD금리가 주로 활용되었으나 지금은 COFIX와 은행채 금리도 많이 활용되고 있다.","p":123},{"t":"명목금리/실질금리","c":"금융","d":"명목금리는 겉으로 표시된 금리, 실질금리는 명목금리에서 물가 상승률을 뺀 실제 금리이다.","x":"예금 금리가 3%인데 물가가 4% 올랐다면 실질금리는 -1%이다.","o":"금리는 돈의 가치 즉 물가변동을 고려하느냐의 여부를 기준으로 명목금리와 실질금리로 구분할 수 있다. 명목금리는 돈의 가치 변동을 고려하지 않고 외부로 표현된 표면상의 금리를 말한다. 이에 반하여 실질금리는 물가상승률을 고려한 금리를 의미한다. 예컨대금년 중 1년 만기 정기예금의 명목금리가 3%이고 물가상승률이 1%일 경우 명목금리는 3%이지만 실질금리는 2%(=3%-1%)가 된다. 한편 금리와 물가의 관계를 설명하는 피셔효과(Fisher)란 금융거래시 명목금리는 실질금리에 예상 물가상승률을 더해서 결정되는 것을 말한다. 예를 들어 통화정책으로 금리를 조정할 때 시장참가자들은 미래의 인플레이션율을 합리적으로 예상하여 실질금리에 덧붙이는 형태로 금리를 결정한다면 실질금리는 변하지 않게 되고 결국 명목금리만 조정된다는 것이다. 경험적으로 1970~80년대두 자릿수의 인플레이션 시대에 명목금리에서 물가상승률을 차감한 사후적(ex post) 실질금리가 마이너스로 나타나는 사례도 있어 장기적으로 실질금리가 불변한다는 견해 에 대해서는 논란이 있다.","p":110},{"t":"단리/복리","c":"금융","d":"단리는 원금에만 이자가 붙는 방식, 복리는 원금과 이미 붙은 이자를 합한 금액에 다시 이자가 붙는 방식이다.","x":"100만 원을 연 10%로 2년 맡기면 단리는 120만 원, 복리는 121만 원이 된다.","o":"단리(simple interest)는 원금에 대해서만 약정된 이율과 기간을 곱하여 이자를 산출하는 방식이다. 예를 들어 1억원을 만기 2년, 연 3%에 단리로 정기예금을 하는 경우 2년후 원리금은 106백만원[100백만원(1+3%x2)]이다. 이때 실효수익률은 연 3%(6%/2) 로 표면금리와 동일하다. 반면 복리(compound interest)는 일정 기간마다 발생한 이자를 원금에 합산한 후 그 합산금액에 대한 이자를 다시 계산하는 방식이다. 예를 들어 1억원을 만기 2년, 연 3%에 6개월 복리(6개월마다 이자를 원금에 가산)로 정기예금을 하는 경우 2년후 원리금은 106.14백만원[100백만원(1+3%/2) ]이다. 이 경우 실효수익률은 연 3.07%(6.14%/2)이다. 위 예에서는 복리로 예금했을 때 단리보다 14만원의 이자를 더받게 된다. 복리효과는 간단히 말해 이자가 이자를 낳는 원리이기 때문에 시간이 지날수록 추가되는 이자부분이 커지면서 전체 저축 원리금이 기하급수적으로 늘어나는 원리이 다. 따라서 저축기간이 짧으면 복리효과가 크지 않은 반면 저축기간이 길면 길수록약간의 금리 차이(복리가 단리보다 높으므로)에도 이자금액이 크게 벌어지게 된다. 복리에서는 72법칙이라는 것이 있다. 이자가 복리로 붙을 경우 원리금이 커지기 때문에 원리금이 두 배(100%)로 불어나는데 필요한 저축기간과 수익률의 곱이 100%가 아니라 72%만 되면 된다는 것이다. 위 예에서 보면 1억원을 2억원으로 불리는데 걸리는 기간은 단리의 경우 약 33년(100백만원/3백만원)이 소요되는 반면 복리의 경우 24년(72%/3%) 이 소요되어 1억원을 2억원으로 불리는데 걸리는 기간이 복리가 단리보다 9년이나짧다. 우리가 꾸준한 저축을 강조하는 이유는 저축의 경제적 성과 뒤에는 복리효과가 숨어있기 때문이다.","p":82},{"t":"담보인정비율(LTV)","c":"금융","d":"집 같은 담보의 가치에 비해 최대 얼마까지 대출해 줄지를 정한 비율.","x":"LTV가 60%라면 5억 원짜리 집을 담보로 최대 3억 원까지 빌릴 수 있다.","o":"자산의 담보가치에 대한 대출 비율을 의미하며, 우리나라에서는 주택가격에 대한 대출 비율로 많이 알려져 있다. 예를 들어 아파트 감정가격이 5억원이고 담보인정비율이 70%이면 금융기관으로부터 3억 5천만원의 주택담보대출을 받을 수 있다. ｢은행업 감독업무시행세칙｣에서는 주택담보대출의 담보인정비율 산정방식을 다음과 같이 제시하고 있다. 담보인정비율 = (주택담보대출 + 선순위채권 + 임차보증금 및 최우선변제 소액임차보증금) / 담보가치 × 100. 여기서 담보가치는 ① 국세청 기준시가 ② 한국감정원 등 전문감정기관의 감정평가액 ③ 한국감정원의 층별․호별 격차율 지수로 산정한 가격 ④ KB부동산시세의 일반거래가격 중 금융기관 자율로 선택하여 적용한다. 당초 LTV(Loan to Value ratio) 규제는 은행권을 중심으로 내규에 반영하여 자율적으로 시행해 오다가 금융기관의 경영 안정성 유지, 주택가격 안정화 등을 위한 주택담보대출 규모의 관리 필요성이 제기되면서 감독규제 수단으로 도입되었다. 최근에는 가계부채 증가 억제 및 부동산경기 조절 등 거시건전성정책 수단으로 활용되고 있으며, 금융기관별, 지역별로 세분화하여 차등 적용되고 있다. 한편, 금융기관은 담보인정비율(LTV)과 차주의 부채상환능력을 나타내는 총부채상환비율(DTI)을 함께 고려하여 대출규모를 결정한다.","p":83},{"t":"총부채상환비율(DTI)","c":"금융","d":"연 소득 중에서 주택담보대출의 원금과 이자, 다른 빚의 이자를 갚는 데 쓰는 돈의 비율. 소득에 맞게 대출받도록 하는 기준이다.","x":"DTI가 40%라면 연 소득 5천만 원인 사람은 1년에 2천만 원까지만 빚을 갚는 데 쓰도록 대출이 제한된다.","o":"주택담보대출 차주의 원리금상환능력을 감안하여 주택담보대출 한도를 설정하기 위해 도입된 규제 비율이다. ｢은행업 감독규정｣에서는 동 비율을 “DTI = (해당 주택담보대출의 연간 원리금 상환액 + 기타부채의 연간 이자상환액) / 연소득 × 100” 방식으로 산정하도록 하고 있다. DTI(Debt to Income ratio) 규제는 LTV 규제 강화의 후속조치로 2005년 8월 도입되었으며, 이는 차주의 소득수준과 관계없이 주택가격에 비례하여 주택담보대출 한도가 결정되는 LTV 규제의 문제점을 보완하고자 도입한 것이다. 특히 과도한 가계부채의 증가 억제 및 주택자금 수요 축소 등을 위해 DTI 비율을 특정수준 이내로 제한하기도 한다. 한편, DTI는 LTV와 함께 대표적인 거시건전성정책의 수단으로서 통화신용정책과 상호 보완적인 관계를 가지고 있다. 예를 들어 저금리 하에서 주택가격상승세가 확대될 경우 DTI 및 LTV 규제를 강화하면 주택담보대출 한도가 축소되어주택시장 과열을 억제하는 효과를 기대할 수 있다.","p":284},{"t":"부채비율","c":"금융","d":"기업의 자기 돈(자기자본)에 비해 빚(부채)이 얼마나 많은지를 나타내는 비율. 높을수록 재무 상태가 위험하다.","x":"자기자본 100억 원, 부채 200억 원이면 부채비율은 200%이다.","o":"부채를 자기자본으로 나눈 비율로 타인자본(부채)과 자기자본간의 관계를 나타내는 대표적인 안전성 지표이다. 이 비율이 낮을수록 재무구조가 건전하다고 판단할 수 있다. 부채비율은 자기자본비율과 역(逆)의 관계에 있어 자기자본비율이 높을수록 부채비율은 낮아지게 된다. 타인자본은 차입금, 회사채, 매입채무, 미지급금, 부채성충당금 등의 부채를 말하며 1년 이내에 지급기일이 도래하는 부채는 유동부채, 1년 이후에 지급기일이 도래하는 부채는 비유동부채이다. 경영자 입장에서는 단기채무 상환의 압박을 받지 않고 투자수익률이 이자율을 상회하는 한 타인자본을 계속 이용하는 것이 유리하다. 그러나 채권회수의 안전성을 중시하는 채권자는 부정적일 수 있는데 기업의 부채비율이 지나치게 높을 경우 추가로 부채를 조달하는 것이 어려울 뿐 아니라 과다한 이자비용의 지급으로 수익성도 악화되어 지급불능 상태에 직면할 가능성이 높아지기 때문이다. 부채비율 = (유동부채 + 비유동부채)/자기자본 × 100 북미자유무역협정(NAFTA) 미국 캐나다 멕시코 등 북미 3개국 간의 자유무역을 추진하기 위해 체결된 협정으로 서 1994년 1월 1일 공식 발효되었다. 주요 내용은 미국, 캐나다, 멕시코 등 3국 사이의 재화 및 서비스 이동에 대한 각종 관세 및 비관세장벽을 향후 15년간 단계적으로 철폐한 다는 것이다. 미국과 캐나다 사이에는 1989년 1월에 자유무역협정이 발효된 바 있는데멕시코가 포함된 NAFTA(North American Free Trade Agreement)는 지적재산권, 투자, 운송서비스 등과 관련된 규정이 추가됨으로써 적용범위가 훨씬 넓어졌다. 즉 시장접근및 원산지 규정 등 상품교역과 관련된 사항, 투자 및 서비스 관련사항, 지적재산권등을 상세하게 규정하고 있으며 환경에 관한 사항도 명문화하고 있다. 이 협정에 대해서 는 미국의 자본과 기술, 캐나다의 자원, 멕시코의 노동력이 결합되어 지역경제를 발전시켰다는 평가와 함께 시장보호와 블록경제화를 초래하여 역외국에 대한 무역장벽으로 작용한다는 비판도 있다.","p":131},{"t":"주식시장","c":"금융","d":"기업이 발행한 주식을 사고파는 시장. 기업은 돈을 모으고 투자자는 이익을 기대한다.","x":"우리나라의 대표적인 주식시장은 코스피와 코스닥이다.","o":"주식시장은 주식회사의 지분권을 표시하는 유가증권인 주식이 거래되는 시장이다. 주식시장은 기업공개, 유상증자 등을 통해 주식이 새롭게 공급되는 발행시장과, 이미발행된 주식이 투자자간에 거래되는 유통시장으로 나누어진다. 발행시장은 새로운 주식이 최초로 출시되는 시장으로 제1차 시장(primary market)이라고도 한다. 발행시장은 기업, 금융기관 등 자금수요자인 발행인, 자금공급자인 투자자, 주식발행사무를 대행하고 발행위험을 부담하는 인수인으로 구성된다. 유통시장은 이미 발행된 주식이 매매되는 시장으로 제2차 시장(secondary market)이라고도 한다. 유통시장은 발행된 주식의 시장성과 환금성을 높여주고 자유경쟁을 통해 공정한 가격을 형성하는 역할을 한다. 우리나라의 주식 유통시장에는 유가증권시장, 코스닥시장, 코넥스시장, K-OTC시장이 있다. 이 중 유가증권시장, 코스닥시장 및 코넥스시장은 한국거래소에서 개설･운영하는 장내시장이며, K-OTC시장은 장외시장이다. 유가증권시장은 동 시장의 시가총액이 우리나라대표 주가지수인 코스피의 산출 기준이 되므로 코스피시장이라고도 한다. 한편, 주식이 장내시장에서 매매되기 위해서는 상장이라는 등록절차를 거쳐야 한다. 유통시장에서 투자자의 매매주문은 투자중개업을 영위하는 금융투자회사를 거쳐 한국거래소에서 체결되며, 이에 따른 결제는 매매일로부터 3일째 되는 날 한국예탁결제원을 통해 이루어진다.","p":263},{"t":"주가지수","c":"금융","d":"여러 주식의 가격을 종합해 주식시장 전체의 흐름을 하나의 숫자로 나타낸 지수.","x":"코스피 지수가 올랐다는 것은 전반적으로 주가가 올랐다는 뜻이다.","o":"주가지수는 주식가격의 전반적인 수준을 나타내는 지표이다. 주식시장에서는 매일수많은 종목이 거래되는데, 이러한 각 개별종목의 가격변동을 종합하여 주식가격의 전반적인 움직임을 파악하기 위하여 작성되는 지수가 주가지수이다. 주가지수는 기준시점의 시장전체 주가수준과 비교시점의 시장전체 주가수준을 비교하여 산출되는데, 그방식에는 주가평균식과 시가총액 가중식이 있다. 주가평균식은 대상 종목의 주가를 단순 합산하여 종목수로 나누는 방식인데, 미국의 다우존스 산업평균과 일본의 닛케이 평균주가가 대표적이다. 시가총액 가중식은 개별주식의 주가에 상장주식수를 가중한 주가지수로, 일정 시점의 시가총액과 현재 시점의 시가총액을 비교하여 현재의 주가수준을 판단하는 방식이다. 우리나라의 코스피 및 코스닥, 미국의 NYSE종합지수와 S&P500, 일본의 TOPIX 등 세계 주요국의 주가지수는 대부분 시가총액 가중식에 의해 산출되고 있다. 이와 같은 주가지수는 주식 투자 판단의 주요 척도로서 투자자의 합리적인 의사결정 자료로는 물론 정책당국의 정책결정 참고자료로도 활용된다.","p":260},{"t":"기업공개","c":"금융","d":"기업이 주식을 일반 투자자들에게 처음 팔고 주식시장에 상장하는 것. IPO라고도 한다.","x":"새로운 회사가 코스닥에 상장하면서 처음으로 주식을 공개 판매했다.","o":"기업공개(IPO; Initial Public Offering)란 넓은 의미로는 기업의 전반적 경영내용을 공개하는 것을 의미하며 좁은 의미로는 주식을 다수의 투자자들에게 분산 매각하는 것을 말한다. 즉 주식회사가 신규 발행 주식을 다수의 투자자로부터 모집하거나 이미개인이나 소수 주주에게 발행되어 소유구조가 폐쇄적인 기업이 일반에 주식을 분산매출하고 증권거래소에 상장하여 거래되도록 하는 것을 말한다. 기업공개는 주주의 분산투자 촉진 및 소유분산, 자금조달능력의 향상, 주식가치의 공정한 결정, 세제상혜택 등의 장점을 가지고 있다. 공개절차를 간단히 살펴보면 기업공개를 추진하는 기업은 먼저 금융위원회에 등록하고 증권선물위원회가 지정하는 감사인에게 최근 사업연도 재무제표에 대한 회계감사를 받아야 한다. 그리고 대표주관회사를 선정하고 수권주식수, 1주의 액면가액 등과 관련한 정관개정 및 우리사주조합 결성 등의 절차를 진행한다. 이후 금융위원회에 증권신고서 제출, 청약･배정･주금납입, 자본금 변경 등기, 금융위원회에 증권 발행실적 보고서 제출 등의 절차를 거쳐 한국거래소에 상장신청을 마치면 공개절차가 마무리된다.","p":68},{"t":"채권시장","c":"금융","d":"정부나 기업이 돈을 빌리면서 발행한 채권(차용 증서)을 사고파는 시장.","x":"투자자는 채권을 사서 정해진 이자를 받는다.","o":"채권시장은 채권이 거래되는 시장이다. 채권은 정부, 공공기관, 민간기업 등이 비교적장기로 불특정 다수로부터 거액의 자금을 조달하기 위하여 정해진 이자와 원금의 지급을 약속하면서 발행하는 증권을 말한다. 채권시장은 발행시장(제1차 시장, primary market)과 유통시장(제2차 시장, secondary market)으로 나뉜다. 발행시장은 채권이 자금 수요자에 의해 최초로 발행되는 시장이며, 유통시장은 이미 발행된 채권이 투자자들 사이에서 매매되는 시장이다. 채권 투자자는 채권을 발행시장에서 인수하거나 유통시장에서 매입할 수 있다. 이자소득 외에 가격변동에 따른 자본이득(capital gain)을 기대할 수 있기 때문에 채권은 자산 포트폴리오를 구성하는 중요한 투자 수단이 된다. 발행시장의 채권은 정부가 발행하는 국채, 한국은행이 발행하는 통화안정증권, 지방자치단체가 발행하는 지방채, 상법상의 주식회사가 발행하는 회사채, 금융회사가 발행하는 금융채, 한국전력공사 등 법률에 의해 설립된 법인이 발행하는 특수채 등 다양하게 분류된다. 채권 유통시장은 장외시장과 장내시장으로 구분된다. 현재 대부분의 채권 거래는 장외시장에서 주로 증권회사의 단순거래를 통하여 이루어지고 있는데, 이는 채권의 종목이 다양하고 거래조건이 표준화되어 있지 않아 한국거래소의 자동매매시스템을 통해 거래하기가 곤란하기 때문이 다. 장내시장으로는 한국거래소 내에 일반채권시장과 국채전문유통시장이 개설되어 있다.","p":281},{"t":"회사채","c":"금융","d":"기업이 사업에 필요한 돈을 빌리기 위해 발행하는 채권. 만기에 원금과 이자를 갚는다.","x":"자동차 회사가 공장을 짓기 위해 3년 만기 회사채를 발행했다.","o":"회사채란 민간기업이 비교적 장기로 불특정 다수로부터 설비투자 자금 등 거액의 자금을 조달하기 위하여 정해진 이자와 원금의 지급을 약속하면서 발행하는 채권을 말한다. 공모발행(public offering)의 경우 인수기관인 증권사, 산업은행 등이 총액을 인수하여 발행하며 정보의 투명성 제고를 통한 투자자 보호를 위하여 증권신고서를 금융위원회에 제출하여야 한다. 사모발행(private placement)의 경우 발행기업이 최종매수자와 발행조건을 직접 협의하여 발행한다. 만기는 보통 1, 2, 3, 5, 10년 등으로 발행하는 데 신용위험 때문에 대체로 3년 이하가 주종을 이루고 있다. 발행금리는 동일만기 국고채금리에 일정한 가산금리(신용스프레드)를 붙여 발행한다. 경제가 호황이여서 기업의 신용위험이 줄어든 경우에는 가산금리도 줄어드는 반면 반대의 경우에는 가산금리가 확대된다. 한편 회사채에는 신용평가기관이 신용등급을 부여하여 투자자에게 원리금회수 가능성 정도의 정보를 제공하는데 이와 같은 신용평가제도는 회사채 발행금리(결과 적으로는 가산금리에 영향)에 결정적인 영향을 미친다. 회사채는 원리금 지급능력이 양호한 투자적격등급(AAA~BBB)과 지급능력이 의문시되는 투기등급(C~D)으로 구분되며 투자적격등급은 우량등급(AAA~A)과 비우량등급(BBB)으로 구분된다. 발행기업은 신용평가 수수료 부담에도 불구하고 신용등급이 좋을수록 발행금리를 낮춰 자금조달비용을 절감할 수 있기 때문에 좋은 신용등급을 받기 위해 재무구조 개선 등의 노력을 하게 된다.","p":334},{"t":"펀드","c":"금융","d":"여러 투자자의 돈을 모아 전문가가 주식, 채권 등에 대신 투자하고 그 결과를 나누어 주는 금융 상품.","x":"적은 돈으로도 펀드를 통해 여러 기업에 나누어 투자할 수 있다.","o":"펀드(fund)란 다수의 투자자들로부터 자금을 모아 전문적인 운용기관인 자산운용사가 주식, 채권, 부동산 등 자산에 투자하여 운용한 후 그 실적에 따라 투자자에게 되돌려주는 금융상품이다. ｢자본시장과 금융투자업에 관한 법률｣상의 명칭은 ‘집합투자기구’이다. 펀드의 장점은 전문가가 대신 운용하므로 시간과 노력을 절약할 수 있고 소액의 자금으로도 분산투자가 가능하므로 위험을 줄일 수 있다는 점이다. 한편 수수료 등으로 인해 직접투자에 비해 거래비용이 크고 다른 사람이 운용함에도 투자로 인해 발생하는 위험은 투자자가 부담해야 하는 점은 단점으로 꼽히고 있다. 펀드에 관련된 금융기관을 보면 펀드를 판매하는 판매회사(증권사, 은행, 보험사), 투자운용을 지시하는 자산운용회사, 투자운용 지시를 실행하고 자금 및 자산을 관리하는 신탁회사 등으로 구성된다. 펀드를 구분하는 방법은 매우 다양하나 가장 일반적인 것은 투자대상에 따른 분류이다. 투자대상에 따라 증권펀드, 단기금융펀드(MMF), 부동산펀드, 특별자산펀드, 혼합자산펀드로 구분된다. 증권펀드는 주식형, 채권형, 혼합형(주식혼합형/채권혼합형), 파생형, 재간접형 등으로 세분된다. 이들중 특별자산펀드는 증권이나 부동산이 아닌 여타 자산(상품, 원자재, 선박, 지적재산권등)에 투자하는 펀드를 말하며, 혼합자산펀드는 투자대상에 제한 없이 시장상황에 따라어떤 자산에라도 투자가 가능한 펀드를 말한다. 이 외에도 펀드는 근거 법률(국내법 또는 외국법)에 따라 역내펀드와 역외펀드로, 불특정 다수(50인 이상)의 투자자를 대상으로 하는지 여부에 따라 공모펀드와 사모펀드로, 투자자가 펀드에 투자한 후 환매를 청구할 수 있는지 여부에 따라 개방형펀드와 폐쇄형펀드로 각각 구분하고 있다.","p":314},{"t":"서킷브레이커","c":"금융","d":"주가가 갑자기 크게 떨어질 때 주식 거래를 잠시 멈추게 하는 제도. 투자자들이 냉정을 찾을 시간을 준다.","x":"코스피가 하루에 8% 이상 떨어지자 20분 동안 거래가 중단되었다.","o":"과열된 전기회로를 차단하는 안전장치에서 유래된 용어로 주식시장에서 주가의 급등 락 시 주식거래를 일시 정지시켜 시장에 미치는 충격을 완화하기 위해 도입된 제도이다. 서킷브레이커(circuit breakers)는 1987년 10월 미국 증권시장 사상 최악의 주가 대폭락사태를 기록한 ‘블랙 먼데이’ 이후 뉴욕증권거래소를 시발로 각국 증시에 시장 안전장치의 하나로 활용되고 있다. 우리나라에서는 1998년 12월 주식 가격제한폭이 상하 12%에 서 15%로 확대되면서 손실을 볼 위험이 커진 주식투자자를 보호하기 위해서 유가증권시장에 도입되었고, 2001년에는 코스닥시장으로 적용범위가 확대되었다. 우리나라 한국거래소에서는 주식시장의 대표지수인 종합주가지수 또는 코스닥지수의 하락폭 정도에 따라 3단계로 구분하여 서킷브레이크(시장 일시중단제)를 시행하고 있으며 전일 대비 8%, 15%, 20% 이상 하락하여 1분간 지속되는 경우 발동된다. 유가증권시장과 코스닥시장에서 주가지수가 전일 대비 8% 이상 하락한 경우 1단계 매매거래 중단이 발동되며, 1단계 발동 이후 주가지수가 전일대비 15% 이상 하락하고 1단계 발동지수 대비 1% 이상 추가 하락한 경우 2단계 매매거래 중단이 발동된다. 1단계와 2단계 서킷브레이커가 발동되면 각각 20분간 매매를 중단한 후 재개된다. 각 단계별로 발동은 1일 1회로 한정하고 당일 종가 결정시간 확보를 위해 장종료 40분 전 이후에는 중단하지 않는다. 한편, 2단계 매매거래 중단 발동이후 주가지수가 전일 대비 20% 이상 하락하고 2단계발동지수 대비 1% 이상 추가 하락한 경우 당일 발동시점을 기준으로 주식시장의 모든매매를 종료하게 된다. 3단계 매매거래 중단은 장종료 40분전 이후에도 발동이 가능하다.","p":151},{"t":"워크아웃","c":"금융","d":"빚을 갚기 어려운 기업을 바로 망하게 하지 않고 채권자(은행 등)와 협의해 빚을 조정하고 회생시키는 과정.","x":"은행들이 대출 만기를 늦춰 주는 대신 기업은 구조조정을 약속했다.","o":"기업과 금융기관의 협의로 진행되는 재무구조 개선과정 및 결과를 포괄적으로 이르는 말이다. 부실기업을 정상기업으로 회생시키는 것이 목적으로 도산을 방지하기 위해 계약 불이행이 발생하였을 때 채무자와 채권자 간에 해결 방안을 모색하게 된다. 워크아웃(workout)은 기업 독자적으로 이행하기 어려운 기업 내부의 구조조정작업을 채권금융기관이 주도하여 진행하며 그룹 내의 퇴출기업 선정, 자산매각, 주력사업 정비등 광범위한 조처를 한다. 채무기업의 구조조정 노력에 대해 채권금융기관은 은행대출금의 출자전환, 대출금 상환유예, 이자감면, 부채삭감 등의 금융지원을 제공한다. 우리나라는 1997년 외환위기 이후 자주 언급되었으며 대기업 구조조정 프로그램의 하나로 광범위하게 사용되었다. 한편 워크아웃과 대비되는 개념으로 기업회생절차가 있다. 기업, 금융기관 등 당사자간 협의를 중심으로 진행되는 워크아웃과 달리 기업회생절차는 법원의 결정(판결)을 통해 진행되는 보다 강력한 기업구조조정 절차이다.","p":209},{"t":"M&A","c":"금융","d":"기업의 합병(Merger)과 인수(Acquisition). 다른 기업을 사들이거나 두 기업이 하나로 합치는 것이다.","x":"큰 IT 기업이 성장 가능성이 높은 스타트업을 인수했다.","o":"기업경영의 효율성 제고와 시너지효과 창출 등을 위해 외부경영자원을 활용하는 것으로 우리나라에서는 ‘인수합병’으로 불리고 있다. M&A(Mergers & Acquisitions)의 방법으로는 일반적으로 주식인수, 기업합병, 기업분할, 영업양수도 등이 거론된다. 주식인수는 매수대상 회사의 주식을 인수하여 지배권을 획득하는 방법이다. 기업합병은 2개 이상의 회사가 계약에 의해 청산절차를 거치지 않고 하나의 경제적, 법적 실체로 합쳐지는 것을 의미한다. 기업분할은 특정 사업부문의 자산과 부채를 포괄적으로 이전하여 별도의 회사를 설립하는 것을 말한다. 영업양수도는 특정 사업부문의 자산과 부채, 조직 및 인원, 권리와 의무 등이 포괄적으로 이전되는 것으로 사업부문의 동일성을 유지하면서 경영주체만을 교체하는 것을 의미한다.","p":348},{"t":"리디노미네이션","c":"금융","d":"화폐 단위를 낮추는 것. 화폐의 가치는 그대로 두고 표시하는 숫자만 줄인다.","x":"1,000원을 1원으로 바꾸면 커피 4,000원이 4원이 된다.","o":"리디노미네이션(redenomination) 또는 ‘화폐단위 변경’이란 구매력이 다른 새로운화폐단위를 만들어 현재의 화폐단위로 표시된 가격, 증권의 액면가, 예금･채권･채무등 일체의 금액을 법정비율(교환비율)에 따라 일률적으로 조정하여 새로운 화폐단위로 표기 및 호칭하는 것을 의미한다. 보통 리디노미네이션은 지속적인 인플레이션으로 인해 재화와 서비스의 교환가치를 화폐로 나타내는 숫자가 많아서 초래되는 계산 및 회계기장 등의 불편을 해소할 목적으로 시행된다. 또한 자국 통화의 대외적 위상을 높일 목적으로 시행되기도 한다. 우리나라에서는 1953년의 제1차 통화조치에 따라 100 원(圓)이 1환(圜)으로, 1962년의 제2차 통화조치에 따라 10환(圜)이 1원으로 변경된 사례가 있다.","p":103},{"t":"국제수지(BOP)","c":"국제","d":"일정 기간 동안 한 나라가 다른 나라와 거래한 모든 경제적 거래를 정리한 것.","x":"수출입, 해외여행, 해외 투자 등이 모두 국제수지에 기록된다.","o":"일정기간 동안 한 나라의 거주자와 비거주자 간에 발생한 경제적 거래에 따른 수입과 지급의 차이를 의미한다. 국제수지(BOP; Balance Of Payments)는 크게 경상수지, 자본수지, 금융계정, 오차 및 누락 등 4개의 계정으로 구성되어 있다. 경상수지는 ① 상품 수출입의 결과인 상품수지, ② 운송, 여행, 건설 등 서비스거래의 결과인 서비스수지, ③ 급료 및 임금수지, 투자소득수지 등 본원소득수지, ④ 무상원조, 증여성 송금 등의 결과인 이전소득수지로 구분된다. 자본수지는 자산 소유권의 무상이전 등 자본이전과 브랜드네임 등 비생산･비금융자산의 취득 및 처분의 결과로 계상된다. 금융계정은 직접투자, 증권투자, 파생금융상품, 기타투자 및 준비자산으로 구분된다. 오차 및 누락은 경상수지 및 자본수지 의 합계와 금융계정 금액이 같지 않을 경우 이를 조정하기 위한 항목으로 국제수지 작성에 이용되는 기초통계간 계상시점, 평가방법상의 차이 등에 기인한다.","p":45},{"t":"경상수지","c":"국제","d":"외국과 상품, 서비스를 사고팔거나 소득을 주고받아 생긴 수입과 지출의 차이. 상품수지, 서비스수지, 본원소득수지, 이전소득수지로 이루어진다.","x":"수출이 수입보다 많으면 경상수지가 흑자가 되기 쉽다.","o":"경상수지는 재화나 서비스를 외국과 사고파는 거래 즉 경상거래의 결과로 나타나는 수지를 말한다. 경상수지는 상품수지, 서비스수지, 본원소득수지 및 이전소득수지로 구성된다. 그런데 이 항목들은 금융계정 구성항목과 비교하면 상대적으로 안정적인 성격을 지닌 거래들로 이루어져 있기 때문에 경제발전 및 정책변화의 효과를 측정하거나전망하는 데 널리 이용된다.","p":14},{"t":"상품수지","c":"국제","d":"상품의 수출액과 수입액의 차이.","x":"반도체와 자동차를 많이 수출해 상품수지가 흑자를 기록했다.","o":"거주자와 비거주자 간의 상품 수출입 거래를 계상한 것으로, 경상수지의 한 부분이다. 수출이 수입보다 많으면 흑자, 수출보다 수입이 많으면 적자로 표시한다. 상품수지의 수출입은 관세청에서 통관기준으로 작성하는 무역수지의 수출입과 일치하지 않는 경우가 많다. 이는 관세청에서는 상품이 우리나라의 관세선을 통과하면 수출입으로 계상하는 반면, 국제수지의 상품수지에서는 상품의 소유권이 이전되어야 수출입으로 간주하는 소유권이전(change of ownership) 기준을 따르기 때문이다. 또한 무역수지에서 수출은 FOB가격, 수입은 운임 및 보험이 포함되어 있는 CIF가격으로 평가하지만, 상품수지에서 는 수출과 수입 모두 FOB가격으로 평가한다는 차이점도 있다.","p":148},{"t":"서비스수지","c":"국제","d":"운송, 여행, 통신, 지식재산권 사용료 등 외국과 서비스를 거래해 생긴 수입과 지출의 차이.","x":"우리 국민의 해외여행이 늘면 여행수지가 적자가 되어 서비스수지가 나빠진다.","o":"국제수지표에서 서비스수지란 외국과의 서비스거래 결과 벌어들인 돈과 지급한 돈의 차이를 말한다. 서비스거래는 가공, 운송, 여행, 건설, 보험, 금융, 통신, 지식재산권, 유지보수, 정부서비스, 기타사업서비스 등의 항목으로 이루어진다. 서비스수지는 거래항목별로 수입과 지급으로 나누어 계상한다. 예를 들어 우리나라의 선박이나 항공기가 상품을 나르고 외국으로부터 받은 운임, 외국관광객이 쓰고 간 외화, 무역대리점의 수출입 알선수수료 수입 등이 서비스 수입으로 기록된다. 반대로 우리나라가 외국에 지급한 선박과 항공기의 운항경비, 해외여행 경비, 기술용역 대가 등은 모두 서비스 지급으로 나타난다. 서비스수지는 상품수지, 본원소득수지, 이전소득수지와 함께 경상수지를 구성한다.","p":150},{"t":"외환시장","c":"국제","d":"서로 다른 나라의 돈(외환)을 사고파는 시장. 여기서 환율이 결정된다.","x":"수출 기업은 받은 달러를 외환시장에서 원화로 바꾼다.","o":"외환시장은 좁은 의미에서 외환의 수요와 공급이 연결되는 장소를 말하나 넓은 의미에 서는 이러한 장소적 개념뿐만 아니라 외환거래의 형성, 결제 등 외환거래가 정기적또는 지속적으로 이루어지는 일련의 메커니즘을 포괄한다. 외환시장은 기본적으로 서로 다른 통화로 표시된 지급수단의 매매가 이루어지는 시장(market for means of payments) 으로서 외화 자금의 대차가 이루어지는 외화자금시장과는 그 성격을 달리한다. 외환시장에서의 서로 다른 통화간의 매매는 기본적으로 상품과 용역 그리고 금융자산의 매매거래에 수반하여 일어나기 때문에 이들 외환거래는 기본적으로 지급 메커니즘의 한 과정으로 이해할 수 있다. 따라서 각국의 금융시장이나 유로금융시장에서 이루어지는 서로 다른통화로 표시된 금융거래는 외환시장의 거래와 연계되어 이루어진다. 오늘날 국제외환시장은 세계 주요 외환시장의 거래를 24시간 연계시키면서 모든 시장정보를 환율에 신속하게 그리고 지속적으로 반영하는 하나의 범세계적 시장으로서의 기능을 수행하면서 국제금융거래의 효율화를 촉진하고 있다.","p":205},{"t":"외환보유액","c":"국제","d":"한 나라가 긴급 상황에 대비해 가지고 있는 외화 자산. 국가의 비상금 같은 역할을 한다.","x":"1997년 외환위기는 외환보유액이 바닥나면서 일어났다.","o":"외환보유액(Official Reserve Assets)은 중앙은행이나 정부가 국제수지 불균형을 보전하거나 외환시장 안정을 위해 언제든지 사용할 수 있도록 보유하고 있는 교환성이 있고 유동성이나 시장성이 높은 대외지급준비 자산을 말한다. 그러므로 외환보유액은 긴급한 상황에서 쓰기 위해 갖고 있는 비상금과 같은 성격의 준비자산으로 외환보유액은 환율급등 시 외환시장 안정을 위한 재원으로 이용될 뿐 만 아니라 금융기관의 해외차입이 어려워지는 신용위기 상황에서 중앙은행 등이 최종대부자(last resort)의 역할을 하기 위한 재원이 된다. 이러한 목적에 부합하도록 현재 우리나라의 외환보유액은 선진국 국채등 외화증권이나 예치금과 같은 유동성과 안정성이 높은 자산으로 운용되고 있다. 외환보유액은 경제 위기 시 안전판 역할을 하여 국가 신용도를 높이고 중앙은행은 외화자산운용에 따른 수익이 발생하는 등의 편익이 있지만 통화안정증권 등에 대한 이자지급 등 비용 또한 발생한다. 이에 따라 외환보유액의 적정 규모에 대한 논의가 지속되어 왔다.","p":204},{"t":"고정환율제도/자유변동환율제도","c":"국제","d":"고정환율제도는 정부가 환율을 일정하게 고정하는 제도, 자유변동환율제도는 외환시장의 수요와 공급에 따라 환율이 자유롭게 정해지는 제도이다.","x":"우리나라는 1997년 이후 자유변동환율제도를 운영하고 있다.","o":"환율제도는 고정환율제도(fixed exchange rate system)와 자유변동환율제도(free floating exchange rate system)를 양 극단으로 하여 이를 절충하는 다양한 형태로 분류될 수 있다. 고정환율제도는 외환의 시세 변동을 반영하지 않고 환율을 일정 수준으로 유지하는 환율제도이다. 반면 자유변동환율제도는 환율이 외환시장에서 외환의 수요와 공급에 의해 자율적으로 결정되도록 하는 환율제도를 말한다. 고정환율제도를 시행하게 되면 환율 변동에 따른 충격을 완화하고 거시경제정책의 자율성을 어느 정도 확보할 수 있다는 장점이 있다. 하지만 특정 수준의 환율을 지속적으로 유지하기 위해서는 정부나 중앙은행이 재정정책과 통화정책을 실시하는 데 있어 국제수지 균형을 먼저고려해야하는 제약이 따르고 불가피하게 자본이동을 제한해야 한다. 또한, 경제의 기초여건(fundamentals)이 악화되거나 대외 불균형이 지속되면 환투기공격에 쉽게 노출되는 단점이 있다. 반면 자유변동환율제도하에서는 자본이동이 자유롭게 이루어지므로 국제유동성 확보가 용이하고 외부충격이 환율변동에 의해 흡수됨으로써 거시경제정책의 자율적 수행이 용이한 장점이 있다. 다만 외환시장 규모가 작고 외부충격의 흡수 능력이 미약한 개발도상국은 환율변동성이 높아짐으로써 경제의 교란요인으로 작용할 가능성이 크다. 한편 어떤 환율제도라도 ① 통화정책의 자율성 ② 자유로운 자본이동 ③ 환율안정 등 세 가지 정책목표를 동시에 만족시키기는 현실적으로 어려우며 이를 삼불원칙 (impossible trinity, trilemma)이라고 한다.","p":25},{"t":"평가절상","c":"국제","d":"다른 나라 돈에 비해 자국 돈의 가치가 오르는 것. 환율이 떨어진다.","x":"1달러에 1,300원이던 환율이 1,200원이 되면 원화가 평가절상된 것이다. 해외여행은 유리해진다.","o":"환율은 일반적으로 거래 대상물인 외국환(외국통화) 한 단위와 교환되는 자국통화의 양으로 정의되고 있는데 원화절상은 외환시장에서 외환의 공급이 수요를 초과하여 외환의 가치가 하락하고 원화의 가치는 상승하는 현상을 의미하며, 이때 환율이 하락하게 되는데이를 평가절상이라고도 말한다. 그러나 평가절상(revaluation)이나 평가절하(devaluation), 또는 절상(appreciation)이나 절하(depreciation)의 의미는 일반적으로는 고정환율제도와 자유변동환율제도중 어느 환율제도를 채택하느냐에 따라 구분된다. 즉 평가절상(또는 평가 절하)은 고정환율제도하에서 정부가 정책적 목적 등으로 자국통화의 대외가치인 환율을 인위적으로 일시에 조정하였을 경우 사용되며, 절상(또는 절하)은 일반적으로 자유변동환율제도하에서 환율이 외환시장의 수급기능에 의해 하락하였을 경우에 사용된다.","p":315},{"t":"평가절하","c":"국제","d":"다른 나라 돈에 비해 자국 돈의 가치가 떨어지는 것. 환율이 오른다.","x":"원화가 평가절하되면 수출품 가격이 싸져 수출에는 유리하지만 수입품 가격은 비싸진다.","o":"환율은 일반적으로 거래 대상물인 외국환(외국통화) 한 단위와 교환되는 자국통화의 양으로 정의되고 있는데, 원화절하는 외환시장에서 외환의 수요가 공급을 초과하여 외환의 가치가 상승하고 원화의 가치는 하락하는 현상을 의미하며, 이때 환율이 상승하게 되는데 이를 환율상승 또는 평가절하라고도 말한다. 그러나 평가절상(revaluation)이나평가절하(devaluation), 또는 절상(appreciation)이나 절하(depreciation)의 의미는 일반적으로는 고정환율제도와 자유변동환율제도중 어느 환율제도를 채택하느냐에 따라 구분된다. 즉 평가절상(또는 평가절하)은 고정환율제도하에서 정부가 정책적 목적 등으로 자국통화의 대외가치인 환율을 인위적으로 일시에 조정하였을 경우 사용되며, 절상(또는 절하)은 일반적으로 자유변동환율제도하에서 환율이 외환시장의 수급기능에 의해 상승하였을 경우에 사용된다.","p":316},{"t":"환차손/환차익","c":"국제","d":"환율이 변해서 생기는 손해(환차손)와 이익(환차익).","x":"달러를 1,200원에 샀다가 1,300원일 때 팔면 100원의 환차익이 생긴다.","o":"환위험은 크게 회계적 환위험(또는 환산환위험)과 거래적 환위험으로 나누는데, 이중에서도 회계적 환위험이란 해외지사 및 자회사의 재무제표를 모기업의 재무제표와 연결시키기 위해 자산과 부채의 가치를 동일한 통화로 환산하는 과정에서 발생하는 환위험을 말한다. 환차손/환차익은 회계적 환위험과 관련되는 것으로, 한 경제주체가 외화 자산또는 부채를 보유하고 있을 때 환율변동에 따라 자국 통화로 평가한 자산(부채)의 가치가 변동하게 되는 바, 환율 변동에 따라 이익이 발생하면 환차익이라고 하고 반대로 손실이 발생하면 환차손이라고 한다. 예를 들어 외화자산이 외화부채보다 많은 경우(외환매입초과포지션, over-bought positions 또는 long positions) 환율이 상승(하락)하면 환차익 (손)이 발생하고 반대로 외화부채가 외화자산보다 많은 경우(외환매도초과포지션, over-sold positions 또는 short positions) 환율이 상승(하락)하면 환차손(익)이 발생한 다. 환차손이 발생할 위험을 관리하는 방법으로는 리드앤드래그, 매칭, 자산부채관리등 기업내부적으로 환위험을 최소화하는 내부적 관리기법과 은행과의 외환파생상품을 이용한 대응거래 등을 통해 환위험을 커버하는 외부적 관리기법이 있다.","p":333},{"t":"기축통화","c":"국제","d":"국제 거래에서 결제하거나 다른 나라가 외환으로 보유할 때 기준이 되는 통화.","x":"미국 달러가 대표적인 기축통화이다.","o":"기축통화란 여러 국가의 암묵적인 동의하에 국제거래에서 중심적인 역할을 하는 통화를 지칭한다. 구체적으로는 ① 국제무역결제에 사용되는 통화 ② 환율 평가 시의 지표가 되는 통화 ③ 대외준비자산으로 보유되는 통화 등의 의미를 포함한다. 그러므로 어떤 나라의 통화가 기축통화가 되기 위해서는 세계적으로 원활히 유통될 수 있도록유동성이 풍부하여야 하고 거래당사자들이 믿고 사용할 수 있도록 신뢰성을 갖추어야하며, 국제적으로 경제력은 물론 정치력･군사력까지 인정받는 국가의 통화여야 한다. 20세기 초반까지는 세계 금융경제의 중심이었던 영국의 파운드화가 기축통화로서 국제거래에 주로 이용되었으며, 2차 세계대전 이후에는 전 세계 외환거래 및 외환보유액의 상당 부분을 차지하는 미국 달러화가 기축통화로 인정받고 있다. 한편, 현재 국제거래에 서 비교적 자주 사용되는 통화로는 미국 달러화이외에도 유로화, 영국 파운드화, 일본엔화, 스위스 프랑화 등이 있는데 이들은 흔히 교환성통화라 한다.","p":72},{"t":"구매력평가환율","c":"국제","d":"같은 물건은 어느 나라에서나 같은 값이어야 한다는 생각을 바탕으로, 두 나라의 물가 수준을 비교해 계산한 환율.","x":"미국에서 1달러, 한국에서 1,000원인 물건이 있다면 구매력평가환율은 1달러=1,000원이다.","o":"구매력평가(PPP; Purchasing Power Parity) 환율은 해당 통화의 실질 구매력을 기준으로 평가한 환율이라고 할 수 있는데, 이는 관련 당사국간 물가수준(또는 물가상승률) 차이 즉, 당사국 화폐간 실질구매력(가치)의 차이에 의해 균형 환율이 결정된다는 구매력평가이론에 근거하고 있다. 예를 들어 맥도널드 빅맥 햄버거의 가격이 우리나라에서 5,000원이고 미국에서 5달러라면 원/달러환율은 1,000원이어야 한다는 것이다. 대표적구매력평가환율로는 각국의 맥도날드 햄버거 가격을 비교해 환율을 결정하는 ‘빅맥지수’ 를 들 수 있다. PPP 환율은 국가 간 화폐의 교환비율이라기보다는 자국화폐의 실질구매력을 나타내게 되는데, 국가 간 물가수준 차이를 고려하여 GDP 등의 통계를 국가 간에 비교하는 데 흔히 사용된다. OECD에서는 3년마다 회원국을 대상으로 GDP와 그 구성요 소들의 가격과 생산물량을 기초로 국가별 구매력평가환율을 작성하고 있으며 UN과 세계은행에서도 별도로 작성하고 있다.","p":31},{"t":"빅맥지수","c":"국제","d":"맥도날드 빅맥 햄버거의 나라별 가격을 비교해 각 나라 화폐의 가치가 적정한지 알아보는 지수.","x":"빅맥이 미국보다 한국에서 훨씬 싸면 원화가 저평가되어 있다고 본다.","o":"빅맥(Big Mac)지수는 각국 통화의 구매력 정도 또는 환율 수준을 측정하기 위해 일물일가의 법칙을 햄버거 가격에 적용한 것으로 영국에서 발행되는 주간 경제전문지 이코노미스트지(The Economist)에서 1986년 이래 매년 전 세계적으로 판매되고 있는 맥도날드의 빅맥가격을 비교･분석해서 발표하고 있다. 맥도날도의 빅맥은 전 세계 120개국에서 동일한 재화로 판매되고 있으므로, 이 빅맥지수를 이용하여 일물일가의 법칙또는 절대적 구매력평가를 간단하게 검증할 수 있는 기회를 독자들에게 제공한다는 취지이다. 만약 일물일가의 법칙이 완전하게 성립한다면 세계 모든 나라에서 빅맥의 미달러화 가격이 동일하여야 하므로 실제 환율과는 다른 구매력평가환율을 산정해 볼수 있다. 예를 들어 어느 기준시점의 우리나라 빅맥 햄버거가격이 4,300원이고 미국에서 의 가격은 4.79달러라 하면, 구매력평가이론의 일물일가의 법칙이 성립한다면 원/달러환율은 897.7원(=4,300원/4.79달러)이 되어야 한다. 그런데 그 시점의 실제 환율이 1,143.5 원이라면 빅맥지수로 볼 때 원화는 약 22% 저평가되어 있다고 볼 수 있다.","p":140},{"t":"일물일가의 법칙","c":"국제","d":"같은 상품은 어느 시장에서나 같은 가격이어야 한다는 법칙. 가격 차이가 나면 싸게 사서 비싸게 파는 거래로 가격이 같아진다.","x":"두 시장의 사과값이 다르면 상인들이 싼 곳에서 사 비싼 곳에 팔아 가격 차이가 줄어든다.","o":"완전경쟁이 이루어질 때 동일한 시기, 동일한 시장에서는 품질이 동일한 상품의 가격이 2개 이상 형성될 수 없다는 법칙이다. 즉 동일한 상품은 어느 시장에서든지 가격이 같아지게 된다는 것인데 제본스(Jebons, W. S.)와 엣지워스(Edgeworth, F. Y.)는 무차별의 법칙이라고 하였다. 만일 동일한 시기, 동일한 시장에서 동일한 품질의 상품에 대해 2개 이상의 가격이 형성된다면 모든 사람들이 가장 싼 가격으로 사려고 하기 때문에 그보다 비싼 가격을 제시한 판매자는 가격을 인하하지 않을 수 없다. 따라서 가격 차이가 없어지게 되며 하나의 상품에는 하나의 가격만 정해지게 된다. 무역에서도 일물일가의 법칙이 적용될 수 있는데 어떤 상품의 가격이 국별로 다를 때 가격이 상대적으로 싼나라에서 구입하여 가격이 상대적으로 비싼 나라에 파는 이익추구의 과정이 계속된다면 결국은 모든 나라에서 그 상품의 가격은 일치하게 될 것이다. 그러나 현실 세계에서는 일물일가의 법칙이 성립하기 어려운데 이는 운송비, 보험료 등의 거래비용뿐만 아니라관세의 영향도 받기 때문이다.","p":225},{"t":"비교우위","c":"국제","d":"다른 나라보다 더 적은 기회비용으로 생산할 수 있는 재화에 대해 갖는 우위. 각 나라가 비교우위 상품에 특화해 교역하면 모두 이익이다.","x":"한국은 반도체, 브라질은 커피에 비교우위가 있어 서로 교환하면 이득이다.","o":"국가 간 무역이 발생하게 되는 원리를 설명한 이론으로 자국 상품의 생산비용이 외국 상품과 비교해 우위를 가질 경우 이러한 상품, 즉 비교우위를 가진 상품의 생산에 특화하여 다른 국가와 무역을 하는 것이 유리하다는 것이다. 이는 고전경제학파 경제학자인 리카르도(D. Ricardo)에 의해 자유무역이 교역 대상국 모두에게 유리하다는 국제분업 및 무역에 관한 이론적 기반을 제공하였다. 그러나 노동가치설에 근거하여 노동투입에 따른 요소비용만을 고려하였고 두 나라 간에 두 가지 재화 생산만이 가능하다는 제한적인 가정에 근거하고 있다. 오늘날에는 상품의 종류가 세분되고 또한 같은 품질과 특성을 지닌 상품이 다수 생산되고 있어 생산비용의 상대적 차이만으로 무역의 발생원인을 설명하는 데는 한계가 있는 것으로 보인다.","p":138},{"t":"보호무역주의","c":"국제","d":"자기 나라 산업을 보호하기 위해 관세를 매기거나 수입을 제한하는 등 무역에 간섭하는 정책.","x":"외국산 철강에 높은 관세를 매겨 자국 철강 산업을 보호한다.","o":"보호무역주의는 국가간 무역을 제한하는 경제정책이다. 주된 수단으로는 수입금지나수입할당과 같은 직접적인 방법과 수입상품에 부과하는 관세율 인상과 같은 간접적인 방법 이외에도 덤핑 규제, 보조금 지급, 지적재산권 보호 강화, 환율조작 등 기타 다양한 정부의 규제 등이 있다. 보호무역주의의 목적은 수입으로 경쟁이 유발되는 산업의 생산, 유통, 고용 등에 손해가 발생하지 않도록 하는 것이다. 한편 보호무역주의는 동 정책을 실행하는 국가와 상대국의 소비자와 수출부문의 생산, 고용 등에는 부정적 영향을 미친다. 보호무역주의의 순효과는 경제의 성장이나 발전에 부정적이라는 견해가 지배적이어서 선진국의 주도하에 세계적으로 자유무역과 무역장벽을 낮추는 추세를 보여 왔다. 그러나 일부에서 무역수지 흑자국과 적자국이 뚜렷이 구분･지속되고 수지폭도 점점커지면서 단기적으로 적자국 수입경쟁 부문의 고용이 심각한 불균형을 보이는 등 부작용도 확대되었다. 이러한 부작용은 특히 2008년 발생한 글로벌 금융위기의 한 원인으로 지적되면서 미국 등 일부 국가는 자유무역을 더 이상 확대하는 정책을 제한하고 있으나 G20의 대부분 국가는 보호무역주의의 확산을 경계하고 있다.","p":125},{"t":"자유무역협정(FTA)","c":"국제","d":"두 나라 이상이 서로 관세 등 무역 장벽을 없애거나 낮추기로 맺은 협정.","x":"한·칠레 FTA 이후 칠레산 포도를 더 싸게 살 수 있게 되었다.","o":"협정을 체결한 국가 간에 상품이나 서비스 교역에 대한 관세 및 무역장벽을 철폐함으로써 무역특혜를 서로 부여하는 협정을 말한다. 자유무역협정(FTA; Free Trade Agreement)은 그동안 유럽연합(EU)이나 북미자유무역협정(NAFTA) 등과 같이 인접국가나 일정한 지역을 중심으로 이루어졌기 때문에 흔히 지역무역협정(RTA; Regional Trade Agreement)이라고도 불린다. 자유무역협정은 체결국간 경제통합의 심화정도에 따라 회원국간 관세를 포함하여 각종 무역제한조치를 철폐하는 자유무역협정, 회원국간역내무역 자유화 외에도 역외국에 대해 관세에 대한 공동보조를 취하는 관세동맹, 회원국간 노동, 자본 등 생산요소의 자유로운 이동이 가능한 공동시장, 회원국들이 독립된 경제정책을 철회하고 단일경제체제하에서 모든 경제정책을 통합 운영하는 완전경제통합 등의 4단계로 구분된다. 자유무역협정은 국가 간 합의된 내용에 대해 무역장벽을 완화하되 제삼국에 대해서 최혜국대우 부여를 원칙으로 하는 세계무역기구(WTO)의 다자간무역협정과는 차이가 있다. 한편 자유무역협정은 전통적으로 상품분야의 무역자유화 또는 관세인하에 중점을 두는 경우가 많았으나 최근에는 그 적용 범위가 서비스, 투자, 지적 재산권, 정부조달, 정책 등으로까지 확대되고 있다. 2017.10월말 현재 우리나라는 52개국과 15건의 자유무역협정을 체결하였다.","p":236},{"t":"세계무역기구(WTO)","c":"국제","d":"국가 간 무역 규칙을 정하고 무역 분쟁을 해결하는 국제기구. 1995년에 출범했다.","x":"무역 분쟁이 생기면 WTO에 제소해 판정을 받는다.","o":"국제무역 확대, 회원국간의 통상분쟁 해결, 세계교역 및 새로운 통상 논점에 관한 연구를 위하여 설립된 국제기구로서 본부는 스위스 제네바에 있다. 기존 GATT 체제의 문제점 해결을 위한 우루과이라운드 협상을 거쳐 1995년 1월 1일 출범하였다. 설립이전 회원국들의 GATT 의무 이행이 미흡했던 점을 감안하여 WTO(World Trade Organization)는 GATT에 없던 세계무역분쟁 조정, 관세인하 요구, 반덤핑규제 등 준사법적 권한과 구속력을 행사할 수 있는 기능을 갖추고 있다. 또한 협정 형태이던 GATT와 달리 WTO는 여러 하위 기구를 갖춘 국제기구로서 GATT 체제에서 제외되었던 서비스, 지적재산권을 포괄하는 등 국제 무역규범의 적용범위를 크게 확대하였다. WTO는 각료회의, 일반이사회, 사무국 등의 조직으로 구성되어 있다. 모든 회원국의 대표로 구성되는 각료회의는 2년마다 최소 1회 이상 개최되고, 일반이사회는 각료회의 비회기 중 각료회의의 기능을 수행함과 아울러 분쟁해결기구, 무역정책검토기구로서의 기능도 수행한다. 우리나라는 1995년 출범 당시 가입하였고 2017년 10월말 현재 WTO 회원국은 164개국이다.","p":155},{"t":"국제통화기금(IMF)","c":"국제","d":"국제 금융 질서를 안정시키기 위해 만들어진 국제기구. 외환위기를 겪는 나라에 돈을 빌려주기도 한다.","x":"1997년 우리나라는 외환위기로 IMF에서 구제금융을 받았다.","o":"국제통화 및 금융제도의 안정을 도모하기 위한 국제금융기구로서 미국 워싱턴에 본부를 두고 1945년 12월 설립되었다. 설립목적은 국제통화문제에 관한 협력, 국제무역의 확대와 세계경제의 균형적 성장, 외환의 안정 촉진, 다자간 결제제도 확립, 회원국의 국제수지 불균형 완화 등으로 되어 있다. 이에 따라 회원국의 환율정책 및 외환제도 관련 감시활동, 회원국에 대한 금융지원 및 기술지원, 특별인출권(SDR)의 창출과 운영관리, 저소득국 지원 등의 활동을 하고 있다. 회원국 가입에 특별한 제한을 두고 있지 않으며 안정적인 환율제도 운영, 경상지급에 대한 제한 철폐 등을 통해 국제통화문제에 협력할 의사가 있는 모든 나라에 대해 가입을 허용하고 있다. 가입 희망국은 총회에서의 가입결의안 채택후 할당된 쿼타(quota)를 납입함으로써 정식 회원국이 된다. IMF(International Monetary Fund)의 재원은 회원국의 쿼타 납입금으로 조달되며 필요한 경우 회원국 또는 민간으로부터 차입하고 있다. 조직은 총회와 이사회, 총회의 자문기구인 국제통화금융위원회, 총재를 비롯한 집행부서 등으로 구성되어 있다. 2016년말 현재 IMF 회원국은 189개국이며 우리나라는 1955년 8월에 가입하였다.","p":47},{"t":"유럽연합(EU)","c":"국제","d":"유럽 여러 나라가 정치·경제적으로 통합해 만든 공동체. 많은 회원국이 유로화를 함께 쓴다.","x":"EU 회원국 사이에는 사람과 상품이 자유롭게 오간다.","o":"유럽연합(EU; European Union)은 1991년 12월 유럽공동체 12개국 정상이 유럽연합조약(일명 마스트리히트조약)의 체결에 합의한 후 1993년 11월 동 조약이 발효됨에 따라 종전의 유럽공동체(EC; European Communities)를 대신하는 지역공동체로서 1994 년 1월 정식 출범하였다. 창설 목적은 유럽내 단일시장 구축 및 단일통화 실현을 통한 유럽의 경제와 사회발전 촉진, 공동외교안보정책을 통한 국제무대에서의 유럽의 이익제고, 유럽연합 시민권제도 도입에 의한 회원국 국민의 권리와 이익 보호 등이다. 회원국은 1995년 1월 3개국이 추가 가입한 데 이어 동유럽 체제전환국들이 가입하면서 점차늘어나 2017년 10월 현재 총 28개국이다. 유럽연합의 주요 기구는 회원국 정상들의 회의체인 유럽이사회(European Council), 각종 정책 입안 및 집행을 담당하는 집행위원회(European Commission), 회원국간 문제해결을 위한 장관들의 회의체인 각료이사회 (CEU), 유럽의회(EP) 등이며 그 외에 유럽사법재판소, 유럽회계감사원, 지역위원회, 유럽중앙은행(ECB), 유럽투자은행 등이 있다. 유럽연합은 유럽의회가 입법부, 유럽사법재판소가 사법부, 집행위원회가 행정부의 역할을 하는 등 일반적인 국제기구와는 달리독자적인 법령 체계와 입법･사법･행정 기능을 갖추고 있다.","p":215},{"t":"브렉시트(Brexit)","c":"국제","d":"영국(Britain)이 유럽연합(EU)에서 탈퇴(exit)한 것. 2016년 국민투표로 결정되어 2020년에 탈퇴했다.","x":"브렉시트 이후 영국과 EU 사이의 무역에 새 절차가 생겼다.","o":"영국(Britain)과 탈퇴(Exit)의 합성어로 영국의 유럽연합(EU) 탈퇴를 뜻한다. 영국은 2016년 6월 23일 유럽연합(EU) 탈퇴 여부에 대한 국민투표 실시를 통해 51.9%의 찬성으로 EU 탈퇴를 결정하였다. 영국 국민들이 EU 탈퇴를 찬성하게 된 배경에는 2008년글로벌 금융위기 이후 남유럽국가 구제금융 지원, EU의 난민 포용정책 등으로 영국의 재정부담이 가중되는 가운데 회원국 노동자의 영국 이주에 따라 영국 고용시장이 악화되는 데 대한 불만이 크게 작용하였다. 영국의 EU 탈퇴는 EU의 헌법이라 할 수 있는 EU조약에 의거 2017년 3월 영국 정부가 EU 정상회의(European Council)에 탈퇴 의사를 공식 통보함으로써 개시되었다.","p":135},{"t":"브릭스","c":"국제","d":"빠르게 성장하는 신흥 경제 대국인 브라질, 러시아, 인도, 중국, 남아프리카공화국을 묶어 부르는 말(BRICS).","x":"인구와 자원이 풍부한 브릭스 국가들은 세계 경제에서 영향력이 커지고 있다.","o":"2000년대를 전후하여 빠른 경제성장세를 보인 브라질, 러시아, 인도, 중국, 남아프리카공화국 등 5개국을 지칭하는 용어이다. 2001년 미국의 투자회사인 골드만삭스의 보고서 에서 처음 사용된 용어(BRICs)로서 세계의 생산과 인구에서 큰 비중을 차지하는 브라질 (Brazil), 러시아(Russia), 인도(India), 중국(China)을 지칭하기 위해 4개국 영문국명의 첫 글자를 합성하여 만든 것이다. 이들 4개국은 2006년부터 비공식적인 외무장관회의를 시작한 데 이어 2009년 첫 번째 정상회의를 개최한 이후 지속적으로 모임을 갖고 있다. 2011년 남아프리카공화국이 포함되면서 이들을 가리키는 용어가 기존의 BRICs 에서 BRICS로 바뀌었으며 이에 따라 브릭스의 지정학적 대표성이 부각되는 한편 이들 5개국간 대화의 깊이와 폭도 더욱 넓어지고 있다. 브릭스는 현재의 경제성장 속도와 앞으로의 발전 전망에 비추어 신흥 경제대국으로 발돋움할 가능성이 높은 나라들을 하나의 경제권으로 묶은 개념으로 볼 수 있는데, 실제로도 브릭스 국가들은 공통적으로 거대한 영토와 노동력, 풍부한 지하자원 등 경제대국으로 성장할 수 있는 잠재력을 갖춘 것으로 평가되고 있다.","p":135},{"t":"금본위제","c":"국제","d":"화폐의 가치를 일정량의 금에 묶어 두고, 화폐를 금으로 바꿔 주기로 약속하는 화폐 제도.","x":"과거에는 지폐를 은행에 가져가면 정해진 양의 금으로 바꿔 주었다.","o":"금본위제란 각국의 통화가치를 순금의 일정한 중량으로 정해 놓고 금화의 자유로운주조와 수출입을 허용하며 이를 지폐나 예금통화 등과 교환할 수 있도록 하는 제도이다. 금본위제하에서 각국 통화는 금의 중량을 기준으로 그 가치가 정해져 있으므로 통화간 교환비율은 금을 통하여 고정되며 따라서 금본위제는 전형적인 고정환율제도이다. 1800년대 영국의 금본위제 도입을 시작으로 독일, 네덜란드, 노르웨이, 스웨덴, 덴마크, 프랑스, 일본 등 주요 국가들이 금본위제를 채택하였다. 금본위제는 금의 국제수지 및 국내물가 자동 조절기능을 통해 국제금융 및 세계경제의 발전에 공헌하였으나 1차세계대전 이후 주요국들이 과다한 전비지출로 말미암은 인플레이션과 정치적 불안 등의 문제에 직면하면서 이들 국가를 중심으로 제도의 유용성에 대한 의문이 높아졌다. 특히, 전후 영국이 과대평가된 파운드화의 가치로 인한 막대한 실업과 수출산업의 침체를 겪고 이어서 독일의 초인플레이션, 세계 대공황 등이 발생함에 따라 영국은 1931년금본위제를 포기하고 파운드화의 평가절하를 단행하였다. 이후 주요 선진국들도 금본위제를 포기하고 변동환율체제로 전환하면서 금본위제는 결국 붕괴하였다.","p":56},{"t":"핀테크","c":"미래","d":"금융(Finance)과 기술(Technology)의 합성어. 정보통신 기술을 활용한 새로운 금융 서비스를 말한다.","x":"스마트폰 간편 송금, 간편 결제 앱이 대표적인 핀테크이다.","o":"핀테크(FinTech)는 ‘금융’(finance)과 ‘기술’(technology)의 합성어로 기존 디지털 기술혁신을 통해 금융서비스를 획기적으로 효율화하거나 새 금융서비스를 출시하는 것을 뜻한다. 이는 혁신의 정도에 따라 전통적(traditional) 핀테크와 신흥(emergent) 핀테크로 구분할 수 있다. 전통적 핀테크는 기존 금융서비스의 가치사슬 안에서 그 서비스의 효율을 높이는 역할을 한다. 즉 기존 금융서비스를 자동화하려는 금융회사가 가치사슬의 핵심에 위치하고 IT기업은 이를 보조하는 역할을 수행한다. 씨티은행이 블록체인 및 분산원장기술을 활용해서 디지털화폐(Citicoin)로 글로벌 본･지점을 연결하여 자금을 결제･청산하는 시스템을 예시로 들 수 있다. 반면 신흥 핀테크는 플랫폼을 제공하는 IT기업이 가치사슬의 핵심을 맡고 기존 금융서비스 전달체계를 변혁하여 파괴적 (disruptive) 속성을 갖는다. 지점이 없는 인터넷전문은행이 공인인증서 없는 비대면 거래로 기존 관행을 파괴함으로써 단기간에 대규모 고객을 확보하거나, 대출금리와 송금수수료도 파격적으로 낮춤으로써 기존 은행의 금리 및 수수료를 인하시키는 것을 예시로 들 수 있다. 이외에도 핀테크 사례로서 인터넷뱅킹･모바일지급서비스･크라우드펀딩･P2P대출･로보어드바이저･스마트계약･바이오인증 금융거래 등을 들 수 있다.","p":319},{"t":"인터넷전문은행","c":"미래","d":"오프라인 지점 없이 인터넷과 모바일로만 영업하는 은행.","x":"지점이 없어 비용이 적게 들기 때문에 예금 금리를 높게 주기도 한다.","o":"점포없이 또는 소수의 영업점만을 두고 인터넷, 모바일, ATM 등 전자매체를 주된 영업채널로 활용하는 온라인 기반의 은행으로서, 이는 은행서비스를 인터넷으로 제공하는 영업방식을 뜻하는 인터넷뱅킹과는 다른 개념이다. 인터넷전문은행이 은행업을 영위하기 위해서는 금융위원회로부터 인가를 받아야 하며, 이를 위해서는 500억원 이상의 자본금, 소유 규제에 적합한 주주구성, 업무범위에 적합한 인력 및 시설 등의 요건을 갖춰야 한다. 2017년 12월말 현재 우리나라에는 케이뱅크은행(2017.4월), 한국카카오은 행(2017.7월) 등 2개가 인터넷전문은행으로 인가받아 영업을 하고 있다.","p":225},{"t":"모바일뱅킹","c":"미래","d":"스마트폰 등 휴대 기기로 계좌 조회, 송금 같은 은행 업무를 보는 것.","x":"은행에 가지 않고 앱으로 친구에게 돈을 보낸다.","o":"모바일뱅킹 서비스는 고객이 휴대전화 등 모바일기기를 수단으로 무선인터넷을 통하여 금융기관에 접속하여 이용할 수 있는 금융서비스이다. 동 서비스는 은행이 이동통신회사의 무선인터넷망을 통해 고객의 자금이체 및 계좌조회 등 금융거래과정 전반을 관리하는 것을 기본구조로 하고 있다. 1999년 농협은행 등이 제공하기 시작한 국내 모바일뱅킹서비스는 2009년 스마트폰기반 모바일뱅킹 서비스가 개시된 이후에는 주로 스마트폰을 통해 제공되고 있다. 모바일뱅킹을 통해 제공되고 있는 서비스에는 예금조회, 거래명세조회, 자금이체 등이 있으며, 일부 은행에서는 현금서비스, 대출, 환율조회, 수표조회, 사고신고 등의 서비스까지 제공하고 있다. 모바일뱅킹 서비스는 수출입은행을 제외한 대부분의 국내은행 및 우체국, 신용협동조합 및 새마을금고중앙회 등에서 제공되고 있다.","p":112},{"t":"직불카드","c":"미래","d":"물건을 사면 내 은행 계좌에서 바로 돈이 빠져나가는 카드. 계좌에 있는 돈만큼만 쓸 수 있다.","x":"신용카드와 달리 외상이 아니어서 과소비를 막는 데 도움이 된다.","o":"직불카드(debit card)는 카드소지인(고객)이 물품이나 서비스를 구매하는 경우 동 카드를 이용하여 판매점에 설치되어 있는 단말기와 카드 발급은행의 주전산기를 통하여 고객의 예금계좌에서 구매대금을 인출하고 이를 판매자의 예금계좌로 자동이체해 주는 용도로 사용되는 카드이다. 직불카드는 백화점, 슈퍼마켓 등 판매점에서 물품판매와 동시에 고객의 계좌에서 대금이 이체되어 현금을 지급하는 것과 동일한 효과가 있으므로 EFT/POS (Electronic Funds Transfer at the Point of Sales)카드라고도 부른다. 우리나라에서는 1996년 2월부터 본격 가동되기 시작한 직불카드공동망을 통하여 서비스가 제공되고 있다.","p":276},{"t":"전자화폐","c":"미래","d":"돈의 가치를 IC칩이나 컴퓨터에 전자 정보로 저장해 현금처럼 쓸 수 있게 한 것.","x":"교통카드에 돈을 충전해 버스 요금을 낸다.","o":"IC카드 등에 화폐가치를 저장하였다가 상품 등의 구매에 사용할 수 있는 전자지급수단으로서 범용성과 환금성을 갖춘 것을 말한다. 전자화폐(electronic money)의 유형은 가치저장 매체에 따라 IC카드형과 네트워크형으로 구분할 수 있다. IC카드형은 플라스틱카드 위에 부착된 IC칩에 화폐가치를 저장하였다가 상품이나 서비스를 구매한 후 가맹점용 단말기 등을 통하여 대금을 지급하는 형태의 전자화폐로 국내에는 K-Cash, VisaCash, MYbi 등이 있다. 인터넷 네트워크를 통하여 구매대금을 지급하는 형태의 네트워크형전자화폐는 현재는 발행되지 않고 있다.","p":250},{"t":"블록체인","c":"미래","d":"거래 기록을 하나의 중앙 서버가 아니라 참여자 모두가 나누어 보관하고 함께 확인하는 기술. 기록을 몰래 바꾸기 어렵다.","x":"비트코인 같은 암호자산은 블록체인 기술로 거래 기록을 관리한다.","o":"블록체인(block chain)은 ① 일정 시간 동안 발생한 모든 거래정보를 블록(block) 단위로 기록하여 ② 모든 구성원들에게 전송하고 ③ 블록의 유효성이 확보될 경우이 새 블록을 ④ 기존의 블록에 추가 연결(chain)하여 보관하는 방식의 알고리즘이다. 각 블록은 이전 블록에 대한 연결자인 해시포인터(a hash pointer, 위변조 점검 수단), 시간표시 및 거래데이터를 포함한다. 블록체인은 효율적이고 검증 가능한 방식으로 거래를 기록할 수 있는 개방된 분산원장 즉, 데이터베이스 역할을 한다. 이는 참여자간공유(peer to peer) 네트워크가 집단적으로 새 블록을 검증하기 위한 프로토콜에 따라관리된다. 그래서 만약 누군가 거래기록을 조작하려면 참여자간 연결된 모든 블록을 새 블록 생성 이전에 조작해야한다. 즉 일정 시간 안에 수많은 블록을 모두 조작해야하는 데, 이는 사실상 불가능하므로 보안성이 높은 것이다. 이 블록체인 덕분에 새로운 단위가 치의 거래가 오직 한번만 이뤄짐으로써, 사기행위와 같은 이중 지급(double spending) 문제를 해결할 수 있게 되었다. 또한 블록체인에서는 ‘제3의 기관’이 필요 없는 탈중앙화와 중개기관을 거치지 않는 탈중개화가 이뤄지기 때문에 거래비용이 획기적으로 낮아진다. 그래서 블록체인은 비트코인･이더리움(Etherium) 등 가상통화 운용의 기반이 될 뿐만 아니라 스마트계약, 증권 발행 및 거래, 해외송금 및 자금이체, 무역금융, 부동산등기, 고가품(예: 다이아몬드)의 정품 인증, 디지털 ID 관리, 전자투표, 개인건강기록관리 등 여러 분야에서 무한한 혁신 잠재력을 지니고 있다.","p":136},{"t":"비트코인","c":"미래","d":"중앙은행 없이 블록체인 기술로 만들어진 대표적인 암호자산(가상통화). 2009년 처음 등장했다.","x":"비트코인은 가격 변동이 매우 커서 투자 위험이 크다.","o":"비트코인(bitcoin)은 가상통화(암호통화)이자 디지털 지급시스템이다. 비트코인 시스템은 중앙 저장소 또는 단일 관리자가 없기 때문에 최초의 탈중앙화된 디지털통화라고 불린다. 이는 사토시 나카모토라는 사람(집단)에 의해 만들어져서 2009년 개방형 소프트웨어로 배포되었다. 이 시스템은 공유형(peer-to-peer)이며, 거래는 중개자 없이 블록체인 소프트웨어를 이용하는 참여자(nodes) 사이에 직접 이뤄진다. 이런 거래들은 공유(P2P) 네트워크상 참여자의 작업증명(proof-of-work)을 통해 검증되고 공개된 분산원장인 블록체인에 기록된다. 승인된 거래의 새 그룹인 한 블록은 대략 10분에 한 번씩 만들어져서 블록체인에 추가되고 신속하게 모든 참여자에게 보내어진다. 비트코인은 대규모 전기를 사용하는 컴퓨터 처리 능력(power)을 활용해서 이뤄지는 기록보관 서비스인 채굴(mining)에 대한 보상으로 발행되고 있으며 다른 통화･상품･용역 등과 교환되어가고 있다. 중앙은행이 발행한 법정화폐가 아닌 비트코인은 비트코인 플랫폼에서 거래되며 투자대상으로서도 관심을 받고 있다. 하지만 급등한 가격 및 심한 변동 폭으로 거품논란이 크다. 또한 익명성으로 자금세탁 등 불법거래에 악용될 소지가 많아 중국 등 일부 국가에서 비트코인 등 가상통화의 거래를 규제하고 있다. 일본의 경우 비트코인의 거래이익에 대해 세금을 부과한다. 비트코인은 추가되는 한 블록당 새로 12.5비트코인을 보상하는데(2016.7월 현재), 21만개가 채굴될 때(대략 4년)마다 그 보상이 반으로 줄어든다. 비트코인의 총량은 21백만개이며 2140년경 모두 채굴될 것으로 전망된다. 비트코인은 그 시스템의 설계시 그 수량을 한정시켜 놓았기 때문에 원칙적으로 인플레이션에 의해 가치가 떨어질 수 있는 화폐와 다른속성을 지닌다. 한편 2017년 8월 1일 비트코인(classic bitcoin)에서 ‘비트코인캐시’(BCH)가, 10월 25일 ‘비트코인골드’(BTG)가 하드포크(hard-fork)되어 별도로 거래되고 있다.","p":139},{"t":"크라우드펀딩","c":"미래","d":"많은 사람(crowd)에게서 인터넷을 통해 조금씩 돈을 모아(funding) 사업이나 프로젝트 자금을 마련하는 방식.","x":"독립영화 제작자가 온라인에서 여러 사람의 후원을 받아 영화를 만들었다.","o":"크라우드펀딩(crowd funding)은 온라인 플랫폼(중개업자)을 통해 다수의 개인들로부터 자금을 조달하는 금융서비스이다. 이는 세 행위주체 즉, ① 아이디어 또는 프로젝트기획자(자금수요자) ② 아이디어를 지원･전파하는 다수의 개인 또는 집단(자금공급자) ③ 아이디어를 실행하도록 이끄는 중개자 또는 조직(플랫폼)으로 이뤄진다. 부연하면 이는 자금수요자가 은행 등 금융중개기관을 거치지 않고 직접 자금공급자를 모집하는 새로운 방식의 자금조달 수단이며, 그 운용과정에서 빅데이터를 이용한 신용평가 등 디지털기술이 활용될 수 있다. 아이디어 기획자는 크라우드펀딩을 통해 자신의 평판을 높이고 해당 프로젝트에 대한 마케팅 효과를 얻으며 참여자로부터 직접 피드백을 얻을 수도 있지만, 초기단계인 아이디어의 공개로 자신의 지적재산권(IP)을 침해받을 수도 있다. 자금공급자(투자)는 온라인 플랫폼을 통한 의사결정으로 거래･탐색비용을 줄일수 있는 반면 상대방의 프로젝트 진행상황에 대한 정보 부족이나 적절한 모니터링이 어려운 정보의 비대칭(asymmetry) 리스크에 노출될 수도 있다. 크라우드펀딩은 자금모집 방식 및 목적에 따라 크게 후원(기부)형･대출형･투자(증권)형 등으로 구분된다. 후원 (기부)형은 예술･복지 등의 분야에서 프로젝트에 자금을 후원하거나 단순하게 기부하는 형태이다. 대출형은 자금이 필요한 개인, 소규모 사업자 등에 소액 대출을 지원하는 유형으로 P2P대출처럼 대출금에 대한 이자수취가 목적이다. 투자(증권)형은 투자금액에 비례한 지분취득과 이익배당을 목적으로 하며 창의적인 아이디어나 기술을 가진 창업기업 등이 초기 사업자금을 조달하는데 유용하다.","p":295},{"t":"로보어드바이저","c":"미래","d":"로봇(robot)과 투자 자문가(advisor)의 합성어. 컴퓨터 프로그램이 투자자에게 맞는 투자 방법을 알려 주거나 대신 관리해 주는 서비스.","x":"앱에 투자 성향을 입력하면 알고리즘이 펀드 구성을 추천해 준다.","o":"로보어드바이저(robo-advisor)는 로봇(robot)과 자문가(advisor)의 합성어이다. 이는 인공지능 알고리즘, 빅데이터 등을 활용하여 투자자의 투자성향･리스크선호도･목표수익률 등을 분석하고 그 결과를 바탕으로 투자자문･자산운용 등 온라인 자산관리서비스를 제공하는 것이다. 서비스 제공 과정에서 비용으로 작용하는 사람의 개입을 최소화함으로써 기존 자산관리서비스보다 더 낮은 최소투자금액과 더 싼 수수료로 소액 자산을 가진 일반 개인도 더 쉽게 접근할 수 있게 되었다. 로보어드바이저 서비스는 금융회사의 자문 또는 운용인력이 로보어드바이저의 자산배분 결과를 활용하여 고객에게 자문(자문형)하거나 고객 자산을 직접 운용(일임형)하는 형태나, 로보어드바이저가 고객에게 자문하거나 고객 자산을 직접 운용하는 형태로 이뤄진다. 로보어드바이저 시장에서는 미국이 가장 앞서 나가고 있다. 우리나라의 경우 2017년 12월 현재 금융기관의 28개 알고리즘이 코스콤(KOSCOM)의 제1, 2차 테스트베드를 통과하여 은행, 증권사 및 투자자문사 등 총 19개 금융기관이 로보어드바이저 서비스를 제공하고 있다.","p":103},{"t":"빅데이터","c":"미래","d":"기존 방법으로는 처리하기 어려울 만큼 많고 다양한 데이터. 이를 분석해 새로운 정보와 가치를 얻는다.","x":"카드 사용 기록을 분석해 지역별 소비 흐름을 파악한다.","o":"빅데이터(big data)란 복잡하고 다양한 대규모 데이터세트 자체는 물론 이 데이터세트로부터 정보를 추출하고 결과를 분석하여 더 큰 가치를 창출하는 기술을 뜻한다. 수치데이터 등 기존의 정형화된 정보뿐 아니라 텍스트･이미지･오디오･로그기록 등 여러형태의 비정형 정보가 데이터로 활용된다. 최근 모바일기기와 SNS 이용 보편화, 사물인 터넷 확산 등으로 데이터의 양이 기하급수적으로 늘어나고 있다. 하지만 저장매체의 가격 하락 등으로 데이터 관리비용이 감소하고, 클라우드 컴퓨팅 등으로 데이터 처리･분석 기술도 발전하면서 빅데이터 활용 여건은 계속 개선되어가고 있다. 빅데이터 관련기술은 데이터를 수집･저장하는 데이터 ‘처리기술’과 데이터를 분석･시각화하는 데이터 ‘분석기술’로 구성된다. 데이터 처리기술의 발달은 저가의 서버와 하드디스크를 여러대 연결하여 대용량 데이터를 분산 처리함으로써 기존의 고비용 데이터 분석 솔루션을 대체하였다. 데이터 분석기술의 발달은 기존 데이터 분석에서는 불가능했던 비선형적상관관계 규명, 감성분석 등 비정형화된 분석도 가능하게 만들었다. 여기서 감성분석은 텍스트 채굴(text mining) 기술의 하나로 텍스트(예 : 상품 품평)에 나타난 사람들의 태도･의견･성향 등 주관적인 속성을 지닌 데이터 추출･분석기법이다. 이처럼 빅데이터는 대량(high-volume), 초고속(high-velocity), 고다양성(high-variety), 고가변성(high-variability) 의 특성을 지니며 고정확성(high-veracity)을 확보해야하는 정보 자산이다.","p":139},{"t":"4차 산업혁명","c":"미래","d":"인공지능, 사물인터넷, 빅데이터 같은 정보통신 기술이 산업과 생활 전반에 융합되어 일어나는 큰 변화.","x":"공장 기계들이 인터넷으로 연결되어 스스로 생산을 조절하는 스마트 공장.","o":"4차 산업혁명(4IR; Fourth Industrial Revolution)은 18세기초 산업혁명 이후 진행되어온 4차 주요 산업시대로서, 2010년대부터 물리적, 디지털 및 생물학적 세계가 융합되어모든 학문･경제･산업 등에 전반적으로 충격을 주게 된 새로운 기술영역의 등장을 뜻한 다. 이는 클라우스 슈밥(Klaus Schwab)이 자신이 주도하는 2016년 세계경제포럼(WEF) 에서 경제에 대한 디지털화 및 인공지능(AI)의 영향으로 4차 산업혁명을 ‘제2 기계시대’와 연관시키고, 여기에 생물학적 기술의 진전을 위한 광범위한 역할을 추가한 자신의 통찰을 부각시키면서 사용한 용어이다. 또한 그는 ｢4차 산업혁명｣이라는 자신의 저서에서 인공지능(AI)･로봇･사물인터넷･3D프린팅･자율자동차･양자컴퓨팅･나노테크 등과 같은 영역에서 이뤄질 기술 혁신(breakthroughs)을 4차 산업혁명의 특징으로 보았다. 4차 산업혁명은 종전의 산업혁명과 달리 2010년대에 시작된 사물인터넷･인공지능･클라우드컴퓨팅･빅데이터의 발달로 초연결성(hyperconnectivity), 초지능(superintelligence), 더빠른 속도(velocity), 더 많은 데이터 처리능력(volume), 더 넓은 파급 범위(scope) 등의 특성을 지니는 ‘초연결지능 혁명’으로 볼 수 있다. 하지만 인공지능의 작업 대체로 일자리감소, 인간과 로봇(인공지능)의 공존, 개인정보 및 사생활 보호, 유전자 조작에 따른생명윤리 등 여러 과제를 지니고 있다.","p":143},{"t":"탄소배출권","c":"미래","d":"온실가스를 배출할 수 있는 권리. 기업은 할당량보다 적게 배출하면 남은 권리를 다른 기업에 팔 수 있다.","x":"배출량을 줄인 기업이 남은 배출권을 팔아 수익을 얻는다.","o":"탄소배출권(CERs; Certified Emission Reductions)은 온실가스를 일정기간 동안 배출할 수 있는 권리를 말한다. 그리고 배출권 거래제도는 교토의정서에 따라 도입된 3가지 제도 중의 하나로서 온실가스 감축 의무가 있는 국가가 할당받은 배출량보다 적은 양을 배출할 경우 남는 탄소배출권을 다른 국가에 판매할 수 있는 제도를 지칭한다. 이러한 제도를 통해 특정 국가는 배출량을 최대한 줄임으로써 배출권 판매에 따른수익을 기대할 수 있고, 배출량 감축비용이 상대적으로 높은 국가는 이보다 낮은 비용으로 배출권을 구입해 온실가스 감축비용을 줄일 수 있다. 이는 환경문제를 시장원리와 연계하여 온실가스 감축을 촉진하기 위한 기반을 마련한 것으로 평가된다.","p":296}]</script>
<script>
(function(){
"use strict";
const T = JSON.parse(document.getElementById("termData").textContent);
T.forEach((t,i)=>t.i=i);
const CATS = [
  ["기초","경제의 기초"],["시장","시장과 소비"],["국민경제","국민경제와 성장"],["물가고용","물가와 고용"],
  ["정부","정부와 분배"],["금융","금융과 화폐"],["국제","국제경제와 환율"],["미래","디지털 금융과 미래"]
];
const CATNAME = Object.fromEntries(CATS);
const QN = 20;              // 퀴즈 문항 수

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeQuiz(){
  // 분야별 문항 수를 용어 수에 비례해 배분 (합계 20)
  const sizes=CATS.map(([c])=>T.filter(t=>t.c===c).length);
  let alloc=sizes.map(s=>Math.max(1,Math.floor(s/T.length*QN)));
  while(alloc.reduce((a,b)=>a+b,0)<QN){let best=0,bv=-1;sizes.forEach((s,k)=>{const r=s/T.length*QN-alloc[k];if(r>bv){bv=r;best=k}});alloc[best]++}
  const picks=[];
  CATS.forEach(([c],k)=>picks.push(...shuffle(T.filter(t=>t.c===c)).slice(0,alloc[k])));
  shuffle(picks);
  return picks.map((t,n)=>{
    const type=n%2===0?"def":"term"; // def: 설명 보고 용어 고르기 / term: 용어 보고 설명 고르기
    const same=shuffle(T.filter(x=>x.c===t.c&&x.i!==t.i));
    const other=shuffle(T.filter(x=>x.c!==t.c));
    const wrong=[...same.slice(0,2),...other.slice(0,1)];
    return {i:t.i,type,opts:shuffle([t.i,...wrong.map(w=>w.i)])};
  });
}
function masked(t){
  let s=t.d;
  const names=t.t.split("/").flatMap(n=>[n,n.replace(/\(.*?\)/g,"").trim()]).filter(n=>n.length>1).sort((a,b)=>b.length-a.length);
  names.forEach(n=>{s=s.split(n).join("○○")});
  return s;
}

      ? el("span",{class:"confirm"},"기록을 지우고 다시 보게 할까요?",el("button",{class:"btn sm",onclick:async()=>{await sb.from("quiz_results").delete().eq("id",r.id);TS.confirm=null;fetchAll()}},"초기화"),el("button",{class:"btn sm",onclick:()=>{TS.confirm=null;renderTeacher()}},"취소"))
      : el("button",{class:"btn sm",onclick:()=>{TS.confirm=r.id;renderTeacher()}},"재응시 허용"))));
  const table=el("div",{class:"tbl"},el("table",{},
    el("thead",{},el("tr",{},th("cls","반"),el("th",{class:"num",text:"번호"}),th("name","이름"),el("th",{text:"상태"}),th("score","점수",1),el("th",{class:"num",text:"정답"}),th("studied","학습한 용어",1),th("dur","소요 시간",1),th("time","완료 시각"),el("th",{text:""}))),
    el("tbody",{},body.length?body:el("tr",{},el("td",{colspan:"10",class:"empty",text:"아직 퀴즈를 본 학생이 없어요. 학생이 퀴즈를 시작하면 15초 안에 여기에 나타나요."})))));
  const byCls=classes.map(c=>{const d=done.filter(r=>r.cls===c);return[c,d.length?d.reduce((a,r)=>a+r.score,0)/d.length:null,d.length]});
  const clsBox=el("div",{class:"box"},el("h3",{text:"반별 평균 점수"}),
    byCls.length?byCls.map(([c,a,n])=>el("div",{class:"hb"},el("span",{text:c+"반 ("+n+")"}),el("span",{class:"tr"},el("i",{style:"width:"+(a||0)+"%"})),el("span",{class:"v",text:a==null?"-":a.toFixed(1)}))):el("p",{class:"empty",text:"기록이 없어요."}));
  const miss={},asked={};
  sel.forEach(r=>{(r.wrong||[]).forEach(i=>{if(T[i])miss[T[i].t]=(miss[T[i].t]||0)+1});(r.questions||[]).forEach(q=>{if(T[q.i])asked[T[q.i].t]=(asked[T[q.i].t]||0)+1})});
  const top=Object.entries(miss).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const missBox=el("div",{class:"box"},el("h3",{text:"많이 틀린 용어"}),
    top.length?el("ol",{class:"miss"},top.map(([n,c])=>el("li",{},n+" ",el("span",{text:c+"명 오답 / "+asked[n]+"명 출제"})))):el("p",{class:"empty",text:"기록이 없어요."}));
  const csvBtn=el("button",{class:"btn sm",onclick:()=>{
    const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
    const lines=[["반","번호","이름","상태","점수","정답수","학습한용어","소요(초)","완료시각","틀린용어"].map(q).join(",")];
    rows.forEach(r=>lines.push([r.cls,r.num,r.name,r.status==="done"?"완료":"푸는중",r.score,r.correct,r.studied,r.duration_sec,r.finished_at?new Date(r.finished_at).toLocaleString("ko-KR"):"",(r.wrong||[]).map(i=>T[i]?T[i].t:"").join(" / ")].map(q).join(",")));
    const blob=new Blob(["﻿"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
    const a=el("a",{href:URL.createObjectURL(blob),download:"경제용어퀴즈_점수"+(TS.cls==="all"?"":"_"+TS.cls+"반")+".csv"});
    document.body.append(a);a.click();a.remove();
  }},"엑셀(CSV)로 저장");
  root.append(
    el("div",{class:"tbar"},el("h2",{style:"margin:0;font-family:var(--f-display);font-weight:400;font-size:26px;margin-right:auto",text:"퀴즈 점수 비교"}),clsSel,
      el("button",{class:"btn sm",onclick:fetchAll},"새로고침"),csvBtn,
      el("button",{class:"btn sm",onclick:async()=>{await sb.auth.signOut();S.teacher=null;$("#tabTeacher").hidden=true;renderWho();show("study")}},"로그아웃")),
    el("p",{style:"margin:0;color:var(--muted);font-size:14px",text:"15초마다 자동으로 새로 불러와요. 열 이름을 누르면 정렬돼요."}),
    ...(TS.err?[el("div",{class:"note bad",text:"점수를 불러오지 못했어요: "+TS.err})]:[]),
    stats,
    el("div",{class:"tgrid"},table,el("div",{class:"side"},clsBox,missBox)));
}
function stat(l,v){return el("div",{class:"stat"},el("small",{text:l}),el("b",{text:v}))}

/* ---------- 화면 전환 ---------- */
function show(v){
  ["study","quiz","teacher"].forEach(x=>{$("#v"+x[0].toUpperCase()+x.slice(1)).hidden=x!==v});
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current",String(b.dataset.v===v)));
  if(v!=="teacher") ls.set("view",v);
  clearInterval(TS.timer);
  if(v==="quiz") renderQuiz();
  if(v==="teacher"){ renderTeacher(); if(S.teacher){fetchAll(); TS.timer=setInterval(()=>{if(!document.hidden)fetchAll()},15000);} }
  window.scrollTo({top:0});
}
document.querySelectorAll("nav.tabs button").forEach(b=>b.addEventListener("click",()=>show(b.dataset.v)));
$("#teacherLink").addEventListener("click",()=>show("teacher"));
$("#q").addEventListener("input",renderList);
$("#flt").addEventListener("change",renderList);
document.addEventListener("keydown",e=>{
  if($("#vStudy").hidden||e.target.matches("input,select,textarea")) return;
  if(e.key==="ArrowRight") step(1); else if(e.key==="ArrowLeft") step(-1);
});
function loadLocal(){
  S.learned=new Set(ls.get("learned",[]).filter(i=>T[i]));
  const c=ls.get("cur",0); S.cur=T[c]?c:0;
}
function renderAll(){renderChips();renderList();renderDetail();renderProgress();renderWho()}
async function afterAuth(){
  if(!sb) return;
  const {data}=await sb.auth.getSession();
  S.teacher=data&&data.session?data.session.user.email:null;
  $("#tabTeacher").hidden=!S.teacher; renderWho();
}

/* ---------- 시작 ---------- */
loadLocal(); renderAll();
show(ls.get("view","study"));
(async()=>{ await Promise.all([loadResult(),afterAuth()]); if(!$("#vQuiz").hidden) renderQuiz(); })();
})();
</script>
